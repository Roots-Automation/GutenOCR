repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ruff-check-all
        name: ruff check (whole repo)
        stages: [pre-push]
        language: system
        entry: uv tool run ruff check .
        pass_filenames: false
      - id: ruff-format-all
        name: ruff format --check (whole repo)
        stages: [pre-push]
        language: system
        entry: uv tool run ruff format --check .
        pass_filenames: false
