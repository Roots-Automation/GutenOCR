# ---------------------------------------------------------------------------
# Weierstrass M-test
# ---------------------------------------------------------------------------

[[template]]
name  = "weierstrass_m_test"
latex = '\sum{lim_mod}_{{n=1}}^\infty \left|{f}_n({x})\right| \leq {M}_n, \; \sum{lim_mod}_{{n=1}}^\infty {M}_n < \infty \implies \sum{lim_mod}_{{n=1}}^\infty {f}_n \text{{ converges uniformly}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.M]
type = "S"
pool = ['M', 'C', 'K', 'B', 'A', 'L']

# ---------------------------------------------------------------------------
# Arzelà-Ascoli theorem
# ---------------------------------------------------------------------------

[[template]]
name  = "arzela_ascoli"
latex = '\left\{{{f}_n({x})\right\}} \text{{ equicontinuous and uniformly bounded}} \implies \text{{has uniformly convergent subsequence}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

# ---------------------------------------------------------------------------
# Banach fixed-point theorem
# ---------------------------------------------------------------------------

[[template]]
name  = "banach_fixed_point"
latex = '\exists!\, x^* : {T}(x^*) = x^*, \quad x_{{n+1}} = {T}(x_n) \to x^*'

[template.slots.T]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

# ---------------------------------------------------------------------------
# Series convergence tests (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "convergence_tests"
latex = ""

[[template.variants]]
name     = "comparison_test"
latex    = '0 \leq {a}_n \leq {b}_n, \; \sum {b}_n < \infty \implies \sum {a}_n < \infty'
distinct = [["a", "b"]]

[template.variants.slots.a]
type = "S"
pool = ['a', 'x', 'u', 'p', 'c']

[template.variants.slots.b]
type = "S"
pool = ['b', 'y', 'v', 'q', 'd']

[[template.variants]]
name  = "integral_test"
latex = '\sum{lim_mod}_{{n=1}}^\infty {f}(n) \text{{ converges}} \iff \int_1^\infty {f}({t})\,d{t} < \infty'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.t]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[[template.variants]]
name     = "limit_comparison_test"
latex    = '\lim_{{{v} \to \infty}} \frac{{{a}_{{{v}}}}}{{{b}_{{{v}}}}} = {L} \in (0, \infty) \implies \sum {a}_n \text{{ and }} \sum {b}_n \text{{ same convergence}}'
distinct = [["a", "b"]]

[template.variants.slots.a]
type = "S"
pool = ['a', 'x', 'u', 'p']

[template.variants.slots.b]
type = "S"
pool = ['b', 'y', 'v', 'q']

[template.variants.slots.v]
type = "S"
pool = ['n', 'm', 'k', 'j']

[template.variants.slots.L]
type = "E"
gen  = "_atom"
n    = 150

# ---------------------------------------------------------------------------
# Ratio test
# ---------------------------------------------------------------------------

[[template]]
name  = "ratio_test"
latex = '\lim_{{{v} \to \infty}} \left|\frac{{{seq}_{{{v}+1}}}}{{{seq}_{{{v}}}}}\right| = {L} < 1 \implies \sum {seq}_n \text{{ converges absolutely}}'

[template.slots.seq]
type = "S"
pool = ['a', 'b', 'c', 'x', 'y', 'u', 'v', 'p']

[template.slots.v]
type = "S"
pool = ['n', 'm', 'k', 'j']

[template.slots.L]
type = "E"
gen  = "_atom"
n    = 150

# ---------------------------------------------------------------------------
# Root test
# ---------------------------------------------------------------------------

[[template]]
name  = "root_test"
latex = '\limsup_{{{v} \to \infty}} \left|{seq}_{{{v}}}\right|^{{1/{v}}} = {L} < 1 \implies \sum {seq}_n \text{{ converges absolutely}}'

[template.slots.seq]
type = "S"
pool = ['a', 'b', 'c', 'x', 'y', 'u', 'v', 'p']

[template.slots.v]
type = "S"
pool = ['n', 'm', 'k', 'j']

[template.slots.L]
type = "E"
gen  = "_atom"
n    = 150

# ---------------------------------------------------------------------------
# Alternating series
# ---------------------------------------------------------------------------

[[template]]
name  = "alternating_series"
latex = '{a}_{{{v}}} \searrow 0 \implies \sum{lim_mod}_{{{v}={v0}}}^\infty (-1)^{{{v}}} {a}_{{{v}}} \text{{ converges}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.a]
type = "S"
pool = ['a', 'b', 'c', 'x', 'y', 'u', 'v', 'p']

[template.slots.v]
type = "S"
pool = ['n', 'm', 'k', 'j']

[template.slots.v0]
type = "S"
pool = ['0', '1', '2', '3', 'n_0', 'N']

# ---------------------------------------------------------------------------
# Uniform / pointwise convergence (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "uniform_convergence"
latex = ""

[[template.variants]]
name  = "pointwise_conv"
latex = '{f}_n({x}) \to {f}({x}) \quad \text{{for all }} {x} \in D'

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[[template.variants]]
