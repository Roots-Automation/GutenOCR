[meta]
name        = "analysis"
version     = "1.0.0"
author      = "GutenOCR"
license     = "MIT"
description = "Real analysis and functional analysis"

# ---------------------------------------------------------------------------
# Slot pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "VARS_POOL"
values = ['x', 'y', 'z', 't', 'u', 'v', 'r', 's']

[[pool]]
name   = "GEO_N_POOL"
values = ['n', 'm', 'N', 'M', 'K', 'k', 'p', 'r']

[[pool]]
name   = "SEQ_POOL"
values = ['a', 'b', 'c', 'f', 'g', 'h']

[[pool]]
name   = "SP_POOL"
values = ['L^2(\Omega)', 'L^p(\Omega)', 'H^1(\Omega)', 'H']

[[pool]]
name   = "NN_POOL"
values = ['n', 'k', 'm']

[[pool]]
name   = "DOM_POOL_SMALL"
values = ['\Omega', '[0,1]', '\mathbb{R}^n']

[[pool]]
name   = "DOM_POOL"
values = ['\mathbb{R}', '\mathbb{R}^n', '[a,b]', '\mathbb{C}', '\mathbb{Z}']

[[pool]]
name   = "BSLVAR_POOL"
values = ['A', 'B', 'C', 'S', 'T']

[[pool]]
name   = "SPACE_POOL"
values = ['L^p', 'L^2', 'L^\infty', '\mathcal{H}', 'C([a,b])']

# ---------------------------------------------------------------------------
# Epsilon-delta definitions (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "epsilon_delta_limit"
latex = ""

[[template.variants]]
name  = "limit_def"
latex = '\forall {eps} > 0 \; \exists {tol} > 0 : |{x} - {a}| < {tol} \Rightarrow |{f}({x}) - {L}| < {eps}'

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.variants.slots.a]
type = "E"
gen  = "_atom"
n    = 150

[template.variants.slots.L]
type = "E"
gen  = "_atom"
n    = 150

[template.variants.slots.eps]
type = "E"
gen  = "_eps_sub"
n    = 2

[template.variants.slots.tol]
type = "E"
gen  = "_tol_sub"
n    = 3

[[template.variants]]
name  = "continuity_def"
latex = '\forall {eps} > 0 \; \exists {tol} > 0 : |{x} - {c}| < {tol} \Rightarrow |{f}({x}) - {f}({c})| < {eps}'

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.variants.slots.c]
type = "E"
gen  = "_atom"
n    = 150

[template.variants.slots.eps]
type = "E"
gen  = "_eps_sub"
n    = 2

[template.variants.slots.tol]
type = "E"
gen  = "_tol_sub"
n    = 3

[[template.variants]]
name  = "uniform_continuity_def"
latex = '\forall {eps} > 0 \; \exists {tol} > 0 \; \forall {x}, {y} : |{x} - {y}| < {tol} \Rightarrow |{f}({x}) - {f}({y})| < {eps}'

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.variants.slots.y]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.variants.slots.eps]
type = "E"
gen  = "_eps_sub"
n    = 2

[template.variants.slots.tol]
type = "E"
gen  = "_tol_sub"
n    = 3

# ---------------------------------------------------------------------------
# L^p norm
# ---------------------------------------------------------------------------

[[template]]
name  = "lp_norm"
latex = '\|{f}\|_{{{p}}} = \left(\int \left|{f}({t})\right|^{{{p}}} d{t}\right)^{{1/{p}}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.slots.p]
type = "S"
pool = ['p', '2', 'q', 'r']

[template.slots.t]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

# ---------------------------------------------------------------------------
# Cauchy sequence criterion
# ---------------------------------------------------------------------------

[[template]]
name  = "cauchy_criterion"
latex = '|{seq}_m - {seq}_n| < {eps} \quad \forall m, n \geq {N}'

[template.slots.seq]
type = "S"
pool = ['x', 'a', 'y', 'z', 'u', 'v']

[template.slots.eps]
type = "E"
gen  = "_eps_sub"
n    = 2

[template.slots.N]
type = "E"
gen  = "_atom"
n    = 150

# ---------------------------------------------------------------------------
# Cauchy-Schwarz for sums
# ---------------------------------------------------------------------------

[[template]]
name     = "cauchy_schwarz_sums"
latex    = '\left|\sum{lim_mod}_{{i=1}}^{{{n}}} {a}_i {b}_i\right|^2 \leq \sum{lim_mod}_{{i=1}}^{{{n}}} {a}_i^2 \cdot \sum{lim_mod}_{{i=1}}^{{{n}}} {b}_i^2'
distinct = [["a", "b"]]

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.n]
type = "S"
pool = ['n', 'N', 'm', 'M', 'K', 'L', 'P']

[template.slots.a]
type = "S"
pool = ['a', 'u', 'p', 'x', 'c']

[template.slots.b]
type = "S"
pool = ['b', 'v', 'q', 'y', 'd']

# ---------------------------------------------------------------------------
# Triangle inequality in normed spaces (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "triangle_inequality_normed"
latex = ""

[[template.variants]]
name  = "triangle_scalar"
latex = '\left\|{u} + {v}\right\| \leq \left\|{u}\right\| + \left\|{v}\right\|'

[template.variants.slots.u]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.v]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[[template.variants]]
name  = "triangle_reverse"
latex = '\left| \left\|{u}\right\| - \left\|{v}\right\| \right| \leq \left\|{u} - {v}\right\|'

[template.variants.slots.u]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.v]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[[template.variants]]
name  = "triangle_sum_n"
latex = '\left\|\sum{lim_mod}_{{k=1}}^{{{n}}} {u}_k\right\| \leq \sum{lim_mod}_{{k=1}}^{{{n}}} \left\|{u}_k\right\|'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.u]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.n]
type = "S"
pool = "GEO_N_POOL"

[[template.variants]]
name  = "minkowski_integral"
latex = '\left(\int \left|{f}({t}) + {g}({t})\right|^{{{p}}} d{t}\right)^{{1/{p}}} \leq \left(\int |{f}({t})|^{{{p}}} d{t}\right)^{{1/{p}}} + \left(\int |{g}({t})|^{{{p}}} d{t}\right)^{{1/{p}}}'

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.g]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.variants.slots.t]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.variants.slots.p]
type = "S"
pool = ['p', '2', 'q', 'r']

# ---------------------------------------------------------------------------
# p-series convergence
# ---------------------------------------------------------------------------

[[template]]
name  = "p_series_convergence"
latex = '\sum{lim_mod}_{{k=1}}^{{\infty}} \frac{{1}}{{k^{{{s}}}}} < \infty \iff {s} > 1'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.s]
type = "S"
pool = ['p', '2', '3', 'q', 'r', '4', '5', '\alpha', '\beta']

# ---------------------------------------------------------------------------
# Hölder's inequality
# ---------------------------------------------------------------------------

[[template]]
name  = "holder_inequality"
latex = '\int |{f}({t}) \cdot {g}({t})| \, d{t} \leq \left(\int |{f}({t})|^{{{p}}}\, d{t}\right)^{{1/{p}}} \left(\int |{g}({t})|^{{{q}}}\, d{t}\right)^{{1/{q}}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.slots.g]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.slots.t]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = ['p', '2', 'r', 's', '3']

[template.slots.q]
type = "S"
pool = ['q', '2', 't', 'r', '4']

# ---------------------------------------------------------------------------
# Banach contraction mapping
# ---------------------------------------------------------------------------

[[template]]
name     = "banach_contraction"
latex    = '\|T({x}) - T({y})\| \leq {c_sym} \|{x} - {y}\|'
distinct = [["x", "y"]]

[template.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.y]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.c_sym]
type = "S"
pool = ['\lambda', 'k', 'c', '\kappa', '\rho', '\alpha', 'L']

# ---------------------------------------------------------------------------
# Uniform supremum bound
# ---------------------------------------------------------------------------

[[template]]
name  = "uniform_bound"
latex = '\sup_{{{x} \in {D}}} |{f}({x})| < \infty'

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 100

[template.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.D]
type = "S"
pool = ['X', 'D', 'A', '\Omega', 'K', 'U']

# ---------------------------------------------------------------------------
# Limsup / liminf / squeeze theorem (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "limsup_definition"
latex = ""

[[template.variants]]
name  = "limsup_def"
latex = '\limsup_{{{idx} \to {inf}}} {seq}_{{{idx}}} = \inf_{{{idx} \geq 1}} \sup_{{k \geq {idx}}} {seq}_k'

[template.variants.slots.seq]
type = "S"
pool = ['a', 'b', 'x', 'y', 'u', 'c', 'z', 'v']

[template.variants.slots.idx]
type = "S"
pool = ['n', 'm', 'j', 'r']
idx  = 0.25

[template.variants.slots.inf]
type = "S"
pool = ['\infty', '+\infty']

[[template.variants]]
name  = "liminf_def"
latex = '\liminf_{{{idx} \to {inf}}} {seq}_{{{idx}}} = \sup_{{{idx} \geq 1}} \inf_{{k \geq {idx}}} {seq}_k'

[template.variants.slots.seq]
type = "S"
pool = ['a', 'b', 'x', 'y', 'u', 'c', 'z', 'v']

[template.variants.slots.idx]
type = "S"
pool = ['n', 'm', 'j', 'r']
idx  = 0.25

[template.variants.slots.inf]
type = "S"
pool = ['\infty', '+\infty']

[[template.variants]]
name     = "squeeze_theorem"
latex    = '{a}_{{{idx}}} \leq {b}_{{{idx}}} \leq {c}_{{{idx}}}, \quad \lim_{{{idx} \to \infty}} {a}_{{{idx}}} = \lim_{{{idx} \to \infty}} {c}_{{{idx}}} = L \implies \lim_{{{idx} \to \infty}} {b}_{{{idx}}} = L'
distinct = [["a", "b", "c"]]

[template.variants.slots.a]
type = "S"
pool = ['a', 'x', 'u']

[template.variants.slots.b]
type = "S"
pool = ['b', 'y', 'v']

[template.variants.slots.c]
type = "S"
pool = ['c', 'z', 'w']

[template.variants.slots.idx]
type = "S"
pool = ['n', 'm', 'j', 'k']

