[meta]
domain = "stochastic_processes"

[[pool]]
name = "FUNC_POOL"
values = ["f","g","h","F","G",'\phi','\psi','\varphi','\chi','\xi','\eta']

[[pool]]
name = "PROC_POOL"
values = ["X","Y","Z","M","N","S","V",'\xi','\eta']

[[pool]]
name = "BM_POOL"
values = ["B","W",'\tilde{B}','\tilde{W}',"B^{(1)}","W^{(1)}"]

[[pool]]
name = "TIME_POOL"
values = ["t","s","u","T","r","t_0","t_1"]

[[pool]]
name = "STOP_POOL"
values = ['\tau','\sigma','\rho','\zeta',"T","S"]

[[pool]]
name = "COEFF_POOL"
values = ['\mu','\alpha','\beta','\gamma','\kappa','\theta',"a","b","c","k","r"]

[[pool]]
name = "DIFF_POOL"
values = ['\sigma','\varepsilon','\nu',"s","v",'\delta']

[[pool]]
name = "FILT_POOL"
values = ['\mathcal{F}','\mathcal{G}','\mathcal{H}','\mathbb{F}','\mathbb{G}']

[[pool]]
name = "IDX_POOL"
values = ["n","m","k","j","N","M"]

[[pool]]
name = "MEAS_POOL"
values = ['\mathbb{P}','\mathbb{Q}','\tilde{\mathbb{P}}','\mathbb{P}^*']

# --- Part A: Brownian Motion (10) ---

[[template]]
name = "brownian_increments"
latex = '{bm}_{{{t2}}} - {bm}_{{{t1}}} \sim \mathcal{{N}}(0,\, {t2} - {t1})'

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t1]
type = "S"
pool = "TIME_POOL"

[template.slots.t2]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t1"]

[[template]]
name = "brownian_variance"
latex = '\mathbb{{E}}\!\left[{bm}_{{{t}}}^2\right] = {t}'

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "brownian_covariance"
latex = '\mathbb{{E}}\!\left[{bm}_{{{t1}}} {bm}_{{{t2}}}\right] = \min({t1},\, {t2})'

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t1]
type = "S"
pool = "TIME_POOL"

[template.slots.t2]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t1"]

[[template]]
name = "quadratic_variation"
latex = '[{bm}]_{{{t}}} = {t}'

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "brownian_scaling"
latex = '{coeff}\, {bm}_{{{{{t}}}/{coeff}^2}} \stackrel{{d}}{{=}} {bm}_{{{t}}}'

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "brownian_time_reversal"
latex = '{bm}_{{{T}}} - {bm}_{{{T}-{t}}} \stackrel{{d}}{{=}} {bm}_{{{t}}},\quad 0 \le {t} \le {T}'

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.T]
type = "S"
pool = "STOP_POOL"

[template.slots.t]
type = "X"
pool = "TIME_POOL"
exclude_from = ["T"]

[[template]]
name = "reflection_principle"
latex = '\mathbb{{P}}\!\left(\max_{{0 \le {t1} \le {t2}}} {bm}_{{{t1}}} \ge {coeff}\right) = 2\,\mathbb{{P}}\!\left({bm}_{{{t2}}} \ge {coeff}\right)'

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t1]
type = "S"
pool = "TIME_POOL"

[template.slots.t2]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t1"]

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "levy_characterization"
latex = '{proc}_0 = 0,\quad [{proc}]_{{{t}}} = {t} \;\Longrightarrow\; {proc} \text{{ is a Brownian motion}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "ito_martingale_part"
latex = '''{func}({bm}_{{{t}}}) - \int_0^{{{t}}} \tfrac{{1}}{{2}} {func}''({bm}_{{{s}}})\, d{s} \text{{ is a local martingale}}'''

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "correlated_brownians"
latex = 'd{bm1}_{{{t}}}\, d{bm2}_{{{t}}} = {coeff}\, d{t}'

[template.slots.bm1]
type = "S"
pool = "BM_POOL"

[template.slots.bm2]
type = "X"
pool = "BM_POOL"
exclude_from = ["bm1"]

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

# --- Part B1: Itô Calculus (8) ---

[[template]]
name = "ito_isometry"
latex = '\mathbb{{E}}\!\left[\left(\int_0^{{{t}}} {func}({s})\, d{bm}_{{{s}}}\right)^{{\!2}}\right] = \mathbb{{E}}\!\left[\int_0^{{{t}}} {func}({s})^2\, d{s}\right]'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "ito_formula_bm"
latex = '''d{func}({bm}_{{{t}}}) = {func}'({bm}_{{{t}}})\, d{bm}_{{{t}}} + \tfrac{{1}}{{2}} {func}''({bm}_{{{t}}})\, d{t}'''

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "ito_formula_general"
latex = 'd{func}({t}, {proc}_{{{t}}}) = \partial_{{{t}}} {func}\, d{t} + \partial_x {func}\, d{proc}_{{{t}}} + \tfrac{{1}}{{2}} \partial_{{xx}} {func}\, (d{proc}_{{{t}}})^2'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "ito_product_rule"
latex = 'd({proc1}_{{{t}}} {proc2}_{{{t}}}) = {proc1}_{{{t}}}\, d{proc2}_{{{t}}} + {proc2}_{{{t}}}\, d{proc1}_{{{t}}} + d[{proc1}, {proc2}]_{{{t}}}'

[template.slots.proc1]
type = "S"
pool = "PROC_POOL"

[template.slots.proc2]
type = "X"
pool = "PROC_POOL"
exclude_from = ["proc1"]

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "quadratic_covariation_def"
latex = '[{proc1}, {proc2}]_{{{t}}} = {proc1}_{{{t}}} {proc2}_{{{t}}} - \int_0^{{{t}}} {proc1}_{{{s}}}\, d{proc2}_{{{s}}} - \int_0^{{{t}}} {proc2}_{{{s}}}\, d{proc1}_{{{s}}}'

[template.slots.proc1]
type = "S"
pool = "PROC_POOL"

[template.slots.proc2]
type = "X"
pool = "PROC_POOL"
exclude_from = ["proc1"]

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "stratonovich_ito_relation"
latex = '\int_0^{{{t}}} {func}({s})\, \circ\, d{bm}_{{{s}}} = \int_0^{{{t}}} {func}({s})\, d{bm}_{{{s}}} + \tfrac{{1}}{{2}} [{func}, {bm}]_{{{t}}}'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "martingale_representation"
latex = '{proc}_{{{t}}} = {proc}_0 + \int_0^{{{t}}} {func}({s})\, d{bm}_{{{s}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "ito_formula_two_var"
latex = 'd{func}({proc1}_{{{t}}}, {proc2}_{{{t}}}) = \partial_1 {func}\, d{proc1}_{{{t}}} + \partial_2 {func}\, d{proc2}_{{{t}}} + \tfrac{{1}}{{2}}\bigl(\partial_{{11}} {func}\, d[{proc1}]_{{{t}}} + 2\,\partial_{{12}} {func}\, d[{proc1},{proc2}]_{{{t}}} + \partial_{{22}} {func}\, d[{proc2}]_{{{t}}}\bigr)'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.proc1]
type = "S"
pool = "PROC_POOL"

[template.slots.proc2]
type = "X"
pool = "PROC_POOL"
exclude_from = ["proc1"]

[template.slots.t]
type = "S"
pool = "TIME_POOL"

# --- Part B2: Stochastic Differential Equations (8) ---

[[template]]
name = "sde_general_form"
latex = 'd{proc}_{{{t}}} = {drift}({proc}_{{{t}}}, {t})\, d{t} + {diff}({proc}_{{{t}}}, {t})\, d{bm}_{{{t}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.drift]
type = "S"
pool = "FUNC_POOL"

[template.slots.diff]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["drift"]

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "geometric_brownian_motion_sde"
latex = 'd{proc}_{{{t}}} = {drift}\, {proc}_{{{t}}}\, d{t} + {diff}\, {proc}_{{{t}}}\, d{bm}_{{{t}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.drift]
type = "S"
pool = "COEFF_POOL"

[template.slots.diff]
type = "S"
pool = "DIFF_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "gbm_solution"
latex = '{proc}_{{{t}}} = {proc}_0 \exp\!\left(\left({drift} - \tfrac{{{diff}^2}}{{2}}\right){t} + {diff}\, {bm}_{{{t}}}\right)'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.drift]
type = "S"
pool = "COEFF_POOL"

[template.slots.diff]
type = "S"
pool = "DIFF_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "ornstein_uhlenbeck_sde"
latex = 'd{proc}_{{{t}}} = {kappa}({theta} - {proc}_{{{t}}})\, d{t} + {diff}\, d{bm}_{{{t}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.kappa]
type = "S"
pool = "COEFF_POOL"

[template.slots.theta]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["kappa"]

[template.slots.diff]
type = "S"
pool = "DIFF_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "sde_lipschitz_condition"
latex = '\lvert {drift}(x) - {drift}(y) \rvert + \lvert {diff}(x) - {diff}(y) \rvert \le {coeff} \lvert x - y \rvert'

[template.slots.drift]
type = "S"
pool = "FUNC_POOL"

[template.slots.diff]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["drift"]

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "sde_linear_solution"
latex = '{proc}_{{{t}}} = \Phi_{{{t}}}\!\left({proc}_0 + \int_0^{{{t}}} \Phi_{{{s}}}^{{-1}} {drift}({s})\, d{s} + \int_0^{{{t}}} \Phi_{{{s}}}^{{-1}} {diff}({s})\, d{bm}_{{{s}}}\right)'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.drift]
type = "S"
pool = "FUNC_POOL"

[template.slots.diff]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["drift"]

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "sde_stopped_process"
latex = '{proc}^{{{{{stop}}}}}_{{{t} \wedge {stop}}} = {proc}_{{{t} \wedge {stop}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.stop]
type = "S"
pool = "STOP_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "sde_pathwise_solution"
latex = '\mathbb{{E}}\!\left[\int_0^{{{t}}}\!\left({drift}({proc}_{{{s}}})^2 + {diff}({proc}_{{{s}}})^2\right)d{s}\right] < \infty'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.drift]
type = "S"
pool = "FUNC_POOL"

[template.slots.diff]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["drift"]

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

# --- Part B3: Continuous-Time Martingale Theory (8) ---

[[template]]
name = "martingale_def"
latex = '\mathbb{{E}}\!\left[{proc}_{{{t2}}} \mid {filt}_{{{t1}}}\right] = {proc}_{{{t1}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.filt]
type = "S"
pool = "FILT_POOL"

[template.slots.t1]
type = "S"
pool = "TIME_POOL"

[template.slots.t2]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t1"]

[[template]]
name = "supermartingale_def"
latex = '\mathbb{{E}}\!\left[{proc}_{{{t2}}} \mid {filt}_{{{t1}}}\right] \le {proc}_{{{t1}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.filt]
type = "S"
pool = "FILT_POOL"

[template.slots.t1]
type = "S"
pool = "TIME_POOL"

[template.slots.t2]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t1"]

[[template]]
name = "doob_optional_stopping"
latex = '\mathbb{{E}}\!\left[{proc}_{{{stop}}}\right] = \mathbb{{E}}\!\left[{proc}_0\right]'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.stop]
type = "S"
pool = "STOP_POOL"

[[template]]
name = "doob_maximal_inequality"
latex = '\mathbb{{P}}\!\left(\sup_{{0 \le {t1} \le {t2}}} \lvert {proc}_{{{t1}}} \rvert \ge {coeff}\right) \le \frac{{\mathbb{{E}}\!\left[\lvert {proc}_{{{t2}}} \rvert\right]}}{{{coeff}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

[template.slots.t1]
type = "S"
pool = "TIME_POOL"

[template.slots.t2]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t1"]

[[template]]
name = "doob_lp_inequality"
latex = '\mathbb{{E}}\!\left[\sup_{{0 \le {t} \le {T}}} \lvert {proc}_{{{t}}} \rvert^{{{idx}}}\right]^{{1/{idx}}} \le \frac{{{idx}}}{{{idx}-1}}\,\mathbb{{E}}\!\left[\lvert {proc}_{{{T}}} \rvert^{{{idx}}}\right]^{{1/{idx}}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.T]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[template.slots.idx]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "local_martingale_def"
latex = '\exists\, {stop}_{{{idx}}} \uparrow \infty \text{{ s.t. }} {proc}^{{{{{stop}}}_{{{idx}}}}} \text{{ is a martingale}}'

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.stop]
type = "S"
pool = "STOP_POOL"

[template.slots.idx]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "girsanov_radon_nikodym"
latex = '\frac{{d{meas2}}}{{d{meas1}}}\bigg|_{{{filt}_{{{t}}}}} = \exp\!\left(\int_0^{{{t}}} {coeff}_{{{s}}}\, d{bm}_{{{s}}} - \tfrac{{1}}{{2}} \int_0^{{{t}}} {coeff}_{{{s}}}^2\, d{s}\right)'

[template.slots.meas1]
type = "S"
pool = "MEAS_POOL"

[template.slots.meas2]
type = "X"
pool = "MEAS_POOL"
exclude_from = ["meas1"]

[template.slots.filt]
type = "S"
pool = "FILT_POOL"

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

[template.slots.bm]
type = "S"
pool = "BM_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "girsanov_new_bm"
latex = '{bm2}_{{{t}}} = {bm1}_{{{t}}} - \int_0^{{{t}}} {coeff}_{{{s}}}\, d{s} \text{{ is a }}{meas}\text{{-Brownian motion}}'

[template.slots.bm1]
type = "S"
pool = "BM_POOL"

[template.slots.bm2]
type = "X"
pool = "BM_POOL"
exclude_from = ["bm1"]

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

[template.slots.meas]
type = "S"
pool = "MEAS_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

# --- Part B4: Markov Processes & Generators (8) ---

[[template]]
name = "markov_semigroup_def"
latex = 'P_{{{t}}} {func}(x) = \mathbb{{E}}^x\!\left[{func}({proc}_{{{t}}})\right]'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "generator_def"
latex = '\mathcal{{L}}{func}(x) = \lim_{{{t} \downarrow 0}} \frac{{P_{{{t}}} {func}(x) - {func}(x)}}{{{t}}}'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "diffusion_generator_1d"
latex = '\mathcal{{L}} = {drift}(x) \frac{{d}}{{dx}} + \tfrac{{1}}{{2}} {diff}(x)^2 \frac{{d^2}}{{dx^2}}'

[template.slots.drift]
type = "S"
pool = "FUNC_POOL"

[template.slots.diff]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["drift"]

[[template]]
name = "fokker_planck_1d"
latex = '\frac{{\partial {func}}}{{\partial {t}}} = -\frac{{\partial}}{{\partial x}}\!\left({drift}(x)\, {func}\right) + \tfrac{{1}}{{2}} \frac{{\partial^2}}{{\partial x^2}}\!\left({diff}(x)^2\, {func}\right)'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.drift]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["func"]

[template.slots.diff]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["func","drift"]

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[[template]]
name = "kolmogorov_backward"
latex = '\frac{{\partial {func}}}{{\partial {t}}} + \mathcal{{L}}{func} = 0,\quad {func}(x, {T}) = {func2}(x)'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.func2]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["func"]

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.T]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[[template]]
name = "feynman_kac"
latex = '{func}(x, {t}) = \mathbb{{E}}^x\!\left[e^{{-\int{lim_mod}_{{{t}}}^{{{T}}} {coeff}({proc}_{{{s}}})\, d{s}}}\, {func2}({proc}_{{{T}}})\right]'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.func2]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["func"]

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.coeff]
type = "S"
pool = "COEFF_POOL"

[template.slots.t]
type = "S"
pool = "TIME_POOL"

[template.slots.T]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t"]

[template.slots.s]
type = "X"
pool = "TIME_POOL"
exclude_from = ["t","T"]

[[template]]
name = "dynkin_formula"
latex = '\mathbb{{E}}^x\!\left[{func}({proc}_{{{stop}}})\right] = {func}(x) + \mathbb{{E}}^x\!\left[\int_0^{{{stop}}} \mathcal{{L}}{func}({proc}_{{{t}}})\, d{t}\right]'

[template.slots.func]
type = "S"
pool = "FUNC_POOL"

[template.slots.proc]
type = "S"
pool = "PROC_POOL"

[template.slots.stop]
