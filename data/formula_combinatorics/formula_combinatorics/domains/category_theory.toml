[meta]
domain = "category_theory"

[[pool]]
name   = "CAT_POOL"
values = ['\mathcal{A}', '\mathcal{B}', '\mathcal{C}', '\mathcal{D}', '\mathcal{E}', '\mathcal{M}', '\mathcal{N}', '\mathbf{C}', '\mathbf{D}', '\mathbf{E}']

[[pool]]
name   = "OBJ_POOL"
values = ["A", "B", "C", "D", "E", "X", "Y", "Z", "P", "Q"]

[[pool]]
name   = "MOR_POOL"
values = ["f", "g", "h", "k", "u", "v", "p", "q", '\phi', '\psi', '\alpha', '\beta', '\gamma']

[[pool]]
name   = "FUN_POOL"
values = ["F", "G", "H", "K", "L", "R", '\mathcal{F}', '\mathcal{G}', '\mathcal{H}']

[[pool]]
name   = "NAT_POOL"
values = ['\alpha', '\beta', '\gamma', '\eta', '\epsilon', '\mu', '\nu', '\tau', '\sigma']

[[pool]]
name   = "MONAD_POOL"
values = ["T", "S", "M", '\mathbb{T}', '\mathbb{S}', '\mathbb{M}']

[[pool]]
name   = "CT_IDX_POOL"
values = ["n", "m", "k", "i", "j"]

# ── Part A ────────────────────────────────────────────────────────────────────

[[template]]
name  = "composition"
latex = '{mor1}: {obj1} \to {obj2},\quad {mor2}: {obj2} \to {obj3} \;\Rightarrow\; {mor2} \circ {mor1}: {obj1} \to {obj3}'

[template.slots.obj1]
type = "S"
pool = "OBJ_POOL"

[template.slots.obj2]
type         = "X"
pool         = "OBJ_POOL"
exclude_from = ["obj1"]

[template.slots.obj3]
type         = "X"
pool         = "OBJ_POOL"
exclude_from = ["obj1", "obj2"]

[template.slots.mor1]
type = "S"
pool = "MOR_POOL"

[template.slots.mor2]
type         = "X"
pool         = "MOR_POOL"
exclude_from = ["mor1"]

[[template]]
name  = "identity_morphism"
latex = '\operatorname{{id}}_{{{obj}}}: {obj} \to {obj}\quad \text{{in }}{cat}'

[template.slots.obj]
type = "S"
pool = "OBJ_POOL"

[template.slots.cat]
type = "S"
pool = "CAT_POOL"

[[template]]
name  = "associativity_law"
latex = '{mor3} \circ ({mor2} \circ {mor1}) = ({mor3} \circ {mor2}) \circ {mor1}'

[template.slots.mor1]
type = "S"
pool = "MOR_POOL"

[template.slots.mor2]
type         = "X"
pool         = "MOR_POOL"
exclude_from = ["mor1"]

[template.slots.mor3]
type         = "X"
pool         = "MOR_POOL"
exclude_from = ["mor1", "mor2"]

[[template]]
name  = "left_unit_law"
latex = '\operatorname{{id}}_{{{obj2}}} \circ {mor} = {mor}\quad ({mor}: {obj1} \to {obj2})'

[template.slots.obj1]
type = "S"
pool = "OBJ_POOL"

[template.slots.obj2]
type         = "X"
pool         = "OBJ_POOL"
exclude_from = ["obj1"]

[template.slots.mor]
type = "S"
pool = "MOR_POOL"

[[template]]
name  = "right_unit_law"
latex = '{mor} \circ \operatorname{{id}}_{{{obj1}}} = {mor}\quad ({mor}: {obj1} \to {obj2})'

[template.slots.obj1]
type = "S"
pool = "OBJ_POOL"

[template.slots.obj2]
type         = "X"
pool         = "OBJ_POOL"
exclude_from = ["obj1"]

[template.slots.mor]
type = "S"
pool = "MOR_POOL"

[[template]]
name  = "hom_set"
latex = '\mathrm{{Hom}}_{{{cat}}}({obj1},\, {obj2})'

[template.slots.cat]
type = "S"
pool = "CAT_POOL"

[template.slots.obj1]
type = "S"
pool = "OBJ_POOL"

[template.slots.obj2]
type         = "X"
pool         = "OBJ_POOL"
exclude_from = ["obj1"]

[[template]]
name  = "isomorphism_def"
latex = '{mor1}: {obj1} \xrightarrow{{\sim}} {obj2} \;\Leftrightarrow\; \exists\, {mor2}: {obj2} \to {obj1},\; {mor2} \circ {mor1} = \operatorname{{id}}_{{{obj1}}},\; {mor1} \circ {mor2} = \operatorname{{id}}_{{{obj2}}}'

[template.slots.obj1]
type = "S"
pool = "OBJ_POOL"

[template.slots.obj2]
type         = "X"
pool         = "OBJ_POOL"
exclude_from = ["obj1"]

[template.slots.mor1]
type = "S"
pool = "MOR_POOL"

[template.slots.mor2]
type         = "X"
pool         = "MOR_POOL"
exclude_from = ["mor1"]

[[template]]
name  = "monomorphism_def"
latex = '{mor1} \circ {mor2} = {mor1} \circ {mor3} \;\Rightarrow\; {mor2} = {mor3}\quad ({mor1}: {obj1} \to {obj2})'

[template.slots.obj1]
type = "S"
pool = "OBJ_POOL"

[template.slots.obj2]
type         = "X"
pool         = "OBJ_POOL"
exclude_from = ["obj1"]

[template.slots.mor1]
type = "S"
pool = "MOR_POOL"

[template.slots.mor2]
type         = "X"
pool         = "MOR_POOL"
exclude_from = ["mor1"]

[template.slots.mor3]
type         = "X"
pool         = "MOR_POOL"
exclude_from = ["mor1", "mor2"]

