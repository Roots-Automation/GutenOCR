type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.fn2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.uu]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv"]

[[template]]
name  = "binary_predicate_pair"
latex = '\forall {vv}\,\forall {uu}\,({fn1}({vv},{uu}) \Rightarrow {fn2}({vv},{uu}))'

[template.slots.fn1]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.fn2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.uu]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv"]

[[template]]
name  = "predicate_chain"
latex = '\forall {vv}\,({fn1}({vv}) \Rightarrow {fn2}({vv}) \Rightarrow {fn3}({vv}))'

[template.slots.fn1]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.fn2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.fn3]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

# ---------------------------------------------------------------------------
# Part D: New symbols — \vDash, \Vdash, \therefore, \because, \barwedge, \veebar (11)
# ---------------------------------------------------------------------------

[[template]]
name  = "semantic_entailment_world"
latex = '{MM} \vDash {pp}'

[template.slots.MM]
type = "S"
pool = "WORLD_POOL"

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[[template]]
name  = "semantic_entailment_conjunction"
latex = '{MM} \vDash {pp} \land {qq}'

[template.slots.MM]
type = "S"
pool = "WORLD_POOL"

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "semantic_entailment_gamma"
latex = '\Gamma \vDash {pp}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[[template]]
name  = "forcing_world"
latex = '{ww} \Vdash {pp}'

[template.slots.ww]
type = "S"
pool = "WORLD_POOL"

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[[template]]
name  = "forcing_implication"
latex = '{ww} \Vdash {pp} \Rightarrow {qq}'

[template.slots.ww]
type = "S"
pool = "WORLD_POOL"

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "therefore_modus_ponens"
latex = '{pp} \land ({pp} \Rightarrow {qq}) \therefore {qq}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "because_disjunctive_syllogism"
latex = '{pp} \because {pp} \lor {qq},\; \neg {qq}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "barwedge_nand_equiv"
latex = '{pp} \barwedge {qq} \equiv \neg({pp} \land {qq})'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "barwedge_nand_identity"
latex = '({pp} \barwedge {pp}) \barwedge ({qq} \barwedge {qq}) \equiv {pp} \lor {qq}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "veebar_xor_via_or_and"
latex = '{pp} \veebar {qq} \equiv ({pp} \lor {qq}) \land \neg({pp} \land {qq})'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "veebar_xor_via_asymmetric_and"
latex = '{pp} \veebar {qq} \equiv ({pp} \land \neg {qq}) \lor (\neg {pp} \land {qq})'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

# ---------------------------------------------------------------------------
# Part E: Lattice Operators (5)
# ---------------------------------------------------------------------------

[[template]]
name  = "lattice_join_def"
latex = '{pp} \vee {qq} = \sup\{{{pp},\,{qq}\}}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "lattice_meet_def"
latex = '{pp} \wedge {qq} = \inf\{{{pp},\,{qq}\}}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "boolean_complement_laws"
latex = '{pp} \vee \neg {pp} = \mathbf{{1}},\quad {pp} \wedge \neg {pp} = \mathbf{{0}}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[[template]]
name  = "distributive_lattice_law"
latex = '{pp} \vee ({qq} \wedge {rr}) = ({pp} \vee {qq}) \wedge ({pp} \vee {rr})'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[template.slots.rr]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp", "qq"]

[[template]]
name  = "de_morgan_lattice"
latex = '\neg({pp} \vee {qq}) = \neg {pp} \wedge \neg {qq}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

# ---------------------------------------------------------------------------
# Part F: Arrow Variations (3)
# ---------------------------------------------------------------------------

[[template]]
name  = "biconditional_leftrightarrow"
latex = '{pp} \leftrightarrow {qq} \equiv ({pp} \rightarrow {qq}) \wedge ({qq} \rightarrow {pp})'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "converse_leftarrow"
latex = '({pp} \leftarrow {qq}) \equiv ({qq} \rightarrow {pp})'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "necessary_condition_leftarrow"
latex = '{pp} \Leftarrow {qq} \iff {qq} \Rightarrow {pp}'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

# ---------------------------------------------------------------------------
# Part G: Negated Quantifiers and Proof End (4)
# ---------------------------------------------------------------------------

[[template]]
name  = "nexists_predicate"
latex = '\nexists\, {xx}:\; {pp}({xx})'

[template.slots.xx]
type = "S"
pool = "VAR_POOL"

[template.slots.pp]
type = "S"
pool = "PRED_POOL"

[[template]]
name  = "nexists_as_negation"
latex = '\nexists\, {xx}:\; {pp}({xx}) \equiv \forall {xx}\;\neg {pp}({xx})'

[template.slots.xx]
type = "S"
pool = "VAR_POOL"

[template.slots.pp]
type = "S"
pool = "PRED_POOL"

[[template]]
name  = "proof_end_blacksquare"
latex = '\therefore {pp} \Rightarrow {qq} \qquad \blacksquare'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"

[template.slots.qq]
type = "X"
pool = "PROP_POOL"
exclude_from = ["pp"]

[[template]]
name  = "contradiction_blacksquare"
latex = '\neg({pp} \land \neg {pp}) \qquad \blacksquare'

[template.slots.pp]
type = "S"
pool = "PROP_POOL"
