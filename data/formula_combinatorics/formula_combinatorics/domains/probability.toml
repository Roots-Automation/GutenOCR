domain = "probability"

# ---------------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------------

[[pool]]
name = "PROB_OP"
values = ["P",'\mathbb{P}','\Pr','\mathbf{P}','\hat{P}','\tilde{P}']

[[pool]]
name = "EXP_OP"
values = ["E",'\mathbb{E}','\mathrm{E}','\mathbf{E}','\hat{E}','\mathbb{E}_\theta']

[[pool]]
name = "RV_POOL"
values = ["X","Y","Z","W","U","V"]

[[pool]]
name = "N_POOL"
values = ["n","m","N","M"]

[[pool]]
name = "LAM_POOL"
values = ['\lambda','\mu','\nu','\alpha','\beta']

[[pool]]
name = "MU_POOL"
values = ['\mu','\mu_0','\nu',"m"]

[[pool]]
name = "SIG_POOL"
values = ['\sigma','\sigma_0','\tau','\eta']

[[pool]]
name = "IDX_POOL"
values = ["i","j","k","l","m","n","p","q","r","s","t"]

[[pool]]
name = "EVENT_POOL"
values = ["A","B","C","D","E","F","A_1","B_1"]

[[pool]]
name = "K_POOL"
values = ["k",'\ell',"j","r"]

[[pool]]
name = "P_POOL"
values = ["p","q",'\theta','\pi','\rho']

[[pool]]
name = "A_POOL"
values = ["a","b","c",'\varepsilon']

[[pool]]
name = "AB_POOL"
values = ["a","b",'\alpha','\beta']

[[pool]]
name = "BERN_K"
values = ["0","1","2","3"]

# ---------------------------------------------------------------------------
# Part A: Reparameterized originals (18)
# ---------------------------------------------------------------------------

[[template]]
name = "binomial_pmf"
latex = '{op}({rv} = {kk}) = \binom{{{nn}}}{{{kk}}} {pp}^{{{kk}}} (1-{pp})^{{{nn}-{kk}}}'

[template.slots.op]
type = "S"
pool = "PROB_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[template.slots.kk]
type = "S"
pool = "K_POOL"

[template.slots.nn]
type = "S"
pool = "N_POOL"

[template.slots.pp]
type = "S"
pool = "P_POOL"

[[template]]
name = "poisson_pmf"
latex = '{op}({rv} = {kk}) = \frac{{{lam}^{{{kk}}} e^{{-{lam}}}}}{{{kk}!}}'

[template.slots.op]
type = "S"
pool = "PROB_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[template.slots.kk]
type = "S"
pool = "K_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[[template]]
name = "normal_pdf"
latex = 'f(x) = \frac{{1}}{{\sqrt{{2\pi}}\,{sig}}} \exp\!\left(-\frac{{(x-{mu})^2}}{{2\,{sig}^2}}\right)'

[template.slots.mu]
type = "S"
pool = "MU_POOL"

[template.slots.sig]
type = "S"
pool = "SIG_POOL"

[[template]]
name = "expected_value_discrete"
latex = '{op}[{rv}] = \sum{lim_mod}_{{k}} k \cdot P({rv} = k)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "expected_value_continuous"
latex = '{op}[{rv}] = \int{lim_mod}_{{-\infty}}^{{\infty}} x\, f_{{{rv}}}(x)\, dx'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "variance"
latex = '\operatorname{{Var}}({rv}) = {op}\!\left[{rv}^2\right] - \bigl({op}[{rv}]\bigr)^2'

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "bayes_theorem"
latex = '{op}({ev1} \mid {ev2}) = \frac{{{op}({ev2} \mid {ev1})\,{op}({ev1})}}{{{op}({ev2})}}'

[template.slots.op]
type = "S"
pool = "PROB_OP"

[template.slots.ev1]
type = "S"
pool = "EVENT_POOL"

[template.slots.ev2]
type = "X"
pool = "EVENT_POOL"
exclude_from = ["ev1"]

[[template]]
name = "law_of_total_probability"
latex = '{op}({ev}) = \sum{lim_mod}_{{i=1}}^{{{nn}}} {op}({ev} \mid B_i)\,{op}(B_i)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.op]
type = "S"
pool = "PROB_OP"

[template.slots.ev]
type = "S"
pool = "EVENT_POOL"

[template.slots.nn]
type = "S"
pool = "N_POOL"

[[template]]
name = "mgf"
latex = 'M_{{{rv}}}(t) = {op}\!\left[e^{{t\,{rv}}}\right] = \sum{lim_mod}_{{k=0}}^{{\infty}} \frac{{{op}[{rv}^k]}}{{k!}}\,t^k'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "covariance"
latex = '\operatorname{{Cov}}({rv1},{rv2}) = {op}[{rv1}\,{rv2}] - {op}[{rv1}]\,{op}[{rv2}]'

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv1]
type = "S"
pool = "RV_POOL"

[template.slots.rv2]
type = "X"
pool = "RV_POOL"
exclude_from = ["rv1"]

[[template]]
name = "cdf"
latex = 'F_{{{rv}}}(x) = {op}({rv} \leq x) = \int{lim_mod}_{{-\infty}}^{{x}} f_{{{rv}}}(t)\, dt'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.op]
type = "S"
pool = "PROB_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "geometric_pmf"
latex = '{op}({rv} = {kk}) = (1-{pp})^{{{kk}-1}}\,{pp}'

[template.slots.op]
type = "S"
pool = "PROB_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[template.slots.kk]
type = "S"
pool = "K_POOL"

[template.slots.pp]
type = "S"
pool = "P_POOL"

[[template]]
name = "jensens_inequality"
latex = '{fn}\!\bigl({op}[{rv}]\bigr) \leq {op}\!\bigl[{fn}({rv})\bigr]'

[template.slots.fn]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "correlation"
latex = '\rho_{{{rv1}{rv2}}} = \frac{{\operatorname{{Cov}}({rv1},{rv2})}}{{\sqrt{{\operatorname{{Var}}({rv1})\,\operatorname{{Var}}({rv2})}}}}'

[template.slots.rv1]
type = "S"
pool = "RV_POOL"

[template.slots.rv2]
type = "X"
pool = "RV_POOL"
exclude_from = ["rv1"]

[[template]]
name = "central_limit_theorem"
latex = '\frac{{\bar{{{rv}}}_n - {mu}}}{{{sig}/\sqrt{{{nn}}}}} \xrightarrow{{d}} \mathcal{{N}}(0,1)'

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[template.slots.mu]
type = "S"
pool = "MU_POOL"

[template.slots.sig]
type = "S"
pool = "SIG_POOL"

[template.slots.nn]
type = "S"
pool = "N_POOL"

[[template]]
name = "law_of_large_numbers"
latex = '\bar{{{rv}}}_n \xrightarrow{{p}} \mu \text{{ as }} n \to \infty'

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "characteristic_function"
latex = '\varphi_{{{rv}}}(t) = {op}\!\left[e^{{it\,{rv}}}\right]'

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

[[template]]
name = "tower_property"
latex = '{op}\!\Bigl[{op}[{rv} \mid \mathcal{{F}}]\Bigr] = {op}[{rv}]'

[template.slots.op]
type = "S"
pool = "EXP_OP"

[template.slots.rv]
type = "S"
pool = "RV_POOL"

