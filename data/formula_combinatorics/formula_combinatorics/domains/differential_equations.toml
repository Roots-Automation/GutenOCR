# --- Part B5: Series Methods & Special Functions (7) ---

[[template]]
name = "power_series_ode"
latex = '{ff}({vv}) = \sum{lim_mod}_{{{nn}=0}}^{{\infty}} a_{{{nn}}} ({vv} - {vv}_0)^{{{nn}}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "frobenius_method"
latex = '{ff}({vv}) = {vv}^{{{rr}}} \sum{lim_mod}_{{{nn}=0}}^{{\infty}} a_{{{nn}}} {vv}^{{{nn}}} \text{{ near regular singular point}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.rr]
type = "S"
pool = "PARAM_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "frobenius_indicial"
latex = '''{ff}'' + \frac{{{pp}({vv})}}{{{vv}}} {ff}' + \frac{{{qq}({vv})}}{{{vv}^2}} {ff} = 0:\quad {rr}({rr}-1) + {pp}_0 {rr} + {qq}_0 = 0'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.pp]
type = "S"
pool = "COEFF_POOL"

[template.slots.qq]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["pp"]

[template.slots.rr]
type = "S"
pool = "PARAM_POOL"

[[template]]
name = "bessel_equation"
latex = '''{vv}^2 {ff}'' + {vv} {ff}' + ({vv}^2 - {nn}^2) {ff} = 0'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "legendre_equation"
latex = '''(1 - {vv}^2) {ff}'' - 2{vv} {ff}' + {nn}({nn}+1) {ff} = 0'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "power_series_recurrence"
latex = '''{ff}'' + {lam} {ff} = 0:\quad a_{{{nn}+2}} = -\frac{{{lam}}}{{({nn}+1)({nn}+2)}} a_{{{nn}}}'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.lam]
type = "S"
pool = "PARAM_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "fuchs_indicial_pair"
latex = '{rr1} - {rr2} \notin \mathbb{{Z}} \Rightarrow {ff}_1({vv}) = {vv}^{{{rr1}}} \textstyle\sum a_k {vv}^k,\quad {ff}_2({vv}) = {vv}^{{{rr2}}} \textstyle\sum b_k {vv}^k'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.rr1]
type = "S"
pool = "PARAM_POOL"

[template.slots.rr2]
type = "X"
pool = "PARAM_POOL"
exclude_from = ["rr1"]

# --- Part B6: Stability & Dynamical Systems (7) ---

[[template]]
name = "autonomous_system"
latex = '\frac{{d{vv1}}}{{dt}} = {ff}({vv1}, {vv2}), \quad\frac{{d{vv2}}}{{dt}} = {gg}({vv1}, {vv2})'

