[template.slots.cc]
type = "S"
pool = "PARAM_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[[template]]
name = "diffusion_3d"
latex = '\frac{{\partial {ff}}}{{\partial t}} = {kap} \nabla^2 {ff} \quad \text{{in }} {dom}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.kap]
type = "S"
pool = "COEFF_POOL"

[template.slots.dom]
type = "S"
pool = "DOMAIN_POOL"

[[template]]
name = "characteristics_first_order"
latex = '{aa} \frac{{\partial {ff}}}{{\partial {vv1}}} + {bb} \frac{{\partial {ff}}}{{\partial {vv2}}} = {cc}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.bb]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["aa"]

[template.slots.cc]
type = "X"
pool = "COEFF_POOL"
