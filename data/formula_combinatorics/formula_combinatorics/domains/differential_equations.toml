pool = "VAR_POOL"
exclude_from = ["vv1"]

[[template]]
name = "jacobian_linearization"
latex = 'J = \begin{{pmatrix}}\partial_{{{vv1}}} {ff} & \partial_{{{vv2}}} {ff} \\\partial_{{{vv1}}} {gg} & \partial_{{{vv2}}} {gg}\end{{pmatrix}}\bigg|_{{({vv1}^*, {vv2}^*)}}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
