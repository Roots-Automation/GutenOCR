[[template]]
name = "fourier_eigenfunction_series"
latex = '{ff}({vv}, t) = \sum{lim_mod}_{{{nn}=1}}^{{\infty}} a_{{{nn}}} e^{{-{lam}_{{{nn}}} t}} \varphi_{{{nn}}}({vv})'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[template.slots.lam]
type = "S"
pool = "PARAM_POOL"

# --- Part B4: Boundary Value Problems & Sturm-Liouville (7) ---

[[template]]
name = "sturm_liouville_regular"
latex = '-\frac{{d}}{{d{vv}}}\!\left({pp}({vv}) \frac{{d{ff}}}{{d{vv}}}\right) + {qq}({vv}) {ff} = {lam} {ww}({vv}) {ff}'

