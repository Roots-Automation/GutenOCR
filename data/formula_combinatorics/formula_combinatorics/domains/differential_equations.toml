[template.slots.vv1]
type = "S"
pool = "VAR_POOL"

[template.slots.vv2]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv1"]

[[template]]
name = "biharmonic_equation"
latex = '\nabla^4 {ff} = 0 \quad \text{{in }} {dom}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.dom]
type = "S"
pool = "DOMAIN_POOL"

[[template]]
name = "cauchy_initial_data"
latex = '{ff}({vv}, 0) = {gg}({vv}), \quad\frac{{\partial {ff}}}{{\partial t}}({vv}, 0) = {hh}({vv})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.hh]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff","gg"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[[template]]
name = "maximum_principle"
latex = '{op}\, {ff} \leq 0 \text{{ in }} {dom} \Rightarrow \max {ff} \text{{ attained on }} \partial {dom}'

[template.slots.op]
type = "S"
pool = "OP_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.dom]
type = "S"
pool = "DOMAIN_POOL"

# --- Part B3: Transforms & Green's Functions (7) ---

[[template]]
name = "laplace_transform_def"
latex = '\mathcal{{L}}[{ff}]({ss}) = \int_0^{{\infty}} e^{{-{ss} {vv}}} {ff}({vv}) \, d{vv}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ss]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv"]

[[template]]
name = "laplace_derivative_rule"
latex = '\mathcal{{L}}[{ff}^{{({nn})}}]({vv}) = {vv}^{{{nn}}} F({vv}) - \sum{lim_mod}_{{k=0}}^{{{nn}-1}} {vv}^{{{nn}-1-k}} {ff}^{{(k)}}(0)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "laplace_convolution"
latex = '\mathcal{{L}}[{ff} * {gg}]({vv}) = \mathcal{{L}}[{ff}]({vv}) \cdot \mathcal{{L}}[{gg}]({vv})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[[template]]
name = "laplace_shift_theorem"
latex = '\mathcal{{L}}[e^{{{aa} {vv}}} {ff}({vv})]({ss}) = \mathcal{{L}}[{ff}]({ss} - {aa})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ss]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv"]

[[template]]
name = "greens_function_solution"
latex = '{ff}({vv}) = \int{lim_mod}_{{{dom}}} G({vv}, {xi}) \, {gg}({xi}) \, d{xi}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.xi]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv"]

[template.slots.dom]
type = "S"
pool = "DOMAIN_POOL"

[[template]]
name = "duhamel_principle"
latex = '{ff}({vv}, {tt}) = \int_0^{{{tt}}} S({tt} - {tau}) \, {gg}({tau}) \, d{tau}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.tt]
