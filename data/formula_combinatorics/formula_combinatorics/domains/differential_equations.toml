[meta]
domain = "differential_equations"

[[pool]]
name = "FUNC_POOL"
values = ["y","u","v","w",'\phi','\psi','\chi','\theta','\eta','\xi',"f","g"]

[[pool]]
name = "VAR_POOL"
values = ["x","t","r","s",'\tau','\sigma','\zeta','\rho']

[[pool]]
name = "COEFF_POOL"
values = ["a","b","c","k",'\alpha','\beta','\gamma','\lambda','\mu','\nu','\kappa']

[[pool]]
name = "PARAM_POOL"
values = ['\omega','\Omega','\lambda','\mu','\alpha','\beta',"k","m","r","c"]

[[pool]]
name = "OP_POOL"
values = ["L","A","B",'\mathcal{L}','\mathcal{A}','\mathcal{D}']

[[pool]]
name = "IDX_POOL"
values = ["n","m","k","j","N","M"]

[[pool]]
name = "DOMAIN_POOL"
values = ['\Omega','\Omega_0',"D",'\mathcal{D}','\Sigma','[0,L]','[0,T]']

[[pool]]
name = "SPACE_POOL"
values = ['\mathbb{R}','\mathbb{R}^n','\mathbb{R}^2','\mathbb{R}^3','L^2(\Omega)','H^1(\Omega)']

# --- Part A: reparameterized originals (14) ---

[[template]]
name = "first_order_linear_ode"
latex = '\frac{{d{ff}}}{{d{vv}}} + {aa}({vv}) {ff} = g({vv})'

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "second_order_linear_ode"
latex = '\frac{{d^2{ff}}}{{d{vv}^2}} + {aa} \frac{{d{ff}}}{{d{vv}}} + {om} {ff} = 0'

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.om]
type = "S"
pool = "PARAM_POOL"

[[template]]
name = "heat_equation"
latex = '\frac{{\partial {ff}}}{{\partial t}} = {kap} \frac{{\partial^2 {ff}}}{{\partial {vv}^2}}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.kap]
type = "S"
pool = "COEFF_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[[template]]
name = "wave_equation"
latex = '\frac{{\partial^2 {ff}}}{{\partial t^2}} = {cc}^2 \frac{{\partial^2 {ff}}}{{\partial {vv}^2}}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.cc]
type = "S"
pool = "PARAM_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[[template]]
name = "laplace_equation"
latex = '\nabla^2 {ff} = \frac{{\partial^2 {ff}}}{{\partial {vv1}^2}} + \frac{{\partial^2 {ff}}}{{\partial {vv2}^2}} = 0'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv1]
type = "S"
pool = "VAR_POOL"

[template.slots.vv2]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv1"]

[[template]]
name = "homogeneous_ode_solution"
latex = '{ff}({vv}) = C_1 e^{{{lam1} {vv}}} + C_2 e^{{{lam2} {vv}}}'

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.lam1]
type = "S"
pool = "PARAM_POOL"

[template.slots.lam2]
type = "X"
pool = "PARAM_POOL"
exclude_from = ["lam1"]

[[template]]
name = "separable_ode"
latex = '\frac{{1}}{{{ff}}} \frac{{d{ff}}}{{d{vv}}} = {aa}({vv})'

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "exponential_growth_solution"
latex = '{ff}({vv}) = {ff}_0 \, e^{{{rate} {vv}}}'

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.rate]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "sturm_liouville_bvp"
latex = '''{ff}''({vv}) + {om} {ff}({vv}) = 0, \quad {ff}(0) = 0, \; {ff}(L) = 0'''

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.om]
type = "S"
pool = "PARAM_POOL"

[[template]]
name = "logistic_equation"
latex = '\frac{{d{ff}}}{{dt}} = {rr} {ff}\!\left(1 - \frac{{{ff}}}{{{KK}}}\right)'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.rr]
type = "S"
pool = "COEFF_POOL"

[template.slots.KK]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["rr"]

[[template]]
name = "driven_harmonic_oscillator"
latex = '\frac{{\partial^2 {ff}}}{{\partial t^2}} + 2{aa} \frac{{\partial {ff}}}{{\partial t}} + {om0} {ff} = F_0 \cos({om} t)'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.om0]
type = "S"
pool = "PARAM_POOL"

[template.slots.om]
type = "X"
pool = "PARAM_POOL"
exclude_from = ["om0"]

[[template]]
name = "integrating_factor"
latex = '\mu({vv}) = e^{{\int {aa}({vv}) \, d{vv}}}'

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "greens_function"
latex = '{op} G({vv}, {xi}) = \delta({vv} - {xi})'

[template.slots.op]
type = "S"
pool = "OP_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.xi]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv"]

[[template]]
name = "variation_of_parameters"
latex = '''{ff}_p({vv}) = {ff}_1({vv}) \int \frac{{{gg}_2 h}}{{{ff}_1 {gg}_2' - {gg}_2 {ff}_1'}} \, d{vv}'''

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

# --- Part B1: ODE Theory (8) ---

[[template]]
name = "wronskian_def"
latex = '''W({ff1}, {ff2})({vv}) = {ff1} {ff2}' - {ff2} {ff1}' '''

[template.slots.ff1]
type = "S"
pool = "FUNC_POOL"

[template.slots.ff2]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff1"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[[template]]
name = "abel_identity"
latex = 'W_{{{ff1},{ff2}}}({vv}) = W_0 \,e^{{-\int{lim_mod}_{{v_0}}^{{{vv}}} {aa}(s)\,ds}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff1]
type = "S"
pool = "FUNC_POOL"

[template.slots.ff2]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff1"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "exact_ode"
latex = '{MM}\,d{vv} + {NN}\,d{ww} = 0 \text{{ exact iff }} \frac{{\partial {MM}}}{{\partial {ww}}} = \frac{{\partial {NN}}}{{\partial {vv}}}'

[template.slots.MM]
type = "S"
pool = "FUNC_POOL"

[template.slots.NN]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["MM"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.ww]
type = "X"
pool = "VAR_POOL"
exclude_from = ["vv"]

[[template]]
name = "bernoulli_substitution"
latex = '''{ff}' + {aa}({vv}) {ff} = {bb}({vv}) {ff}^{{{nn}}},\quad z = {ff}^{{1-{nn}}}'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.bb]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["aa"]

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "reduction_of_order"
latex = '{ff2}({vv}) = {ff1}({vv}) \int\frac{{e^{{-\int {aa}({vv})\,d{vv}}}}}{{{ff1}^2({vv})}} \, d{vv}'

[template.slots.ff1]
type = "S"
pool = "FUNC_POOL"

[template.slots.ff2]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff1"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[[template]]
name = "variation_of_parameters_full"
latex = '{ff1}_p = -{ff1} \int \frac{{{ff2} {gg}}}{{W}} \, d{vv} + {ff2} \int \frac{{{ff1} {gg}}}{{W}} \, d{vv}'

[template.slots.ff1]
type = "S"
pool = "FUNC_POOL"

[template.slots.ff2]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff1"]

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff1","ff2"]

[template.slots.vv]
type = "S"
pool = "VAR_POOL"

[[template]]
name = "characteristic_equation"
latex = '''{ff}'' + {aa} {ff}' + {bb} {ff} = 0:\quad \lambda^2 + {aa} \lambda + {bb} = 0'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.bb]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["aa"]

[[template]]
name = "laplace_ode_transform"
latex = '''\bigl({ss}^2 + {aa} {ss} + {bb}\bigr) \hat{{{ff}}}({ss}) = \hat{{g}}({ss}) + ({ss} + {aa}) {ff}(0) + {ff}'(0)'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.ss]
type = "S"
pool = "VAR_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.bb]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["aa"]

# --- Part B2: PDE Theory (8) ---

[[template]]
name = "poisson_equation"
latex = '\nabla^2 {ff} = {gg} \quad \text{{in }} {dom}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.dom]
type = "S"
pool = "DOMAIN_POOL"

[[template]]
name = "helmholtz_equation"
latex = '\nabla^2 {ff} + {kk}^2 {ff} = 0 \quad \text{{in }} {dom}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.kk]
type = "S"
pool = "PARAM_POOL"

[template.slots.dom]
type = "S"
pool = "DOMAIN_POOL"

[[template]]
name = "transport_equation"
latex = '\frac{{\partial {ff}}}{{\partial t}} + {cc} \frac{{\partial {ff}}}{{\partial {vv}}} = 0'

[template.slots.ff]
