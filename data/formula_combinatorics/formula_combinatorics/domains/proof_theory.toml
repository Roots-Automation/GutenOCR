domain = "proof_theory"

# ---------------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------------

[[pool]]
name = "PROP_POOL"
values = ["P","Q","R","S","A","B",'\phi','\psi','\chi','\varphi','\alpha','\beta']

[[pool]]
name = "PRED_POOL"
values = ["P","Q","R","F","G",'\phi','\psi','\chi','\Phi']

[[pool]]
name = "VAR_POOL"
values = ["x","y","z","a","b","c","u","v","w","n","m"]

[[pool]]
name = "TYPE_POOL"
values = ['\sigma','\tau','\alpha','\beta','\gamma',"A","B","C"]

[[pool]]
name = "TERM_POOL"
values = ["t","s","r","u","v","a","b","c"]

[[pool]]
name = "LL_POOL"
values = ['\alpha','\beta','\gamma','\delta',"A","B","C","D"]

[[pool]]
name = "UNIV_POOL"
values = ["0","1","2",'\omega',"i","j"]

[[pool]]
name = "PAIR_POOL"
values = ["p","q","r","s","e","d"]

