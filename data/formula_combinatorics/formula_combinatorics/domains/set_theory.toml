[meta]
domain = "set_theory"

[[pool]]
name = "SET_POOL"
values = ["A","B","C","D","E","S","T","U","V","W"]

[[pool]]
name = "SCRIPT_POOL"
values = ['\mathcal{A}','\mathcal{B}','\mathcal{C}','\mathcal{F}','\mathcal{G}','\mathcal{U}']

[[pool]]
name = "ORD_POOL"
values = ['\alpha','\beta','\gamma','\delta','\lambda','\mu','\nu','\omega']

[[pool]]
name = "CARD_POOL"
values = ['\aleph_0','\aleph_1','\aleph_2','\kappa','\lambda','\mu']

[[pool]]
name = "VAR_POOL"
values = ["x","y","z","a","b","c","u","v","w"]

[[pool]]
name = "PROP_POOL"
values = ["P","Q","R",'\varphi','\psi',"S","T","U"]

[[pool]]
name = "BBOLD_POOL"
values = ['\mathbb{N}','\mathbb{Z}','\mathbb{Q}','\mathbb{R}','\mathbb{C}','\mathbb{P}','\mathbb{F}','\mathbb{H}','\mathbb{T}']

[[pool]]
name = "REL_POOL"
values = ['\leq','\prec','\sqsubseteq','\preceq','\unlhd']

[[pool]]
name = "FUNC_POOL"
values = ["f","g","h","F","G",'\phi','\psi','\varphi','\chi','\xi','\eta']

[[pool]]
name = "IDX_POOL"
values = ["i","j","k","l","m","n","p","q","r","s","t"]

# --- Part A (16) ---

[[template]]
