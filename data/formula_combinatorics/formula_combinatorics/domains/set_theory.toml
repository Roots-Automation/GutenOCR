latex = '{AA} \cup {BB} = {BB} \cup {AA},\quad {AA} \cap {CC} = {CC} \cap {AA}'

[template.slots.AA]
type = "S"
pool = "SET_POOL"

[template.slots.BB]
type = "X"
pool = "SET_POOL"
