# ---------------------------------------------------------------------------
# Proof notation
# ---------------------------------------------------------------------------

[[template]]
name  = "therefore_angle_eq"
latex = '\therefore \angle {A} = \angle {B}'

[template.slots.A]
type = "S"
pool = "ANGLE_POOL"

[template.slots.B]
type = "S"
pool = "ANGLE_POOL"

# ----

[[template]]
name  = "because_therefore"
latex = ""

  [[template.variants]]
  name  = "because_therefore_similar"
  latex = '\because \angle {A} = \angle {B}, \quad \therefore \triangle {P}{Q}{R} \sim \triangle {P2}{Q2}{R2}'

  [template.variants.slots.A]
  type = "S"
  pool = "ANGLE_POOL"

  [template.variants.slots.B]
  type = "S"
  pool = "ANGLE_POOL"

  [template.variants.slots.P]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.Q]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.R]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.P2]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.Q2]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.R2]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [[template.variants]]
  name  = "because_therefore_congruent"
  latex = '\because \angle {A} = \angle {B}, \quad \therefore \triangle {P}{Q}{R} \cong \triangle {P2}{Q2}{R2}'

  [template.variants.slots.A]
  type = "S"
  pool = "ANGLE_POOL"

  [template.variants.slots.B]
  type = "S"
  pool = "ANGLE_POOL"

  [template.variants.slots.P]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.Q]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.R]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.P2]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.Q2]
  type = "S"
  pool = "TRI_VERTS_POOL"

  [template.variants.slots.R2]
  type = "S"
  pool = "TRI_VERTS_POOL"

