[[template]]
name  = "vec_addition"
latex = '\overrightarrow{{{A}{B}}} + \overrightarrow{{{B}{C}}} = \overrightarrow{{{A}{C}}}'

[template.slots.A]
type = "S"
pool = "PTS_POOL"

