pool = "TRI_VERTS_POOL"

[template.slots.R2]
type = "S"
pool = "TRI_VERTS_POOL"

# ----

[[template]]
name  = "triangle_area"
latex = 'S_{{\triangle {P}{Q}{R}}} = \frac{{1}}{{2}} {a} {b} \sin \angle {P}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.a]
type = "S"
pool = "SCALAR_POOL"

[template.slots.b]
type = "S"
pool = "SCALAR_POOL"

# ----

[[template]]
name  = "triangle_angle_sum"
latex = '\angle {P} + \angle {Q} + \angle {R} = 180^{{\circ}}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

# ----

[[template]]
name  = "similar_ratio"
latex = '\frac{{\overline{{{P}{Q}}}}}{{\overline{{{P2}{Q2}}}}} = \frac{{\overline{{{Q}{R}}}}}{{\overline{{{Q2}{R2}}}}} = {k}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.P2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.k]
type = "S"
pool = "SCALAR_POOL"

# ----

[[template]]
name  = "pythagorean"
latex = '{a}^2 + {b}^2 = {c}^2'

[template.slots.a]
type = "S"
pool = "SCALAR_POOL"

[template.slots.b]
type = "S"
pool = "SCALAR_POOL"

[template.slots.c]
type = "S"
pool = "SCALAR_POOL"

# ----

[[template]]
name  = "law_of_cosines"
latex = '{c}^2 = {a}^2 + {b}^2 - 2{a}{b} \cos \angle {C}'

[template.slots.a]
type = "S"
pool = "SCALAR_POOL"

[template.slots.b]
type = "S"
pool = "SCALAR_POOL"

[template.slots.c]
type = "S"
pool = "SCALAR_POOL"

[template.slots.C]
type = "S"
pool = "TRI_VERTS_POOL"

