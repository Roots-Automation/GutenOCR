[meta]
domain = "geometry"

# ---------------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "PTS_POOL"
values = ["A", "B", "C", "D", "E", "F", "P", "Q", "R"]

[[pool]]
name   = "TRI_VERTS_POOL"
values = ["A", "B", "C", "D", "E", "F", "X", "Y", "Z"]

[[pool]]
name   = "ANGLE_POOL"
values = ["A", "B", "C", "D", "E", "F", "P", "Q", "R", '\alpha', '\beta', '\gamma']

[[pool]]
name   = "DEG_POOL"
values = ["30", "45", "60", "90", "120", "135", "150", "180"]

[[pool]]
name   = "SCALAR_POOL"
values = ["a", "b", "c", "d", "k", "m", "n", "r"]

[[pool]]
name   = "CIRCLE_POOL"
values = ["1", "2", "3", "4", "5", "6"]

# ---------------------------------------------------------------------------
# Angles
# ---------------------------------------------------------------------------

[[template]]
name  = "angle_eq_angle"
latex = '\angle {A}{B}{C} = \angle {D}{E}{F}'

[template.slots.A]
type = "S"
pool = "PTS_POOL"

[template.slots.B]
type = "S"
pool = "PTS_POOL"

[template.slots.C]
type = "S"
pool = "PTS_POOL"

[template.slots.D]
type = "S"
pool = "PTS_POOL"

[template.slots.E]
type = "S"
pool = "PTS_POOL"

[template.slots.F]
type = "S"
pool = "PTS_POOL"

# ----

[[template]]
name  = "angle_eq_deg"
latex = '\angle {A}{B}{C} = {d}^{{\circ}}'

[template.slots.A]
type = "S"
pool = "PTS_POOL"

[template.slots.B]
type = "S"
pool = "PTS_POOL"

[template.slots.C]
type = "S"
pool = "PTS_POOL"

[template.slots.d]
type = "S"
pool = "DEG_POOL"

# ----

[[template]]
name  = "angle_sum_180"
latex = '\angle {A} + \angle {B} + \angle {C} = 180^{{\circ}}'

[template.slots.A]
type = "S"
pool = "ANGLE_POOL"

[template.slots.B]
type = "S"
pool = "ANGLE_POOL"

[template.slots.C]
type = "S"
pool = "ANGLE_POOL"

# ----

[[template]]
name  = "angle_sum_90"
latex = '\angle {A} + \angle {B} = 90^{{\circ}}'

[template.slots.A]
type = "S"
pool = "ANGLE_POOL"

[template.slots.B]
type = "S"
pool = "ANGLE_POOL"

# ----

[[template]]
name  = "angle_letter_eq_val"
latex = '\angle {A} = {d}^{{\circ}}'

[template.slots.A]
type = "S"
pool = "ANGLE_POOL"

[template.slots.d]
type = "S"
pool = "DEG_POOL"

# ----

[[template]]
name  = "angle_ineq"
latex = '\angle {A}{B}{C} < \angle {D}{E}{F}'

[template.slots.A]
type = "S"
pool = "PTS_POOL"

[template.slots.B]
type = "S"
pool = "PTS_POOL"

[template.slots.C]
type = "S"
pool = "PTS_POOL"

[template.slots.D]
type = "S"
pool = "PTS_POOL"

[template.slots.E]
type = "S"
pool = "PTS_POOL"

[template.slots.F]
type = "S"
pool = "PTS_POOL"

# ---------------------------------------------------------------------------
# Triangles
# ---------------------------------------------------------------------------

[[template]]
name  = "triangle_congruent"
latex = '\triangle {P}{Q}{R} \cong \triangle {P2}{Q2}{R2}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.P2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R2]
type = "S"
pool = "TRI_VERTS_POOL"

# ----

[[template]]
name  = "triangle_similar"
latex = '\triangle {P}{Q}{R} \sim \triangle {P2}{Q2}{R2}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
