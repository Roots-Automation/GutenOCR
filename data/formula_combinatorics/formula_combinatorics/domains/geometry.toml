[meta]
domain = "geometry"

# ---------------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "PTS_POOL"
values = ["A", "B", "C", "D", "E", "F", "P", "Q", "R"]

[[pool]]
name   = "TRI_VERTS_POOL"
values = ["A", "B", "C", "D", "E", "F", "X", "Y", "Z"]

[[pool]]
name   = "ANGLE_POOL"
values = ["A", "B", "C", "D", "E", "F", "P", "Q", "R", '\alpha', '\beta', '\gamma']

[[pool]]
name   = "DEG_POOL"
values = ["15", "20", "25", "30", "36", "40", "45", "50", "54", "60", "72", "75", "90", "100", "108", "120", "135", "144", "150", "160", "170", "180"]

[[pool]]
name   = "SCALAR_POOL"
values = ["a", "b", "c", "d", "k", "m", "n", "r"]

[[pool]]
name   = "CIRCLE_POOL"
values = ["1", "2", "3", "4", "5", "6"]

[[pool]]
name   = "SIN_NAMES"
values = ['\sin', '\text{sin}']

[[pool]]
name   = "COS_NAMES"
values = ['\cos', '\text{cos}']

[[pool]]
name   = "AREA_LABEL_POOL"
values = ["S", "A", "T"]

[[pool]]
name   = "REL_INEQ_POOL"
values = ["<", ">", "\\leq", "\\geq"]

[[pool]]
name   = "DOT_OP_POOL"
values = ["\\cdot", "\\bullet"]

[[pool]]
name   = "EQ_REL_POOL"
values = ["=", "\\approx"]

[[pool]]
name   = "DEG_SUFFIX_POOL"
values = ['^{{\circ}}', '\,^{{\circ}}', '^{{o}}', '\,\mathrm{{deg}}', '\,\text{{deg}}']

# ---------------------------------------------------------------------------
# Angles
# ---------------------------------------------------------------------------

[[template]]
name  = "angle_eq_angle"
latex = '\angle {A}{B}{C} = \angle {D}{E}{F}'

[template.slots.A]
type = "S"
pool = "PTS_POOL"

[template.slots.B]
type = "S"
pool = "PTS_POOL"

[template.slots.C]
type = "S"
pool = "PTS_POOL"

[template.slots.D]
type = "S"
pool = "PTS_POOL"

[template.slots.E]
type = "S"
pool = "PTS_POOL"

[template.slots.F]
type = "S"
pool = "PTS_POOL"

# ----

[[template]]
name  = "angle_eq_deg"
latex = ""

  [[template.variants]]
  name  = "angle_eq_deg_fixed"
  latex = '\angle {A}{B}{C} {rel} {d}{sfx}'

  [template.variants.slots.A]
  type = "S"
  pool = "PTS_POOL"

  [template.variants.slots.B]
  type = "S"
  pool = "PTS_POOL"

  [template.variants.slots.C]
  type = "S"
  pool = "PTS_POOL"

  [template.variants.slots.rel]
  type = "S"
  pool = "EQ_REL_POOL"

  [template.variants.slots.d]
  type = "S"
  pool = "DEG_POOL"

  [template.variants.slots.sfx]
  type = "S"
  pool = "DEG_SUFFIX_POOL"

  [[template.variants]]
  name  = "angle_eq_deg_alg"
  latex = '\angle {A}{B}{C} {rel} {d}{sfx}'

  [template.variants.slots.A]
  type = "S"
  pool = "PTS_POOL"

  [template.variants.slots.B]
  type = "S"
  pool = "PTS_POOL"

  [template.variants.slots.C]
  type = "S"
  pool = "PTS_POOL"

  [template.variants.slots.rel]
  type = "S"
  pool = "EQ_REL_POOL"

  [template.variants.slots.d]
  type = "S"
  pool = "SCALAR_POOL"
  idx  = 0.35

  [template.variants.slots.sfx]
  type = "S"
  pool = "DEG_SUFFIX_POOL"

# ----

[[template]]
name  = "angle_sum_180"
latex = '\angle {A} + \angle {B} + \angle {C} = 180{sfx}'

[template.slots.A]
type = "S"
pool = "ANGLE_POOL"

[template.slots.B]
type = "S"
pool = "ANGLE_POOL"

[template.slots.C]
type = "S"
pool = "ANGLE_POOL"

[template.slots.sfx]
type = "S"
pool = "DEG_SUFFIX_POOL"

# ----

[[template]]
name  = "angle_sum_90"
latex = '\angle {A} + \angle {B} = 90{sfx}'

[template.slots.A]
type = "S"
pool = "ANGLE_POOL"

[template.slots.B]
type = "S"
pool = "ANGLE_POOL"

[template.slots.sfx]
type = "S"
pool = "DEG_SUFFIX_POOL"

# ----

[[template]]
name  = "angle_letter_eq_val"
latex = ""

  [[template.variants]]
  name  = "angle_letter_eq_val_fixed"
  latex = '\angle {A} {rel} {d}{sfx}'

  [template.variants.slots.A]
  type = "S"
  pool = "ANGLE_POOL"

  [template.variants.slots.rel]
  type = "S"
  pool = "EQ_REL_POOL"

  [template.variants.slots.d]
  type = "S"
  pool = "DEG_POOL"

  [template.variants.slots.sfx]
  type = "S"
  pool = "DEG_SUFFIX_POOL"

  [[template.variants]]
  name  = "angle_letter_eq_val_alg"
  latex = '\angle {A} {rel} {d}{sfx}'

  [template.variants.slots.A]
  type = "S"
  pool = "ANGLE_POOL"

  [template.variants.slots.rel]
  type = "S"
  pool = "EQ_REL_POOL"

  [template.variants.slots.d]
  type = "S"
  pool = "SCALAR_POOL"
  idx  = 0.35

  [template.variants.slots.sfx]
  type = "S"
  pool = "DEG_SUFFIX_POOL"

# ----

[[template]]
name  = "angle_ineq"
latex = '\angle {A}{B}{C} {rel} \angle {D}{E}{F}'

[template.slots.A]
type = "S"
pool = "PTS_POOL"

[template.slots.B]
type = "S"
pool = "PTS_POOL"

[template.slots.C]
type = "S"
pool = "PTS_POOL"

[template.slots.D]
type = "S"
pool = "PTS_POOL"

[template.slots.E]
type = "S"
pool = "PTS_POOL"

[template.slots.F]
type = "S"
pool = "PTS_POOL"

[template.slots.rel]
type = "S"
pool = "REL_INEQ_POOL"

# ---------------------------------------------------------------------------
# Triangles
# ---------------------------------------------------------------------------

[[template]]
name  = "triangle_congruent"
latex = '\triangle {P}{Q}{R} \cong \triangle {P2}{Q2}{R2}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.P2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R2]
type = "S"
pool = "TRI_VERTS_POOL"

# ----

[[template]]
name  = "triangle_similar"
latex = '\triangle {P}{Q}{R} \sim \triangle {P2}{Q2}{R2}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.P2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R2]
type = "S"
pool = "TRI_VERTS_POOL"

# ----

[[template]]
name  = "triangle_area"
latex = '{al}_{{\triangle {P}{Q}{R}}} = \frac{{1}}{{2}} {a} {b} {sn} \angle {P}'

[template.slots.al]
type = "S"
pool = "AREA_LABEL_POOL"

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.a]
type = "S"
pool = "SCALAR_POOL"
idx  = 0.35

[template.slots.b]
type = "S"
pool = "SCALAR_POOL"
idx  = 0.35

[template.slots.sn]
type = "S"
pool = "SIN_NAMES"

# ----

[[template]]
name  = "triangle_angle_sum"
latex = '\angle {P} + \angle {Q} + \angle {R} = 180{sfx}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.sfx]
type = "S"
pool = "DEG_SUFFIX_POOL"

# ----

[[template]]
name  = "similar_ratio"
latex = '\frac{{\overline{{{P}{Q}}}}}{{\overline{{{P2}{Q2}}}}} = \frac{{\overline{{{Q}{R}}}}}{{\overline{{{Q2}{R2}}}}} = {k}'

[template.slots.P]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.P2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.Q2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.R2]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.k]
type = "S"
pool = "SCALAR_POOL"

# ----

[[template]]
name  = "pythagorean"
latex = '{a}^2 + {b}^2 = {c}^2'

[template.slots.a]
type = "S"
pool = "SCALAR_POOL"

[template.slots.b]
type = "S"
pool = "SCALAR_POOL"

[template.slots.c]
type = "S"
pool = "SCALAR_POOL"

# ----

[[template]]
name  = "law_of_cosines"
latex = '{c}^2 = {a}^2 + {b}^2 - 2{a}{b} {cn} \angle {C}'

[template.slots.a]
type = "S"
pool = "SCALAR_POOL"

[template.slots.b]
type = "S"
pool = "SCALAR_POOL"

[template.slots.c]
type = "S"
pool = "SCALAR_POOL"

[template.slots.C]
type = "S"
pool = "TRI_VERTS_POOL"

[template.slots.cn]
type = "S"
pool = "COS_NAMES"

