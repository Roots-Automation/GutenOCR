[meta]
domain = "fourier"

# ---------------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "FUNC_POOL"
values = ["f", "g", "h", "F", "G", '\phi', '\psi', '\varphi', '\chi', '\xi', '\eta']

[[pool]]
name   = "IDX_POOL"
values = ["i", "j", "k", "l", "m", "n", "p", "q", "r", "s", "t"]

[[pool]]
name   = "COEFF_POOL"
values = ["a", "b", "c", "d", "k", "m", "n", "p", "q", '\alpha', '\beta', '\gamma', '\lambda', '\mu', '\rho', '\kappa', '\theta']

[[pool]]
name   = "FREQ_POOL"
values = ['\xi', '\omega', '\nu', "k", '\zeta', '\lambda']

[[pool]]
name   = "TIME_POOL"
values = ["t", '\tau', "s", "u", "x"]

[[pool]]
name   = "PERIOD_POOL"
values = ["T", '2\pi', "L", "P"]

[[pool]]
name   = "SIZE_POOL"
values = ["N", "M", "K"]

[[pool]]
name   = "SIGNAL_POOL"
values = ["x", "y", "s", "u", "v", "X", "Y"]

[[pool]]
name   = "KERNEL_POOL"
values = ["h", "g", '\phi', '\psi', "w"]

[[pool]]
name   = "TVAR_POOL"
values = ['\tau', "s", "u", "v"]

[[pool]]
name   = "S_POOL"
values = ["s", 's + j\omega', '\sigma + i\omega', '\lambda']

# ---------------------------------------------------------------------------
# Part A: reparameterized originals (14)
# ---------------------------------------------------------------------------

[[template]]
name  = "fourier_transform"
latex = '\hat{{{ff}}}({xi}) = \int{lim_mod}_{{-\infty}}^{{\infty}} {ff}({tt})\, e^{{-2\pi i {tt} {xi}}} \, d{tt}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "inverse_fourier_transform"
latex = '{ff}({tt}) = \int{lim_mod}_{{-\infty}}^{{\infty}} \hat{{{ff}}}({xi})\, e^{{2\pi i {tt} {xi}}} \, d{xi}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "fourier_series"
latex = '{ff}({vv}) = \sum{lim_mod}_{{n=-\infty}}^{{\infty}} c_n\, e^{{2\pi i n {vv} / {T}}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.T]
type = "S"
pool = "PERIOD_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "fourier_coefficients"
latex = 'c_n = \frac{{1}}{{{T}}} \int_0^{{{T}}} {ff}({vv})\, e^{{-2\pi i n {vv} / {T}}} \, d{vv}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.T]
type = "S"
pool = "PERIOD_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "parseval"
latex = '\int{lim_mod}_{{-\infty}}^{{\infty}} |{ff}({tt})|^2 \, d{tt} = \int{lim_mod}_{{-\infty}}^{{\infty}} |\hat{{{ff}}}({xi})|^2 \, d{xi}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "convolution"
latex = '({ff} * {gg})({tt}) = \int{lim_mod}_{{-\infty}}^{{\infty}} {ff}({tau})\, {gg}({tt} - {tau}) \, d{tau}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

[template.slots.tau]
type = "S"
pool = "TVAR_POOL"

# ----

[[template]]
name  = "convolution_theorem"
latex = '\widehat{{{ff} * {gg}}} = \hat{{{ff}}} \cdot \hat{{{gg}}}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

# ----

[[template]]
name  = "laplace_transform"
latex = '\mathcal{{L}}\left\{{{ff}(t)\right\}}({ss}) = \int_0^{{\infty}} {ff}(t)\, e^{{-{ss}\, t}} \, dt'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.ss]
type = "S"
pool = "S_POOL"

# ----

[[template]]
name  = "z_transform"
latex = 'X(z) = \sum{lim_mod}_{{{nn}=-\infty}}^{{\infty}} {xx}[{nn}]\, z^{{-{nn}}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "dft"
latex = 'X[k] = \sum{lim_mod}_{{{nn}=0}}^{{{N}-1}} {xx}[{nn}]\, e^{{-2\pi i k {nn} / {N}}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.N]
type = "S"
pool = "SIZE_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "dirac_delta_sifting"
latex = '\int{lim_mod}_{{-\infty}}^{{\infty}} \delta({tt} - {aa})\, {ff}({tt}) \, d{tt} = {ff}({aa})'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

# ----

[[template]]
name  = "time_frequency_uncertainty"
latex = '\Delta {Dt} \cdot \Delta {Do} \geq \tfrac{{1}}{{2}}'

[template.slots.Dt]
type = "S"
pool = "TIME_POOL"

[template.slots.Do]
type = "S"
pool = "FREQ_POOL"

# ----

[[template]]
name  = "poisson_summation"
latex = '\sum{lim_mod}_{{{nn}=-\infty}}^{{\infty}} {ff}({nn}) = \sum{lim_mod}_{{k=-\infty}}^{{\infty}} \hat{{{ff}}}(k)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "transfer_function"
latex = 'H({fo}) = \frac{{{yy}({fo})}}{{{xx}({fo})}}'

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.yy]
type = "X"
pool = "SIGNAL_POOL"
exclude_from = ["xx"]

[template.slots.fo]
type = "S"
pool = "FREQ_POOL"

# ---------------------------------------------------------------------------
# Part B_CFT: continuous FT properties (8)
# ---------------------------------------------------------------------------

# ----

[[template]]
name  = "ft_linearity"
latex = '\widehat{{a\,{ff}+b\,{gg}}}({xi}) = a\,\hat{{{ff}}}({xi}) + b\,\hat{{{gg}}}({xi})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

# ----

[[template]]
name  = "ft_time_shift"
latex = '\widehat{{{ff}(\cdot - {aa})}}({xi}) = e^{{-2\pi i\,{aa}\,{xi}}}\,\hat{{{ff}}}({xi})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

# ----

[[template]]
name  = "ft_modulation"
latex = '\widehat{{e^{{2\pi i\,{aa}\,{tt}}}\,{ff}}}({xi}) = \hat{{{ff}}}({xi} - {aa})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "ft_scaling"
latex = '\widehat{{{ff}({aa}\,{tt})}}({xi}) = \frac{{1}}{{|{aa}|}}\,\hat{{{ff}}}\!\left(\frac{{{xi}}}{{{aa}}}\right)'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "ft_derivative"
latex = '\widehat{{{ff}^{{({nn})}}}}({xi}) = (2\pi i\,{xi})^{{{nn}}}\,\hat{{{ff}}}({xi})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "ft_duality"
latex = '\widehat{{\hat{{{ff}}}}}({tt}) = {ff}(-{tt})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "riemann_lebesgue"
latex = '\lim_{{|{xi}|\to\infty}} \hat{{{ff}}}({xi}) = 0'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.xi]
type = "S"
pool = "FREQ_POOL"

# ----

[[template]]
name  = "plancherel_theorem"
latex = '\langle \hat{{{ff}}},\, \hat{{{gg}}} \rangle = \langle {ff},\, {gg} \rangle_{{L^2}}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

# ---------------------------------------------------------------------------
# Part B_FS: Fourier series (8)
# ---------------------------------------------------------------------------

# ----

[[template]]
name  = "fourier_series_real"
latex = '{ff}({vv}) = \frac{{a_0}}{{2}} + \sum{lim_mod}_{{n=1}}^\infty \Bigl(a_n\cos\tfrac{{2\pi n\,{vv}}}{{{T}}} + b_n\sin\tfrac{{2\pi n\,{vv}}}{{{T}}}\Bigr)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.T]
type = "S"
pool = "PERIOD_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "fourier_coeff_cosine"
latex = 'a_{{{nn}}} = \frac{{2}}{{{T}}}\int_0^{{{T}}} {ff}({vv})\cos\tfrac{{2\pi\,{nn}\,{vv}}}{{{T}}}\,d{vv}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.T]
type = "S"
pool = "PERIOD_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "fourier_coeff_sine"
latex = 'b_{{{nn}}} = \frac{{2}}{{{T}}}\int_0^{{{T}}} {ff}({vv})\sin\tfrac{{2\pi\,{nn}\,{vv}}}{{{T}}}\,d{vv}'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.T]
type = "S"
pool = "PERIOD_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "dirichlet_kernel"
latex = 'D_{{{nn}}}({vv}) = \sum{lim_mod}_{{k=-{nn}}}^{{{nn}}} e^{{ik{vv}}} = \frac{{\sin\bigl(({nn}+\tfrac{{1}}{{2}}){vv}\bigr)}}{{\sin({vv}/2)}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "fejer_kernel"
latex = 'F_{{{nn}}}({vv}) = \frac{{1}}{{{nn}}}\sum{lim_mod}_{{k=0}}^{{{nn}-1}} D_k({vv})'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "parseval_series"
latex = '\sum{lim_mod}_{{n=-\infty}}^\infty |c_n|^2 = \frac{{1}}{{{T}}}\int_0^{{{T}}} |{ff}({vv})|^2\,d{vv}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.T]
type = "S"
pool = "PERIOD_POOL"

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "bessel_inequality"
latex = '\sum{lim_mod}_{{n=0}}^\infty \bigl|\langle {ff},\, e_n\rangle\bigr|^2 \leq \|{ff}\|^2'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

# ----

[[template]]
name  = "orthonormality_trig"
latex = '\frac{{1}}{{{T}}}\int_0^{{{T}}} e^{{2\pi i\,{nn}\,{vv}/{T}}}\,e^{{-2\pi i\,{mm}\,{vv}/{T}}}\,d{vv} = \delta_{{{nn}{mm}}}'

[template.slots.T]
type = "S"
pool = "PERIOD_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[template.slots.mm]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

[template.slots.vv]
type = "S"
pool = "TIME_POOL"

# ---------------------------------------------------------------------------
# Part B_DFT: DFT / FFT (6)
# ---------------------------------------------------------------------------

# ----

[[template]]
name  = "idft"
latex = '{xx}[{nn}] = \frac{{1}}{{{N}}}\sum{lim_mod}_{{k=0}}^{{{N}-1}} X[k]\,e^{{2\pi i k\,{nn}/{N}}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.N]
type = "S"
pool = "SIZE_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "dft_shift"
latex = 'X[k]\,e^{{2\pi i k\,{nn}/{N}}} \;\longleftrightarrow\; {xx}[{nn} - n_0]'

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.N]
type = "S"
pool = "SIZE_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "dft_parseval"
latex = '\sum{lim_mod}_{{{nn}=0}}^{{{N}-1}}|{xx}[{nn}]|^2 = \frac{{1}}{{{N}}}\sum{lim_mod}_{{k=0}}^{{{N}-1}}|X[k]|^2'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.N]
type = "S"
pool = "SIZE_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "dft_convolution"
latex = '{xx}[n] * {hh}[n] \;\longleftrightarrow\; X[k]\,H[k]'

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.hh]
type = "S"
pool = "KERNEL_POOL"

# ----

[[template]]
name  = "twiddle_factor"
latex = 'W_{{{N}}} = e^{{-2\pi i/{N}}},\quad X[k] = \sum{lim_mod}_{{{nn}=0}}^{{{N}-1}} {xx}[{nn}]\,W_{{{N}}}^{{{nn} k}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.N]
type = "S"
pool = "SIZE_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "nyquist_sampling"
latex = '{fs} \geq 2\,{fb}'

[template.slots.fs]
type = "S"
pool = "FREQ_POOL"

[template.slots.fb]
type = "X"
pool = "FREQ_POOL"
exclude_from = ["fs"]

# ---------------------------------------------------------------------------
# Part B_LAP: Laplace transform (6)
# ---------------------------------------------------------------------------

# ----

[[template]]
name  = "laplace_derivative"
latex = '''\mathcal{{L}}\left\{{{ff}'(t)\right\}}({ss}) = {ss}\,F({ss}) - {ff}(0)'''

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.ss]
type = "S"
pool = "S_POOL"

# ----

[[template]]
name  = "laplace_convolution"
latex = '\mathcal{{L}}\left\{{{ff} * {gg}\right\}}({ss}) = F({ss})\cdot G({ss})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.ss]
type = "S"
pool = "S_POOL"

# ----

[[template]]
name  = "laplace_shift"
latex = '\mathcal{{L}}\left\{{e^{{{aa}\,t}}\,{ff}(t)\right\}}({ss}) = F({ss} - {aa})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.ss]
type = "S"
pool = "S_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

# ----

[[template]]
name  = "laplace_scale"
latex = '\mathcal{{L}}\left\{{{ff}({aa}\,t)\right\}}({ss}) = \frac{{1}}{{|{aa}|}}\,F\!\left(\frac{{{ss}}}{{{aa}}}\right)'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.ss]
type = "S"
pool = "S_POOL"

[template.slots.aa]
type = "S"
pool = "COEFF_POOL"

# ----

[[template]]
name  = "laplace_initial_value"
latex = '\lim_{{t\to 0^+}} {ff}(t) = \lim_{{{ss}\to\infty}} {ss}\,F({ss})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.ss]
type = "S"
pool = "S_POOL"

# ----

[[template]]
name  = "laplace_final_value"
latex = '\lim_{{t\to\infty}} {ff}(t) = \lim_{{{ss}\to 0}} {ss}\,F({ss})'

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.ss]
type = "S"
pool = "S_POOL"

# ---------------------------------------------------------------------------
# Part B_ZT: Z-transform (4)
# ---------------------------------------------------------------------------

# ----

[[template]]
name  = "z_transform_shift"
latex = '\mathcal{{Z}}\left\{{{xx}[n-{nn}]\right\}}(z) = z^{{-{nn}}}\,X(z)'

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.nn]
type = "S"
pool = "IDX_POOL"

# ----

[[template]]
name  = "z_transform_convolution"
latex = '\mathcal{{Z}}\left\{{{xx} * {hh}\right\}}(z) = X(z)\,H(z)'

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

[template.slots.hh]
type = "S"
pool = "KERNEL_POOL"

# ----

[[template]]
name  = "z_transform_final_value"
latex = '\lim_{{n\to\infty}} {xx}[n] = \lim_{{z\to 1}}(z-1)\,X(z)'

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

# ----

[[template]]
name  = "z_transform_poles"
latex = 'X(z) = \frac{{B(z)}}{{A(z)}},\quad \text{{poles: }} A(z) = 0'

[template.slots.xx]
type = "S"
pool = "SIGNAL_POOL"

# ---------------------------------------------------------------------------
# Part B_HA: Harmonic analysis / functional analysis (6)
# ---------------------------------------------------------------------------

# ----

[[template]]
name  = "l2_norm_def"
latex = '\|{ff}\|_{{L^2}} = \left(\int{lim_mod}_{{-\infty}}^{{\infty}} |{ff}({tt})|^2\,d{tt}\right)^{{1/2}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "inner_product_l2"
latex = '\langle {ff},\, {gg}\rangle = \int{lim_mod}_{{-\infty}}^{{\infty}} {ff}({tt})\,\overline{{{gg}({tt})}}\,d{tt}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

# ----

[[template]]
name  = "hilbert_transform"
latex = '\mathcal{{H}}\left\{{{ff}\right\}}({tt}) = \frac{{1}}{{\pi}}\,\mathrm{{p.v.}}\int{lim_mod}_{{-\infty}}^\infty \frac{{{ff}({tau})}}{{{tt} - {tau}}}\,d{tau}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ff]
type = "S"
pool = "FUNC_POOL"

[template.slots.tt]
type = "S"
pool = "TIME_POOL"

[template.slots.tau]
type = "S"
pool = "TVAR_POOL"

# ----

[[template]]
name  = "autocorrelation"
