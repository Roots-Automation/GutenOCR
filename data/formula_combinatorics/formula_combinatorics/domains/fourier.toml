latex = 'W_{{{ff}}}(a,b) = \frac{{1}}{{\sqrt{{|a|}}}}\int{lim_mod}_{{-\infty}}^\infty {ff}({tt})\,\overline{{\psi\!\left(\frac{{{tt}-b}}{{a}}\right)}}\,d{tt}'

[template.slots.lim_mod]
