n    = 5

[[template.variants]]
name  = "quotient_rule"
latex = '''\frac{{d}}{{d{v}}}\left[\frac{{{f}({v})}}{{{g2}({v})}}\right] = \frac{{{f}'({v}) {g2}({v}) - {f}({v}) {g2}'({v})}}{{{g2}({v})^2}}'''

[template.variants.slots.v]
type = "S"
pool = "VARS_POOL"

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.variants.slots.g2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[[template.variants]]
name  = "power_rule"
latex = '\frac{{d}}{{d{v}}} {v}^{{{n}}} = {n} {v}^{{{n}-1}}'

[template.variants.slots.v]
type = "S"
pool = "VARS_POOL"

[template.variants.slots.n]
type = "S"
pool = ["n","m","p","k",'\alpha']

[[template.variants]]
name  = "generalized_power_rule"
latex = '''\frac{{d}}{{d{v}}} \left[{f}({v})\right]^{{{n}}} = {n} \left[{f}({v})\right]^{{{n}-1}} {f}'({v})'''

[template.variants.slots.v]
type = "S"
pool = "VARS_POOL"

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.variants.slots.n]
type = "S"
pool = ["n","m","p","k",'\alpha']

# ── 32. geometric_integrals (variant group) ───────────────────────────────────
[[template]]
name  = "geometric_integrals"
latex = ""

