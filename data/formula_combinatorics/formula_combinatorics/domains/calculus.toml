[meta]
domain = "calculus"

[[pool]]
name   = "VARS_POOL"
values = ["x","y","z","t","u","v","r","s"]

[[pool]]
name   = "SCALARS_POOL"
values = ["a","b","c","d","k","m","n","p","q"]

[[pool]]
name   = "VEC_FIELD_POOL"
values = ["F","G","E","B","v","u","w","H"]

[[pool]]
name   = "VOL_DOMAIN_POOL"
values = ["V", '\Omega', "D", "U", '\mathcal{V}', "R"]

[[pool]]
name   = "SURFACE_POOL"
values = ["S", '\Sigma', '\mathcal{S}', "A"]

[[pool]]
name   = "CURVE_POOL"
values = ["C", '\partial S', '\partial \Sigma', '\Gamma', '\partial D']

[[pool]]
name   = "MFLD_POOL"
values = ["M", '\Omega', '\Sigma', '\mathcal{M}', "N", "X"]

[[pool]]
name   = "CF_POOL"
values = ["f","g","h", '\phi', '\psi']

[[pool]]
name   = "CV_POOL"
values = ["x","t","u","s"]

[[pool]]
name   = "CD_POOL"
values = ['\mathbb{R}', '[a,b]', '[0,1]', '\mathbb{R}^n']

# ── 1. first_derivative ──────────────────────────────────────────────────────
[[template]]
name  = "first_derivative"
latex = '\frac{{d}}{{d{v}}}\left[{expr}\right]'

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.expr]
type = "E"
gen  = "_expr"
n    = 100

# ── 2. nth_derivative ────────────────────────────────────────────────────────
[[template]]
name  = "nth_derivative"
latex = '\frac{{d^{{{n}}}}}{{d{v}^{{{n}}}}}\left[{expr}\right]'

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.n]
type = "S"
pool = ["2","3","4","n","m"]

[template.slots.expr]
type = "E"
gen  = "_expr"
n    = 100

# ── 3. indef_integral ────────────────────────────────────────────────────────
[[template]]
name  = "indef_integral"
latex = '{result}'

[template.slots.result]
type = "E"
gen  = "_indef_integral"
n    = 5000

# ── 4. def_integral ──────────────────────────────────────────────────────────
[[template]]
name  = "def_integral"
latex = '{result}'

[template.slots.result]
type = "E"
gen  = "_def_integral"
n    = 5000

# ── 5. double_integral_domain ────────────────────────────────────────────────
[[template]]
name  = "double_integral_domain"
latex = '\iint_{{\mathcal{{D}}}} {expr} \, d{v} \, d{v2}'

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

[template.slots.expr]
type = "E"
gen  = "_expr"
n    = 100

# ── 6. limit_simple ──────────────────────────────────────────────────────────
[[template]]
name  = "limit_simple"
latex = '\lim_{{{v} \to {pt}}} {expr}'

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.pt]
type = "S"
pool = ["a","b","c","d","k","m","n","p","q",'\infty',"0"]

[template.slots.expr]
type = "E"
gen  = "_expr"
n    = 100

# ── 7. limit_ratio ───────────────────────────────────────────────────────────
[[template]]
name  = "limit_ratio"
latex = '\lim_{{{v} \to {pt}}} \frac{{{num}}}{{{den}}}'

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.pt]
type = "S"
pool = ['\infty',"0","a","b","c","d","k","m","n","p","q"]

[template.slots.num]
type = "E"
gen  = "_expr"
n    = 100

[template.slots.den]
type = "E"
gen  = "_expr"
n    = 100

# ── 8. mixed_partial ─────────────────────────────────────────────────────────
[[template]]
name  = "mixed_partial"
latex = '\frac{{\partial^2 {f}}}{{\partial {v} \, \partial {v2}}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

# ── 9. taylor_series ─────────────────────────────────────────────────────────
[[template]]
name  = "taylor_series"
latex = '\sum{lim_mod}_{{n=0}}^{{\infty}} \frac{{{f}^{{(n)}}({a})}}{{n!}} \left({v} - {a}\right)^n'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

# ── 10. maclaurin_series ─────────────────────────────────────────────────────
[[template]]
name  = "maclaurin_series"
latex = '\sum{lim_mod}_{{n=0}}^{{\infty}} \frac{{{f}^{{(n)}}(0)}}{{n!}} {v}^n'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.v]
type = "S"
pool = "VARS_POOL"

# ── 11. taylor_polynomial ────────────────────────────────────────────────────
[[template]]
name  = "taylor_polynomial"
latex = '''{f}({a}) + {f}'({a})({v} - {a}) + \frac{{{f}''({a})}}{{2!}}({v} - {a})^2 + \cdots'''

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

# ── 12. ftc ──────────────────────────────────────────────────────────────────
[[template]]
name  = "ftc"
latex = '''\int{lim_mod}_{{{a}}}^{{{b}}} {f}'({v}) \, d{v} = {f}({b}) - {f}({a})'''

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

[template.slots.b]
type = "E"
gen  = "_atom"
n    = 150

# ── 13. chain_rule ───────────────────────────────────────────────────────────
[[template]]
name  = "chain_rule"
latex = '''\frac{{d}}{{d{v}}}\left[{f}\!\left({g2}({v})\right)\right] = {f}'\!\left({g2}({v})\right) {g2}'({v})'''

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.g2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

# ── 14. chain_rule_leibniz (variant group) ───────────────────────────────────
[[template]]
name  = "chain_rule_leibniz"
latex = ""

[[template.variants]]
name  = "chain_rule_leibniz_classic"
latex = '\frac{{d{z}}}{{d{v}}} = \frac{{d{z}}}{{d{u}}} \cdot \frac{{d{u}}}{{d{v}}}'

[template.variants.slots.z]
type = "S"
pool = ['\phi','\psi','\eta','\zeta','\rho',"w"]

[template.variants.slots.v]
type = "S"
pool = "VARS_POOL"

[template.variants.slots.u]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

[[template.variants]]
name  = "chain_rule_leibniz_composed"
latex = '\frac{{d{f}}}{{d{v}}} = \frac{{d{f}}}{{d{gg}}} \cdot \frac{{d{gg}}}{{d{v}}}'

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.variants.slots.gg]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.variants.slots.v]
type = "S"
pool = "VARS_POOL"

# ── 15. gradient_2d ──────────────────────────────────────────────────────────
[[template]]
name  = "gradient_2d"
latex = '\nabla {f} = \frac{{\partial {f}}}{{\partial {v}}} \mathbf{{e}}_1 + \frac{{\partial {f}}}{{\partial {v2}}} \mathbf{{e}}_2'

[template.slots.f]
type = "E"
gen  = "_fn_rich"
n    = 272

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

# ── 16. gradient_2d_ij ───────────────────────────────────────────────────────
[[template]]
name  = "gradient_2d_ij"
latex = '\nabla {f} = \frac{{\partial {f}}}{{\partial {v}}} \hat{{i}} + \frac{{\partial {f}}}{{\partial {v2}}} \hat{{j}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich"
n    = 272

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

# ── 17. gradient_3d ──────────────────────────────────────────────────────────
[[template]]
name  = "gradient_3d"
latex = '\nabla {f} = \frac{{\partial {f}}}{{\partial {v}}} \mathbf{{e}}_1 + \frac{{\partial {f}}}{{\partial {v2}}} \mathbf{{e}}_2 + \frac{{\partial {f}}}{{\partial {v3}}} \mathbf{{e}}_3'

[template.slots.f]
type = "E"
gen  = "_fn_rich"
n    = 272

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

[template.slots.v3]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v","v2"]

# ── 18. divergence_theorem (variant group) ───────────────────────────────────
[[template]]
name  = "divergence_theorem"
latex = ""

[[template.variants]]
name  = "divergence_standard"
latex = '\iint_{{\partial {vol}}} \mathbf{{{fld}}} \cdot d\mathbf{{S}} = \iiint_{{{vol}}} \nabla \cdot \mathbf{{{fld}}} \, dV'

[template.variants.slots.fld]
type = "S"
pool = "VEC_FIELD_POOL"

[template.variants.slots.vol]
type = "S"
pool = "VOL_DOMAIN_POOL"

[[template.variants]]
name  = "divergence_hat_normal"
latex = '\oiint_{{\partial {vol}}} \mathbf{{{fld}}} \cdot \hat{{n}} \, dS = \iiint_{{{vol}}} \nabla \cdot \mathbf{{{fld}}} \, dV'

[template.variants.slots.fld]
type = "S"
pool = "VEC_FIELD_POOL"

[template.variants.slots.vol]
type = "S"
pool = "VOL_DOMAIN_POOL"

[[template.variants]]
name  = "divergence_div_operator"
latex = '\iint_{{\partial {vol}}} \mathbf{{{fld}}} \cdot d\mathbf{{S}} = \iiint_{{{vol}}} \operatorname{{div}} \mathbf{{{fld}}} \, dV'

[template.variants.slots.fld]
type = "S"
pool = "VEC_FIELD_POOL"

[template.variants.slots.vol]
type = "S"
pool = "VOL_DOMAIN_POOL"

# ── 19. laplacian_2d ─────────────────────────────────────────────────────────
[[template]]
name  = "laplacian_2d"
latex = '\nabla^2 {f} = \frac{{\partial^2 {f}}}{{\partial {v}^2}} + \frac{{\partial^2 {f}}}{{\partial {v2}^2}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich"
n    = 272

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

# ── 20. laplacian_delta ──────────────────────────────────────────────────────
[[template]]
name  = "laplacian_delta"
latex = '\Delta {f} = \frac{{\partial^2 {f}}}{{\partial {v}^2}} + \frac{{\partial^2 {f}}}{{\partial {v2}^2}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich"
n    = 272

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

# ── 21. laplacian_3d ─────────────────────────────────────────────────────────
[[template]]
name  = "laplacian_3d"
latex = '\nabla^2 {f} = \frac{{\partial^2 {f}}}{{\partial {v}^2}} + \frac{{\partial^2 {f}}}{{\partial {v2}^2}} + \frac{{\partial^2 {f}}}{{\partial {v3}^2}}'

[template.slots.f]
type = "E"
gen  = "_fn_rich"
n    = 272

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

[template.slots.v3]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v","v2"]

# ── 22. stokes_theorem (variant group) ───────────────────────────────────────
[[template]]
name  = "stokes_theorem"
latex = ""

[[template.variants]]
name  = "stokes_standard"
latex = '\oint{lim_mod}_{{{crv}}} \mathbf{{{fld}}} \cdot d\mathbf{{r}} = \iint_{{{srf}}} \left(\nabla \times \mathbf{{{fld}}}\right) \cdot d\mathbf{{S}}'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.fld]
type = "S"
pool = "VEC_FIELD_POOL"

[template.variants.slots.srf]
type = "S"
pool = "SURFACE_POOL"

[template.variants.slots.crv]
type = "S"
pool = "CURVE_POOL"

[[template.variants]]
name  = "stokes_curl_operator"
latex = '\oint{lim_mod}_{{{crv}}} \mathbf{{{fld}}} \cdot d\mathbf{{r}} = \iint_{{{srf}}} \operatorname{{curl}}\!\left(\mathbf{{{fld}}}\right) \cdot d\mathbf{{S}}'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.fld]
type = "S"
pool = "VEC_FIELD_POOL"

[template.variants.slots.srf]
type = "S"
pool = "SURFACE_POOL"

[template.variants.slots.crv]
type = "S"
pool = "CURVE_POOL"

[[template.variants]]
name  = "stokes_differential_forms"
latex = '\int{lim_mod}_{{\partial {mfld}}} \omega = \int{lim_mod}_{{{mfld}}} d\omega'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.mfld]
type = "S"
pool = "MFLD_POOL"

# ── 23. greens_theorem (variant group) ───────────────────────────────────────
[[template]]
name  = "greens_theorem"
latex = ""

[[template.variants]]
name  = "greens_theorem_flux"
latex = '\oint{lim_mod}_{{{crv}}} \mathbf{{{fld}}} \cdot \hat{{n}} \, ds = \iint_{{{dom}}} \nabla \cdot \mathbf{{{fld}}} \, dA'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.fld]
type = "S"
pool = "VEC_FIELD_POOL"

[template.variants.slots.crv]
type = "S"
pool = ["C", '\partial D', '\partial R']

[template.variants.slots.dom]
type = "S"
pool = ["D", '\Omega', "R"]

[[template.variants]]
name  = "greens_theorem_circulation"
latex = '\oint{lim_mod}_{{{crv}}} \mathbf{{{fld}}} \cdot d\mathbf{{r}} = \iint_{{{dom}}} \left(\frac{{\partial Q}}{{\partial x}} - \frac{{\partial P}}{{\partial y}}\right) dA'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.fld]
type = "S"
pool = "VEC_FIELD_POOL"

[template.variants.slots.crv]
type = "S"
pool = ["C", '\partial D', '\partial R']

[template.variants.slots.dom]
type = "S"
pool = ["D", '\Omega', "R"]

# ── 24. iterated_integral ────────────────────────────────────────────────────
[[template]]
name  = "iterated_integral"
latex = '\int{lim_mod}_{{{a}}}^{{{b}}} \int{lim_mod}_{{g_1({v})}}^{{g_2({v})}} {f}({v}, {v2}) \, d{v2} \, d{v}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.v2]
type         = "X"
pool         = "VARS_POOL"
exclude_from = ["v"]

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

[template.slots.b]
type = "E"
gen  = "_atom"
n    = 150

# ── 25. lhopital_rule ────────────────────────────────────────────────────────
[[template]]
name  = "lhopital_rule"
latex = '''\lim_{{{v} \to {a}}} \frac{{{f}({v})}}{{{g2}({v})}} = \lim_{{{v} \to {a}}} \frac{{{f}'({v})}}{{{g2}'({v})}}'''

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.g2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

# ── 26. integration_by_parts ─────────────────────────────────────────────────
[[template]]
name  = "integration_by_parts"
latex = '\int {f} \, d{g2} = {f} {g2} - \int {g2} \, d{f}'

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.g2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

# ── 27. integration_by_parts_definite ────────────────────────────────────────
[[template]]
name  = "integration_by_parts_definite"
latex = '\int{lim_mod}_{{{a}}}^{{{b}}} {f} \, d{g2} = \left[{f} \, {g2}\right]_{{{a}}}^{{{b}}} - \int{lim_mod}_{{{a}}}^{{{b}}} {g2} \, d{f}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.g2]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

[template.slots.b]
type = "E"
gen  = "_atom"
n    = 150

# ── 28. leibniz_integral_rule ─────────────────────────────────────────────────
[[template]]
name  = "leibniz_integral_rule"
latex = '''\frac{{d}}{{d{v}}} \int{lim_mod}_{{a({v})}}^{{b({v})}} {f}({v}, {it}) \, d{it} = {f}({v}, b({v})) b'({v}) - {f}({v}, a({v})) a'({v}) + \int{lim_mod}_{{a({v})}}^{{b({v})}} \frac{{\partial {f}}}{{\partial {v}}} \, d{it}'''

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.it]
type = "S"
pool = ["t","s",'\tau','\sigma']

# ── 29. mean_value_theorem ───────────────────────────────────────────────────
[[template]]
name  = "mean_value_theorem"
latex = '''\exists c \in ({a}, {b}) : {f}'(c) = \frac{{{f}({b}) - {f}({a})}}{{{b} - {a}}}'''

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

[template.slots.b]
type = "E"
gen  = "_atom"
n    = 150

# ── 30. mean_value_theorem_integral ─────────────────────────────────────────
[[template]]
name  = "mean_value_theorem_integral"
latex = '\frac{{1}}{{{b} - {a}}} \int{lim_mod}_{{{a}}}^{{{b}}} {f}({v}) \, d{v} = {f}(c)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.v]
type = "S"
pool = "VARS_POOL"

[template.slots.a]
type = "E"
gen  = "_atom"
n    = 150

[template.slots.b]
type = "E"
gen  = "_atom"
n    = 150

# ── 31. derivative_rules (variant group) ─────────────────────────────────────
[[template]]
name  = "derivative_rules"
latex = ""

[[template.variants]]
name  = "product_rule"
latex = '''\frac{{d}}{{d{v}}}\left[{f}({v}) \cdot {g2}({v})\right] = {f}'({v}) {g2}({v}) + {f}({v}) {g2}'({v})'''

[template.variants.slots.v]
type = "S"
pool = "VARS_POOL"

[template.variants.slots.f]
type = "E"
gen  = "_fn_rich_nosub"
