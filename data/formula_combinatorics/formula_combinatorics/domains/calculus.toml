[template.slots.s]
type = "E"
gen  = "_substack_prod"
n    = 5000000

# ── 76. interval_notation ────────────────────────────────────────────────────
[[template]]
name  = "interval_notation"
latex = '{v} \in {ivl}'

[template.slots.v]
type = "S"
pool = ["x","y","z","t","u"]

[template.slots.ivl]
type = "E"
gen  = "_interval"
n    = 324

# ── 77. interval_bounds ──────────────────────────────────────────────────────
[[template]]
name  = "interval_bounds"
latex = '{f} : {ivl_a} \to {ivl_b}'

[template.slots.f]
type = "S"
pool = ["f","g","h","F"]

[template.slots.ivl_a]
type = "E"
gen  = "_interval"
n    = 324

[template.slots.ivl_b]
type = "E"
gen  = "_interval"
n    = 324

# ---------------------------------------------------------------------------
# Partial fraction decomposition
# ---------------------------------------------------------------------------

[[template]]
name  = "partial_fraction"
latex = '\frac{{{a}}}{{{v}({v} - {b})}} = \frac{{{s1}}}{{{v}}} + \frac{{{s2}}}{{{v} - {b}}}'

[template.slots.v]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.a]
type = "S"
pool = "SCALARS_POOL"
idx  = 0.35

[template.slots.b]
type = "X"
pool = "SCALARS_POOL"
exclude_from = ["a"]

[template.slots.s1]
type = "S"
pool = "SCALARS_POOL"

[template.slots.s2]
type = "S"
pool = "SCALARS_POOL"

# ---------------------------------------------------------------------------
# Telescoping sum
# ---------------------------------------------------------------------------

[[template]]
name  = "telescoping_sum"
latex = '\sum{lim_mod}_{{k=1}}^{{{n}}} \left({fn}(k+1) - {fn}(k)\right) = {fn}({n}+1) - {fn}(1)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.fn]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.n]
type = "S"
pool = "SCALARS_POOL"
