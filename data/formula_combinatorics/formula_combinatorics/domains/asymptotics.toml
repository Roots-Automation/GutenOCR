  n    = 5

  [template.variants.slots.h]
  type = "E"
  gen  = "_fn_rich_nosub"
  n    = 5

  [template.variants.slots.v]
  type = "S"
  pool = "GEO_N_POOL"

  [[template.variants]]
  name  = "error_little_o"
  latex = '{f}({v}) = {g}({v}) + o\!\left({h}({v})\right) \text{{ as }} {v} \to \infty'

