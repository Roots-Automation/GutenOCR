[meta]
name        = "asymptotics"
version     = "1.0.0"
author      = "GutenOCR"
license     = "MIT"
description = "Asymptotics, algorithm complexity, and numerical analysis"

# ---------------------------------------------------------------------------
# Slot pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "GEO_N_POOL"
values = ['n', 'm', 'N', 'M', 'K', 'k', 'p', 'r']

[[pool]]
name   = "BVAR_POOL"
values = ['x', 'y', 'z', 't', 'u', 'v', 'r', 's']

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------

