[meta]
domain = "trigonometry"

[[pool]]
name   = "VARS_POOL"
values = ["x","y","z","t","u","v","r","s"]

[[pool]]
name   = "SCALARS_POOL"
values = ["a","b","c","d","k","m","n","p","q"]

[[pool]]
name   = "TRIG_ARG_POOL"
values = ["a","b","c","d","k","m","n","p","q",'\theta','\phi','\varphi','\psi','\omega','\alpha','\beta','\gamma','\delta']

[[pool]]
name   = "SIDES_POOL"
values = ["a","b","c","p","q","r"]

[[pool]]
name   = "ANGLES_POOL"
values = ["A","B","C","P","Q","R"]

[[pool]]
name   = "GEO_N_POOL"
values = ["n","m","N","M","K","k","p","r"]

[[pool]]
name   = "TRIG_INT_FN_POOL"
values = ['\sin','\cos','\tan','\sinh','\cosh','\sec','\text{sine}','\text{cosine}','\text{tangent}','\text{sh}','\text{ch}']

[[pool]]
name   = "FOURIER_N_POOL"
values = ["2","3","4","5","6","n","m","N","M","K","p"]

[[pool]]
name   = "SIN_NAMES"
values = ['\sin','\text{sine}']

[[pool]]
name   = "COS_NAMES"
values = ['\cos','\text{cosine}']

[[pool]]
name   = "TAN_NAMES"
values = ['\tan','\text{tangent}']

[[pool]]
name   = "SEC_NAMES"
values = ['\sec','\text{secant}']

[[pool]]
name   = "CSC_NAMES"
values = ['\csc','\text{cosecant}']

[[pool]]
name   = "COT_NAMES"
values = ['\cot','\text{cotangent}']

[[pool]]
name   = "SINH_NAMES"
values = ['\sinh','\text{sh}']

[[pool]]
name   = "COSH_NAMES"
values = ['\cosh','\text{ch}']

[[pool]]
name   = "TANH_NAMES"
values = ['\tanh','\text{th}']

[[pool]]
name   = "ARCSIN_NAMES"
values = ['\arcsin','\sin^{-1}','\text{asin}','\text{Arcsin}']

[[pool]]
name   = "ARCCOS_NAMES"
values = ['\arccos','\cos^{-1}','\text{acos}','\text{Arccos}']

[[pool]]
name   = "ARCTAN_NAMES"
values = ['\arctan','\tan^{-1}','\text{atan}','\text{Arctan}']

[[pool]]
name   = "ARCCOT_NAMES"
values = ['\text{arccot}','\cot^{-1}','\text{acot}']

[[pool]]
name   = "ARCSEC_NAMES"
values = ['\text{arcsec}','\sec^{-1}','\text{asec}']

[[pool]]
name   = "ARCCSC_NAMES"
values = ['\text{arccsc}','\csc^{-1}','\text{acsc}']

[[pool]]
name   = "ARCTANH_NAMES"
values = ['\text{arctanh}','\tanh^{-1}','\text{atanh}']

[[pool]]
name   = "ARCSINH_NAMES"
values = ['\text{arcsinh}','\sinh^{-1}','\text{asinh}']

[[pool]]
name   = "ARCCOSH_NAMES"
values = ['\text{arccosh}','\cosh^{-1}','\text{acosh}']

# ── pythagorean_identity ──────────────────────────────────────────────────────

[[template]]
name  = "pythagorean_identity"
latex = ""

  [[template.variants]]
  name  = "pythagorean_identity_bare"
  latex = '{sn}^2 {x} + {cn}^2 {x} = 1'

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "pythagorean_identity_coeff"
  latex = '{sn}^2 {a} {x} + {cn}^2 {a} {x} = 1'

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.a]
  type = "S"
  pool = "TRIG_ARG_POOL"
  idx  = 0.35

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "pythagorean_identity_coeff_sq"
  latex = '{sn}^2 {a}^2{x} + {cn}^2 {a}^2{x} = 1'

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.a]
  type = "S"
  pool = "TRIG_ARG_POOL"
  idx  = 0.35

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

# ── double_angle_sin ──────────────────────────────────────────────────────────

[[template]]
name  = "double_angle_sin"
latex = '{sn}({coeff} {x}) = 2 {sn}\!\left(\frac{{{coeff} {x}}}{{2}}\right) {cn}\!\left(\frac{{{coeff} {x}}}{{2}}\right)'

[template.slots.sn]
type = "S"
pool = "SIN_NAMES"

[template.slots.cn]
type = "S"
pool = "COS_NAMES"

[template.slots.coeff]
type = "E"
gen  = "_sin_dbl_coeff_sub"
n    = 72

[template.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

# ── double_angle_cos ──────────────────────────────────────────────────────────

[[template]]
name  = "double_angle_cos"
latex = '{cn}({coeff} {x}) = {cn}^2\!\left(\frac{{{coeff} {x}}}{{2}}\right) - {sn}^2\!\left(\frac{{{coeff} {x}}}{{2}}\right)'

[template.slots.sn]
type = "S"
pool = "SIN_NAMES"

[template.slots.cn]
type = "S"
pool = "COS_NAMES"

[template.slots.coeff]
type = "E"
gen  = "_cos_dbl_coeff_sub"
n    = 70

[template.slots.x]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

# ── sin_addition ──────────────────────────────────────────────────────────────

[[template]]
name  = "sin_addition"
latex = '{sn}({a} \pm {b}) = {sn} {a} {cn} {b} \pm {cn} {a} {sn} {b}'

[template.slots.sn]
type = "S"
pool = "SIN_NAMES"

[template.slots.cn]
type = "S"
pool = "COS_NAMES"

[template.slots.a]
type = "S"
pool = "TRIG_ARG_POOL"
idx  = 0.35

[template.slots.b]
type         = "X"
pool         = "TRIG_ARG_POOL"
exclude_from = ["a"]
idx          = 0.35

# ── cos_addition ──────────────────────────────────────────────────────────────

[[template]]
name  = "cos_addition"
latex = '{cn}({a} + {b}) = {cn} {a} {cn} {b} - {sn} {a} {sn} {b}'

[template.slots.sn]
type = "S"
pool = "SIN_NAMES"

[template.slots.cn]
type = "S"
pool = "COS_NAMES"

[template.slots.a]
type = "S"
pool = "TRIG_ARG_POOL"
idx  = 0.35

[template.slots.b]
type         = "X"
pool         = "TRIG_ARG_POOL"
exclude_from = ["a"]
idx          = 0.35

