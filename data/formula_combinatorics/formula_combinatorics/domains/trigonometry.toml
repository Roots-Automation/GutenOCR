  [template.variants.slots.tn]
  type = "S"
  pool = "TAN_NAMES"

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "tan_ratio_coeff"
  latex = '{tn}\!\left({a} {x}\right) = \frac{{{sn}\!\left({a} {x}\right)}}{{{cn}\!\left({a} {x}\right)}}'

  [template.variants.slots.tn]
  type = "S"
  pool = "TAN_NAMES"

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.a]
  type = "S"
  pool = "TRIG_ARG_POOL"
  idx  = 0.35

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "cot_ratio_bare"
  latex = '{ctn}\!\left({x}\right) = \frac{{{cn}\!\left({x}\right)}}{{{sn}\!\left({x}\right)}}'

  [template.variants.slots.ctn]
  type = "S"
  pool = "COT_NAMES"

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "cot_ratio_coeff"
  latex = '{ctn}\!\left({a} {x}\right) = \frac{{{cn}\!\left({a} {x}\right)}}{{{sn}\!\left({a} {x}\right)}}'

  [template.variants.slots.ctn]
  type = "S"
  pool = "COT_NAMES"

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.a]
  type = "S"
  pool = "TRIG_ARG_POOL"
  idx  = 0.35

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35


# ── law_of_cosines ────────────────────────────────────────────────────────────

[[template]]
name  = "law_of_cosines"
latex = '{s0}^2 = {s1}^2 + {s2}^2 - 2{s1}{s2} \cos {A}'

[template.slots.s0]
type = "S"
pool = "SIDES_POOL"
idx  = 0.35

[template.slots.s1]
type         = "X"
pool         = "SIDES_POOL"
exclude_from = ["s0"]
idx          = 0.35

[template.slots.s2]
type         = "X"
pool         = "SIDES_POOL"
exclude_from = ["s0","s1"]
idx          = 0.35

[template.slots.A]
type = "S"
pool = "ANGLES_POOL"
idx  = 0.35

# ── law_of_sines ──────────────────────────────────────────────────────────────

[[template]]
name  = "law_of_sines"
latex = '\frac{{\sin {A0}}}{{{s0}}} = \frac{{\sin {A1}}}{{{s1}}} = \frac{{\sin {A2}}}{{{s2}}}'

[template.slots.s0]
type = "S"
pool = "SIDES_POOL"
idx  = 0.35

[template.slots.s1]
type         = "X"
pool         = "SIDES_POOL"
exclude_from = ["s0"]
idx          = 0.35

[template.slots.s2]
type         = "X"
pool         = "SIDES_POOL"
exclude_from = ["s0","s1"]
idx          = 0.35

[template.slots.A0]
type = "S"
pool = "ANGLES_POOL"
idx  = 0.35

[template.slots.A1]
type         = "X"
pool         = "ANGLES_POOL"
exclude_from = ["A0"]
idx          = 0.35

[template.slots.A2]
type         = "X"
pool         = "ANGLES_POOL"
exclude_from = ["A0","A1"]
idx          = 0.35


# ── arctan_ratio ──────────────────────────────────────────────────────────────

[[template]]
name  = "arctan_ratio"
latex = '{atn}\!\left(\frac{{{a}}}{{{b}}}\right)'

[template.slots.atn]
type = "S"
pool = "ARCTAN_NAMES"

[template.slots.a]
type = "S"
pool = "TRIG_ARG_POOL"
idx  = 0.35

[template.slots.b]
type         = "X"
pool         = "TRIG_ARG_POOL"
exclude_from = ["a"]
idx          = 0.35

# ── pythagorean_tan_cot ───────────────────────────────────────────────────────

[[template]]
name  = "pythagorean_tan_cot"
latex = ""

  [[template.variants]]
  name  = "pythagorean_tan"
  latex = '1 + {tn}^2({arg}) = {secn}^2({arg})'

  [template.variants.slots.tn]
  type = "S"
  pool = "TAN_NAMES"

  [template.variants.slots.secn]
  type = "S"
  pool = "SEC_NAMES"

  [template.variants.slots.arg]
  type = "E"
  gen  = "_trig_pyth_arg_sub"
  n    = 900

  [[template.variants]]
  name  = "pythagorean_cot"
  latex = '1 + {ctn}^2({arg}) = {cscn}^2({arg})'

  [template.variants.slots.ctn]
  type = "S"
  pool = "COT_NAMES"

  [template.variants.slots.cscn]
  type = "S"
  pool = "CSC_NAMES"

  [template.variants.slots.arg]
  type = "E"
  gen  = "_trig_pyth_arg_sub"
  n    = 900


# ── product_to_sum_sin_cos ────────────────────────────────────────────────────

[[template]]
name  = "product_to_sum_sin_cos"
latex = '{sn} {a} {cn} {b} = \tfrac{{1}}{{2}}\left[{sn}({a}+{b}) + {sn}({a}-{b})\right]'

[template.slots.sn]
type = "S"
pool = "SIN_NAMES"

[template.slots.cn]
type = "S"
pool = "COS_NAMES"

[template.slots.a]
type = "S"
pool = "TRIG_ARG_POOL"
idx  = 0.35

[template.slots.b]
type         = "X"
pool         = "TRIG_ARG_POOL"
exclude_from = ["a"]
idx          = 0.35

# ── half_angle_formulas ───────────────────────────────────────────────────────

[[template]]
name  = "half_angle_formulas"
latex = ""

  [[template.variants]]
  name  = "half_angle_bare"
  latex = '{sn}^2 \frac{{{x}}}{{2}} = \frac{{1 - {cn} {x}}}{{2}}, \quad {cn}^2 \frac{{{x}}}{{2}} = \frac{{1 + {cn} {x}}}{{2}}'

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "half_angle_coeff"
  latex = '{sn}^2 \frac{{{a} {x}}}{{2}} = \frac{{1 - {cn} {a} {x}}}{{2}}, \quad {cn}^2 \frac{{{a} {x}}}{{2}} = \frac{{1 + {cn} {a} {x}}}{{2}}'

  [template.variants.slots.sn]
  type = "S"
  pool = "SIN_NAMES"

  [template.variants.slots.cn]
  type = "S"
  pool = "COS_NAMES"

  [template.variants.slots.a]
  type = "S"
  pool = "TRIG_ARG_POOL"
  idx  = 0.35

  [template.variants.slots.x]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

# ── sum_to_product ────────────────────────────────────────────────────────────

[[template]]
name  = "sum_to_product"
latex = '{sn} {a} + {sn} {b} = 2 {sn}\!\left(\frac{{{a}+{b}}}{{2}}\right) {cn}\!\left(\frac{{{a}-{b}}}{{2}}\right)'

