# ── herons_formula ────────────────────────────────────────────────────────────

[[template]]
name  = "herons_formula"
latex = ""

  [[template.variants]]
  name  = "herons_standard"
  latex = '\text{{Area}} = \sqrt{{s(s - {s0})(s - {s1})(s - {s2})}}'

  [template.variants.slots.s0]
  type = "S"
  pool = "SIDES_POOL"
  idx  = 0.35

  [template.variants.slots.s1]
  type         = "X"
  pool         = "SIDES_POOL"
  exclude_from = ["s0"]
  idx          = 0.35

  [template.variants.slots.s2]
  type         = "X"
  pool         = "SIDES_POOL"
  exclude_from = ["s0","s1"]
  idx          = 0.35

  [[template.variants]]
  name  = "herons_s_def"
  latex = 's = \frac{{{s0} + {s1} + {s2}}}{{2}}'

  [template.variants.slots.s0]
  type = "S"
  pool = "SIDES_POOL"
  idx  = 0.35

  [template.variants.slots.s1]
  type         = "X"
  pool         = "SIDES_POOL"
  exclude_from = ["s0"]
  idx          = 0.35

  [template.variants.slots.s2]
  type         = "X"
  pool         = "SIDES_POOL"
  exclude_from = ["s0","s1"]
  idx          = 0.35

  [[template.variants]]
  name  = "herons_expanded"
  latex = '\text{{Area}} = \tfrac{{1}}{{4}}\sqrt{{({s0}+{s1}+{s2})(-{s0}+{s1}+{s2})({s0}-{s1}+{s2})({s0}+{s1}-{s2})}}'

  [template.variants.slots.s0]
  type = "S"
  pool = "SIDES_POOL"
  idx  = 0.35

  [template.variants.slots.s1]
  type         = "X"
  pool         = "SIDES_POOL"
  exclude_from = ["s0"]
  idx          = 0.35

  [template.variants.slots.s2]
  type         = "X"
  pool         = "SIDES_POOL"
  exclude_from = ["s0","s1"]
  idx          = 0.35

  [[template.variants]]
  name  = "herons_s_label"
  latex = 'S = \sqrt{{s(s - {s0})(s - {s1})(s - {s2})}}'

  [template.variants.slots.s0]
  type = "S"
  pool = "SIDES_POOL"
  idx  = 0.35

  [template.variants.slots.s1]
  type         = "X"
  pool         = "SIDES_POOL"
  exclude_from = ["s0"]
