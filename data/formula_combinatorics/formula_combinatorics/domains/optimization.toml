[meta]
domain = "optimization"

[[pool]]
name = "X_POOL"
values = ["x","w",'\theta','\mathbf{x}','\mathbf{w}']

[[pool]]
name = "F_POOL"
values = ["f","F",'\mathcal{F}','\varphi',"g","h"]

[[pool]]
name = "G_POOL"
values = ["g","h",'\psi','\phi',"c"]

[[pool]]
name = "ETA_POOL"
values = ['\eta','\alpha','\gamma','\tau','\rho']

[[pool]]
name = "LAM_POOL"
values = ['\lambda','\mu','\nu','\rho','\sigma']

[[pool]]
name = "BETA_POOL"
values = ['\beta','\beta_1','\beta_2','\rho','\beta_0','\beta_k']

[[pool]]
name = "MU_POOL"
values = ['\mu','\mu_k','\mu_0','\nu','\rho','\kappa']

[[pool]]
name = "H_POOL"
values = ["h",'\phi','\psi','\omega']

[[pool]]
name = "T_POOL"
values = ["T","K","N",'\tau',"T_0","N_0"]

[[pool]]
name = "EPS_POOL"
values = ['\varepsilon','\epsilon','\delta','\kappa','\eta_0','\nu']

[[pool]]
name = "IDX_POOL"
values = ["i","j","k","l","m","n","p","q","r","s","t"]

[[pool]]
name = "CALLIGRAPHIC"
values = ['\mathcal{A}','\mathcal{B}','\mathcal{C}','\mathcal{D}','\mathcal{E}','\mathcal{F}','\mathcal{G}','\mathcal{H}','\mathcal{K}','\mathcal{L}','\mathcal{M}','\mathcal{N}','\mathcal{O}','\mathcal{P}','\mathcal{S}','\mathcal{T}','\mathcal{U}','\mathcal{V}']

# --- Part A: Reparameterized originals (15) ---

[[template]]
name = "gradient_descent_step"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - {eta}\,\nabla {ff}({xx}_{{{kk}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "lagrangian_def"
latex = '\mathcal{{L}}({xx},\,{lam}) = {ff}({xx}) + {lam}^\top {gg}({xx})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[[template]]
name = "kkt_stationarity"
latex = '\nabla {ff}({xx}^*) = {lam}\,\nabla {gg}({xx}^*)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[[template]]
name = "convexity_definition"
latex = '{ff}({lam}\,{xx} + (1-{lam})\,y) \leq {lam}\,{ff}({xx}) + (1-{lam})\,{ff}(y)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[[template]]
name = "conjugate_function"
latex = '{ff}^*(y) = \sup_{{{xx}}} \bigl\langle y,\,{xx}\bigr\rangle - {ff}({xx})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "proximal_operator"
latex = '\operatorname{{prox}}_{{{ff}}}({xx}) = \arg\min_{{u}}\left\{{{ff}(u) + \tfrac{{1}}{{2{eta}}}\|u-{xx}\|^2\right\}}'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[[template]]
name = "newtons_method_step"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - \bigl[\nabla^2 {ff}({xx}_{{{kk}}})\bigr]^{{-1}}\,\nabla {ff}({xx}_{{{kk}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "constrained_minimization"
latex = '\min_{{{xx}}}\;{ff}({xx})\quad\text{{s.t.}}\quad {gg}_i({xx}) \leq 0'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[[template]]
name = "lipschitz_gradient"
latex = '\|\nabla {ff}({xx}) - \nabla {ff}(y)\| \leq L\,\|{xx}-y\|'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "first_order_convexity"
latex = '{ff}(y) \geq {ff}({xx}) + \nabla {ff}({xx})^\top(y-{xx})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "sublinear_convergence_rate"
latex = '\frac{{1}}{{{tt}}}\sum{lim_mod}_{{t=1}}^{{{tt}}} {ff}({xx}_t) - {ff}({xx}^*) \leq O\!\left(\frac{{1}}{{\sqrt{{{tt}}}}}\right)'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.tt]
type = "S"
pool = "T_POOL"

[[template]]
name = "linear_convergence"
latex = '\|{xx}_{{{kk}+1}} - {xx}^*\| \leq {lam}\,\|{xx}_{{{kk}}} - {xx}^*\|'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "strong_convexity"
latex = '{ff}(y) \geq {ff}({xx}) + \nabla {ff}({xx})^\top(y-{xx}) + \frac{{{lam}}}{{2}}\|y-{xx}\|^2'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[[template]]
name = "proximal_point_step"
latex = '{xx}^{{{kk}+1}} = \arg\min_{{{xx}}}\left\{{{ff}({xx}) + \frac{{{lam}}}{{2}}\|{xx}-{xx}^{{{kk}}}\|^2\right\}}'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "subgradient_step"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - {eta}_{{{kk}}}\,g_{{{kk}}},\quad g_{{{kk}}} \in \partial {ff}({xx}_{{{kk}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

# --- Gradient Methods (10) ---

[[template]]
name = "gradient_descent_convergence"
latex = '{ff}({xx}_k) - {ff}({xx}^*) \leq \frac{{L\,\|{xx}_0-{xx}^*\|^2}}{{2k}}'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "projected_gradient_step"
latex = '{xx}_{{{kk}+1}} = \Pi_C\!\left({xx}_{{{kk}}} - {eta}\,\nabla {ff}({xx}_{{{kk}}})\right)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "accelerated_gradient_y"
latex = 'y_{{{kk}}} = {xx}_{{{kk}}} + \frac{{{kk}-1}}{{{kk}+2}}\bigl({xx}_{{{kk}}}-{xx}_{{{kk}-1}}\bigr)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "accelerated_gradient_x"
latex = '{xx}_{{{kk}+1}} = y_{{{kk}}} - {eta}\,\nabla {ff}(y_{{{kk}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "momentum_step"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - {eta}\,\nabla {ff}({xx}_{{{kk}}}) + {bt}\,\bigl({xx}_{{{kk}}}-{xx}_{{{kk}-1}}\bigr)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.bt]
type = "S"
pool = "BETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "adam_m_update"
latex = 'm_{{{kk}+1}} = {bt}\,m_{{{kk}}} + (1-{bt})\,\nabla {ff}({xx}_{{{kk}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.bt]
type = "S"
pool = "BETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "adam_v_update"
latex = 'v_{{{kk}+1}} = {bt}\,v_{{{kk}}} + (1-{bt})\,\bigl(\nabla {ff}({xx}_{{{kk}}})\bigr)^2'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.bt]
type = "S"
pool = "BETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "adam_x_update"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - \frac{{\hat{{m}}_{{{kk}}}}}{{\sqrt{{\hat{{v}}_{{{kk}}}}}+{eps}}}'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.eps]
type = "S"
pool = "EPS_POOL"

[[template]]
name = "gradient_norm_convergence"
latex = '\min_{{{kk}\leq {tt}}}\|\nabla {ff}({xx}_{{{kk}}})\| \leq \frac{{C}}{{\sqrt{{{tt}}}}}'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.tt]
type = "S"
pool = "T_POOL"

[[template]]
name = "wolfe_condition_sufficient"
latex = '{ff}({xx}+{eta}\,d) \leq {ff}({xx}) + c_1\,{eta}\,\nabla {ff}({xx})^\top d'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

# --- Stochastic Methods (8) ---

[[template]]
name = "sgd_step"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - {eta}_{{{kk}}}\,\nabla {ff}_{{{ii}}}({xx}_{{{kk}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.ii]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk"]

[[template]]
name = "sgd_convergence_rate"
latex = '\mathbb{{E}}\bigl[{ff}({xx}_{{{kk}}})\bigr] - {ff}({xx}^*) \leq O\!\left(\frac{{1}}{{\sqrt{{{kk}}}}}\right)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "variance_reduction_update"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - {eta}\!\left(\nabla {ff}_{{{ii}}}({xx}_{{{kk}}}) - \nabla {ff}_{{{ii}}}(\tilde{{{xx}}}) + \nabla {ff}(\tilde{{{xx}}})\right)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.ii]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk"]

[[template]]
name = "minibatch_gradient"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - \frac{{{eta}}}{{|B|}}\sum{lim_mod}_{{i\in B}}\nabla {ff}_i({xx}_{{{kk}}})'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "online_regret_def"
latex = 'R_{{{tt}}} = \sum{lim_mod}_{{t=1}}^{{{tt}}} {ff}_t({xx}_t) - \min_{{{xx}}}\sum{lim_mod}_{{t=1}}^{{{tt}}} {ff}_t({xx})'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.tt]
type = "S"
pool = "T_POOL"

[[template]]
name = "regret_bound_ogd"
latex = 'R_{{{tt}}} \leq \frac{{\|{xx}_1-{xx}^*\|^2}}{{2{eta}}} + \frac{{{eta}}}{{2}}\sum{lim_mod}_{{t=1}}^{{{tt}}}\|\nabla {ff}_t({xx}_t)\|^2'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.tt]
type = "S"
pool = "T_POOL"

[[template]]
name = "sag_update"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - \frac{{{eta}}}{{n}}\sum{lim_mod}_{{i=1}}^{{n}}\nabla {ff}_i^{{{kk}}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "coordinate_descent_step"
latex = '{xx}_{{{ii}}}^{{{kk}+1}} = \arg\min_{{s}}\,{ff}(s\,e_{{{ii}}} + {xx}^{{{kk}}}_{{-{ii}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

# --- Convex Analysis (10) ---

[[template]]
name = "fenchel_inequality"
latex = '{ff}({xx}) + {ff}^*(y) \geq \langle {xx},\,y\rangle'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "fenchel_duality_theorem"
latex = '{ff}^{{**}}({xx}) = {ff}({xx})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "moreau_envelope"
latex = '{ff}^{{{mu}}}({xx}) = \min_y\left\{{{ff}(y) + \frac{{1}}{{2\,{mu}}}\|{xx}-y\|^2\right\}}'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.mu]
type = "S"
pool = "MU_POOL"

[[template]]
name = "subgradient_condition"
latex = 'g \in \partial {ff}({xx}) \iff {ff}(y) \geq {ff}({xx}) + \langle g,\,y-{xx}\rangle\;\forall y'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "subgradient_update_rule"
latex = '{xx}_{{{kk}+1}} = {xx}_{{{kk}}} - {eta}_{{{kk}}}\,g_{{{kk}}},\quad g_{{{kk}}} \in \partial {ff}({xx}_{{{kk}}})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name = "epigraph_def"
latex = '\mathrm{{epi}}({ff}) = \{{({xx},\,t) \in \mathbb{{R}}^{{n+1}} : {ff}({xx}) \leq t\}}'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "hessian_positive_def"
latex = '\nabla^2 {ff}({xx}) \succeq {lam}\,I'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[[template]]
name = "lipschitz_smooth_bound"
latex = '{ff}(y) \leq {ff}({xx}) + \nabla {ff}({xx})^\top(y-{xx}) + \frac{{L}}{{2}}\|y-{xx}\|^2'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[[template]]
name = "subdifferential_sum"
latex = '\partial({ff}+{gg})({xx}) \supseteq \partial {ff}({xx}) + \partial {gg}({xx})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[[template]]
name = "indicator_proximal"
latex = '\operatorname{{prox}}_{{{eta}\iota_C}}({xx}) = \Pi_C({xx})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

# --- KKT and Duality (8) ---

[[template]]
name = "kkt_primal_feasibility"
latex = '{gg}_i({xx}^*) \leq 0,\quad i=1,\ldots,m'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[[template]]
name = "kkt_dual_feasibility"
latex = '{lam}_i \geq 0,\quad i=1,\ldots,m'

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[[template]]
name = "kkt_complementary_slackness"
latex = '{lam}_i\,{gg}_i({xx}^*) = 0'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[[template]]
name = "lagrangian_dual_fn"
latex = 'd({lam}) = \inf_{{{xx}}}\,\mathcal{{L}}({xx},\,{lam})'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[[template]]
name = "weak_duality"
latex = 'd({lam}) \leq p^*\quad\forall\,{lam} \geq 0'

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[[template]]
name = "slater_condition"
latex = '\exists\,{xx}_0 : {gg}_i({xx}_0) < 0 \;\Rightarrow\; d^* = p^*'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[[template]]
name = "duality_gap"
latex = 'p^* - d^* \geq 0'

[[template]]
name = "penalty_augmented_lagrangian"
latex = '\mathcal{{L}}_\rho({xx},{lam}) = {ff}({xx}) + {lam}^\top {gg}({xx}) + \frac{{\rho}}{{2}}\|{gg}({xx})\|^2'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.lam]
type = "S"
pool = "LAM_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

# --- Proximal and ADMM (7) ---

[[template]]
name = "proximal_gradient_step"
latex = '{xx}_{{{kk}+1}} = \operatorname{{prox}}_{{{eta}\,{gg}}}\!\left({xx}_{{{kk}}} - {eta}\,\nabla {ff}({xx}_{{{kk}}})\right)'

[template.slots.xx]
type = "S"
pool = "X_POOL"

[template.slots.ff]
type = "S"
pool = "F_POOL"

[template.slots.gg]
type = "S"
pool = "G_POOL"

[template.slots.eta]
type = "S"
pool = "ETA_POOL"

