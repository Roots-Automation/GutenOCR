[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[[template]]
name = "schur_hom_space"
latex = '\operatorname{{Hom}}_{{{GG}}}({rr}_i, {rr}_j) \cong \begin{{cases}} \mathbb{{C}} & i = j \\ 0 & i \neq j \end{{cases}}'

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[[template]]
name = "induced_representation"
latex = '\operatorname{{Ind}}_{{{HH}}}^{{{GG}}} {rr} \cong \mathbb{{C}}[{GG}] \otimes_{{\mathbb{{C}}[{HH}]}} {rr}'

