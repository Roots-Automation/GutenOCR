[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "character_table_column_ortho"
latex = '\sum_i \chi_i({gg})\, \overline{{\chi_i({hh})}} = |C_{{{GG}}}({gg})| \cdot \delta_{{[{gg}][{hh}]}}'

