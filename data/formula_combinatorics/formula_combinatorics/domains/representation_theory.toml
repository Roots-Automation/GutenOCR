domain = "representation_theory"

# ---------------------------------------------------------------------------
# Pools
# ---------------------------------------------------------------------------

[[pool]]
name = "REP_POOL"
values = ['\rho','\pi','\sigma','\tau',"V","W","U",'\phi']

[[pool]]
name = "GROUP_POOL"
values = ["G","H","K","N","A","B",'\Gamma','\Delta']

[[pool]]
name = "ELEM_POOL"
values = ["g","h","a","b","x",'\sigma','\tau','\alpha','\beta','\gamma']

[[pool]]
name = "HOMO_POOL"
values = ['\phi','\psi','\theta',"f","T",'\Phi','\Psi','\chi']

[[pool]]
name = "MODULE_POOL"
values = ["M","N","V","W","U","L","S","P"]

[[pool]]
name = "WEIGHT_POOL"
values = ['\lambda','\mu','\nu','\alpha','\beta','\omega','\Lambda']

[[pool]]
name = "LIE_POOL"
values = ['\mathfrak{g}','\mathfrak{h}','\mathfrak{n}','\mathfrak{b}','\mathfrak{k}','\mathfrak{m}']

[[pool]]
name = "FIELD_POOL"
values = ["k",'\mathbb{F}',"K",'\mathbb{C}','\mathbb{R}']

[[pool]]
name = "IDX_POOL"
values = ["i","j","k","m","n"]

# ---------------------------------------------------------------------------
# Part A: Reparameterized originals (12)
# ---------------------------------------------------------------------------

[[template]]
name = "character_trace"
latex = '\chi_{{{rr}}}({gg}) = \operatorname{{tr}}\!\left({rr}({gg})\right)'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "character_dimension"
latex = '\chi_{{{rr}}}(e) = \dim {rr}'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[[template]]
name = "character_orthogonality"
latex = '\frac{{1}}{{|{GG}|}} \sum{lim_mod}_{{{gg} \in {GG}}} \chi_i({gg})\,\overline{{\chi_j({gg})}} = \delta_{{ij}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "character_centralizer"
latex = '\sum{lim_mod}_{{i}} |\chi_i({gg})|^2 = |C_{{{GG}}}({gg})|'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "irreducible_decomposition"
latex = '{rr} \cong \bigoplus_i {rr}_i^{{\oplus n_i}},\quad {rr}_i \text{{ irreducible}}'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[[template]]
name = "sum_of_squares"
latex = '\sum_i (\dim {rr}_i)^2 = |{GG}|'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[[template]]
name = "burnside_orbit"
latex = '|X/{GG}| = \frac{{1}}{{|{GG}|}} \sum{lim_mod}_{{{gg} \in {GG}}} |X^{{{gg}}}|'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "burnside_fixed_points"
latex = '|\text{{orbits}}| = \frac{{1}}{{|{GG}|}} \sum{lim_mod}_{{{gg} \in {GG}}} |\{{x : {gg} \cdot x = x\}}|'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "schur_linear_map"
latex = '{phi} : {rr} \to {rr} \text{{ {GG}-linear}} \implies {phi} = \lambda \operatorname{{Id}}'

[template.slots.phi]
type = "S"
