type = "S"
pool = ["", '\limits']

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

