pool = "GROUP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "character_sum_formula"
latex = '\sum{lim_mod}_{{{gg} \in {GG}}} \chi_{{{rr}}}({gg}) = \langle \chi_{{{rr}}}, \mathbf{{1}} \rangle \cdot |{GG}|'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.rr]
type = "S"
