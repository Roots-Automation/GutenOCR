[template.slots.rr]
type = "S"
pool = "REP_POOL"

[[template]]
name = "frobenius_reciprocity"
latex = '\langle \operatorname{{Ind}}_{{{HH}}}^{{{GG}}} {chi}, {psi} \rangle_{{{GG}}} = \langle {chi}, \operatorname{{Res}}_{{{HH}}}^{{{GG}}} {psi} \rangle_{{{HH}}}'

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.HH]
type = "X"
pool = "GROUP_POOL"
exclude_from = ["GG"]

[template.slots.chi]
type = "S"
pool = "HOMO_POOL"

[template.slots.psi]
type = "X"
pool = "HOMO_POOL"
exclude_from = ["chi"]

# ---------------------------------------------------------------------------
# Part B1: Character Theory (6)
# ---------------------------------------------------------------------------

[[template]]
