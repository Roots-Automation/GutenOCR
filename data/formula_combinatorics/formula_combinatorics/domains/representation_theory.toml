[[template]]
name = "character_fn_sum"
latex = '\frac{{1}}{{|{GG}|}} \sum{lim_mod}_{{{gg} \in {GG}}} {fn1}({gg}) \cdot \overline{{{fn2}({gg})}}'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.fn1]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.fn2]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "trace_fn_pair"
latex = '\operatorname{{tr}}\!\left({fn1}({gg}) \cdot {fn2}({hh})\right) = \sum_i {fn1}({gg})_{{ii}} \cdot {fn2}({hh})_{{ii}}'

[template.slots.fn1]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.fn2]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[template.slots.hh]
type = "X"
pool = "ELEM_POOL"
exclude_from = ["gg"]

[[template]]
name = "weight_fn_module"
latex = '{fn1}({hh}) \cdot {fn2}(v) = {ww}({hh}) \cdot {fn2}(v) \text{{ in weight space }} {VV}_{{{ww}}}'

[template.slots.fn1]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.fn2]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.ww]
type = "S"
pool = "WEIGHT_POOL"

[template.slots.VV]
type = "S"
pool = "MODULE_POOL"

[template.slots.hh]
type = "S"
pool = "ELEM_POOL"

[[template]]
name = "fn_triple_rep"
latex = '{fn1}({gg} \cdot {hh}) = {fn2}({gg}) \cdot {fn3}({hh})'

[template.slots.fn1]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.fn2]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.fn3]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[template.slots.hh]
type = "X"
pool = "ELEM_POOL"
exclude_from = ["gg"]

[[template]]
name = "rep_fn_equivariance"
latex = '{fn1}({gg} \cdot x) = {rr}({gg}) \cdot {fn1}(x) \quad \forall {gg} \in {GG}'

[template.slots.fn1]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

[[template]]
name = "matrix_coeff_fn"
latex = '{fn1}({gg})_{{ij}} = \langle {fn1}({gg})\, e_j,\, e_i \rangle'

[template.slots.fn1]
type = "E"
gen = "_fn_rich_nosub"
n = 5

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[template.slots.GG]
type = "S"
pool = "GROUP_POOL"

