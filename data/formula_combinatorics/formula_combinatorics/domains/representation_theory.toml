[[template]]
name = "rep_isomorphism_simeq"
latex = '{rr} \simeq {ss} \iff \exists\text{{ invertible intertwiner }} {phi}: {rr} \xrightarrow{{\sim}} {ss}'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.ss]
type = "X"
pool = "REP_POOL"
exclude_from = ["rr"]

[template.slots.phi]
type = "S"
pool = "HOMO_POOL"

[[template]]
name = "character_determines_rep"
latex = '\chi_{{{rr}}} = \chi_{{{ss}}} \implies {rr} \simeq {ss}'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.ss]
type = "X"
pool = "REP_POOL"
exclude_from = ["rr"]

[[template]]
name = "external_tensor_product"
latex = '({rr} \boxtimes {ss})({gg},\,{hh}) = {rr}({gg}) \otimes {ss}({hh})'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.ss]
type = "X"
pool = "REP_POOL"
exclude_from = ["rr"]

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[template.slots.hh]
type = "X"
pool = "ELEM_POOL"
exclude_from = ["gg"]

[[template]]
name = "boxtimes_character"
latex = '\chi_{{{rr} \boxtimes {ss}}}({gg},\,{hh}) = \chi_{{{rr}}}({gg})\,\chi_{{{ss}}}({hh})'

[template.slots.rr]
type = "S"
pool = "REP_POOL"

[template.slots.ss]
type = "X"
pool = "REP_POOL"
exclude_from = ["rr"]

[template.slots.gg]
type = "S"
pool = "ELEM_POOL"

[template.slots.hh]
type = "X"
pool = "ELEM_POOL"
exclude_from = ["gg"]
