[meta]
name        = "algebra"
version     = "1.0.0"
author      = "GutenOCR"
license     = "MIT"
description = "Algebra domain"

# ---------------------------------------------------------------------------
# Slot pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "VARS_POOL"
values = ['x', 'y', 'z', 't', 'u', 'v', 'r', 's']

[[pool]]
name   = "SCALARS_POOL"
values = ['a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q']

[[pool]]
name   = "VARS_SCALARS_POOL"
values = ['a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q', 'r', 's', 't', 'u', 'v', 'x', 'y', 'z']

[[pool]]
name   = "GEO_N_POOL"
values = ['n', 'm', 'N', 'M', 'K', 'k', 'p', 'r']

[[pool]]
name   = "LOG_BASES_POOL"
values = ['2', '10', 'e', 'a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q', '\alpha', '\beta', '\lambda', '\mu']

[[pool]]
name   = "COEFF_POOL"
values = ['a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q', '\alpha', '\beta', '\gamma', '\lambda', '\mu', '\rho', '\kappa', '\theta']

[[pool]]
name   = "GREEK_POOL"
values = ['\alpha', '\beta', '\gamma', '\delta', '\epsilon', '\zeta', '\eta', '\theta', '\kappa', '\lambda', '\mu', '\nu', '\xi', '\rho', '\sigma', '\tau', '\phi', '\chi', '\psi', '\omega', '\varepsilon', '\varphi', '\vartheta']

[[pool]]
name   = "EXP_POOL"
values = ['2', '3', '4', 'm', 'n', 'p', 'q']

[[pool]]
name   = "TEXT_NUMER_POOL"
values = ['\text{rise}', '\text{distance}', '\text{rate}', '\text{observed}', '\text{output}', '\text{signal}', '\text{profit}', '\text{numerator}', '''\text{change in } y''', '\text{work}', '\text{input}', '\text{cost}']

[[pool]]
name   = "TEXT_DENOM_POOL"
values = ['\text{run}', '\text{time}', '\text{rate}', '\text{expected}', '\text{input}', '\text{noise}', '\text{cost}', '\text{denominator}', '''\text{change in } x''', '\text{work}', '\text{output}', '\text{profit}']

[[pool]]
name   = "DEG_POLY_POOL"
values = ['p', 'q', 'f', 'g', 'h', 'r', 's', 'u', 'v', 'w', 'F', 'G', 'H', 'P', 'Q']

[[pool]]
name   = "DEG_N_POOL"
values = ['n', 'm', 'd', 'k', 'r', 'N', '2', '3', '4', 'j', 'l', 'M']

# ---------------------------------------------------------------------------
# Quadratic family
# ---------------------------------------------------------------------------

# Three notational forms of the quadratic formula (±, + only, − only)
[[template]]
name  = "quadratic_formula"
latex = ""

  [[template.variants]]
  name     = "quadratic_formula_pm"
  latex    = '{v0} = \frac{{-{q} \pm \sqrt{{{q}^2 - 4 {p} {r}}}}}{{2{p}}}'
  distinct = [["v0", "p", "q", "r"]]

  [template.variants.slots.v0]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "quadratic_formula_pos"
  latex    = '{v0} = \frac{{-{q} + \sqrt{{{q}^2 - 4 {p} {r}}}}}{{2{p}}}'
  distinct = [["v0", "p", "q", "r"]]

  [template.variants.slots.v0]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "quadratic_formula_neg"
  latex    = '{v0} = \frac{{-{q} - \sqrt{{{q}^2 - 4 {p} {r}}}}}{{2{p}}}'
  distinct = [["v0", "p", "q", "r"]]

  [template.variants.slots.v0]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

# Discriminant: definition and sign condition
[[template]]
name  = "discriminant"
latex = ""

  [[template.variants]]
  name     = "discriminant_def"
  latex    = '\Delta = {q}^2 - 4 {p} {r}'
  distinct = [["p", "q", "r"]]

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "discriminant_condition"
  latex    = '{q}^2 - 4 {p} {r} {rel} 0'
  distinct = [["p", "q", "r"]]

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.rel]
  type = "S"
  pool = ['>', '=', '<', '\geq', '\leq', '\neq']

# Three equivalent forms of a quadratic equation
[[template]]
name  = "quadratic_forms"
latex = ""

  [[template.variants]]
  name     = "quadratic_factored"
  latex    = '{p}\left({v0} - {q}\right)\left({v0} - {r}\right) = 0'
  distinct = [["v0", "p", "q", "r"]]

  [template.variants.slots.v0]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "quadratic_completed_square"
  latex    = '{p}\left({v0} + \frac{{{q}}}{{2{p}}}\right)^2 = \frac{{{q}^2 - 4 {p} {r}}}{{4{p}}}'
  distinct = [["v0", "p", "q", "r"]]

  [template.variants.slots.v0]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "quadratic_monic"
  latex    = '{v0}^2 + \frac{{{q}}}{{{p}}}{v0} + \frac{{{r}}}{{{p}}} = 0'
  distinct = [["v0", "p", "q", "r"]]

  [template.variants.slots.v0]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.p]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.q]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.r]
  type = "S"
  pool = "VARS_SCALARS_POOL"
  idx  = 0.35

