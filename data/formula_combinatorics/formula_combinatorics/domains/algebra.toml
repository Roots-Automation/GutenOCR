  [[template.variants]]
  name     = "abs_val_gt"
  latex    = '\left|{a} {v} + {b}\right| > {c}'
  distinct = [["a", "b", "c"]]

  [template.variants.slots.v]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [template.variants.slots.a]
  type = "S"
  pool = "SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.b]
  type = "S"
  pool = "SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.c]
  type = "S"
  pool = "SCALARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "abs_val_leq"
  latex    = '\left|{a} {v} + {b}\right| \leq {c}'
  distinct = [["a", "b", "c"]]

  [template.variants.slots.v]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [template.variants.slots.a]
  type = "S"
  pool = "SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.b]
  type = "S"
  pool = "SCALARS_POOL"
  idx  = 0.35

  [template.variants.slots.c]
  type = "S"
  pool = "SCALARS_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "abs_val_two_sided"
  latex = '{c1} \leq \left|{v} - {pt}\right| \leq {c2}'

  [template.variants.slots.v]
  type = "S"
  pool = "VARS_POOL"
