# ---------------------------------------------------------------------------
# Function composition and inverse identities
# ---------------------------------------------------------------------------

[[template]]
name  = "function_composition"
latex = ""

  [[template.variants]]
  name  = "composition_two"
  latex = '\left({f} \circ {g}\right)({v}) = {f}\!\left({g}({v})\right)'

  [template.variants.slots.v]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [template.variants.slots.f]
  type = "E"
  gen  = "_fn_rich_nosub"
  n    = 50

  [template.variants.slots.g]
  type = "E"
  gen  = "_fn_rich_nosub"
  n    = 50

  [[template.variants]]
  name  = "composition_three"
  latex = '\left({f} \circ {g} \circ {h}\right)({v}) = {f}\!\left({g}\!\left({h}({v})\right)\right)'

  [template.variants.slots.v]
  type = "S"
