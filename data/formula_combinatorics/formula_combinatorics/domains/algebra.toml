[meta]
name        = "algebra"
version     = "1.0.0"
author      = "GutenOCR"
license     = "MIT"
description = "Algebra domain"

# ---------------------------------------------------------------------------
# Slot pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "VARS_POOL"
values = ['x', 'y', 'z', 't', 'u', 'v', 'r', 's']

[[pool]]
name   = "SCALARS_POOL"
values = ['a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q']

[[pool]]
name   = "VARS_SCALARS_POOL"
values = ['a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q', 'r', 's', 't', 'u', 'v', 'x', 'y', 'z']

[[pool]]
name   = "GEO_N_POOL"
values = ['n', 'm', 'N', 'M', 'K', 'k', 'p', 'r']

[[pool]]
name   = "LOG_BASES_POOL"
values = ['2', '10', 'e', 'a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q', '\alpha', '\beta', '\lambda', '\mu']

[[pool]]
name   = "COEFF_POOL"
values = ['a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q', '\alpha', '\beta', '\gamma', '\lambda', '\mu', '\rho', '\kappa', '\theta']

[[pool]]
name   = "GREEK_POOL"
values = ['\alpha', '\beta', '\gamma', '\delta', '\epsilon', '\zeta', '\eta', '\theta', '\kappa', '\lambda', '\mu', '\nu', '\xi', '\rho', '\sigma', '\tau', '\phi', '\chi', '\psi', '\omega', '\varepsilon', '\varphi', '\vartheta']

[[pool]]
name   = "VEC_POOL"
values = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z']

[[pool]]
name   = "EXP_POOL"
values = ['2', '3', '4', 'm', 'n', 'p', 'q']

[[pool]]
name   = "MAT_POOL"
values = ['A', 'B', 'C', 'M', 'T', 'U']


[[pool]]
name   = "GENFRAC_LEFT_POOL"
values = ['', '\langle', '\lfloor', '\lceil', '\|', '(', '[', '\{']

[[pool]]
name   = "GENFRAC_RIGHT_POOL"
values = ['', '\rangle', '\rfloor', '\rceil', '\|', ')', ']', '\}']

[[pool]]
name   = "GENFRAC_THICK_POOL"
values = ['', '0pt', '0.4pt', '0.8pt']

[[pool]]
name   = "GENFRAC_STYLE_POOL"
values = ['', '0', '1', '2', '3']

[[pool]]
name   = "TEXT_NUMER_POOL"
values = ['\text{rise}', '\text{distance}', '\text{rate}', '\text{observed}', '\text{output}', '\text{signal}', '\text{profit}', '\text{numerator}', '''\text{change in } y''', '\text{work}', '\text{input}', '\text{cost}']

[[pool]]
name   = "TEXT_DENOM_POOL"
values = ['\text{run}', '\text{time}', '\text{rate}', '\text{expected}', '\text{input}', '\text{noise}', '\text{cost}', '\text{denominator}', '''\text{change in } x''', '\text{work}', '\text{output}', '\text{profit}']

[[pool]]
name   = "DEG_POLY_POOL"
values = ['p', 'q', 'f', 'g', 'h', 'r', 's']

[[pool]]
name   = "DEG_N_POOL"
values = ['n', 'm', 'd', 'k', 'r', 'N']

# ---------------------------------------------------------------------------
# Quadratic family
# ---------------------------------------------------------------------------

[[template]]
name     = "quadratic_formula_pm"
latex    = '{v0} = \frac{{-{q} \pm \sqrt{{{q}^2 - 4 {p} {r}}}}}{{2{p}}}'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[[template]]
name     = "quadratic_formula_pos"
latex    = '{v0} = \frac{{-{q} + \sqrt{{{q}^2 - 4 {p} {r}}}}}{{2{p}}}'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[[template]]
name     = "quadratic_formula_neg"
latex    = '{v0} = \frac{{-{q} - \sqrt{{{q}^2 - 4 {p} {r}}}}}{{2{p}}}'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[[template]]
name     = "discriminant_def"
latex    = '\Delta = {q}^2 - 4 {p} {r}'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[[template]]
name     = "discriminant_condition"
latex    = '{q}^2 - 4 {p} {r} {rel} 0'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.rel]
type = "S"
pool = ['>', '=', '<', '\geq', '\leq', '\neq']

[[template]]
name     = "quadratic_factored"
latex    = '{p}\left({v0} - {q}\right)\left({v0} - {r}\right) = 0'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[[template]]
name     = "quadratic_completed_square"
latex    = '{p}\left({v0} + \frac{{{q}}}{{2{p}}}\right)^2 = \frac{{{q}^2 - 4 {p} {r}}}{{4{p}}}'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[[template]]
name     = "quadratic_monic"
latex    = '{v0}^2 + \frac{{{q}}}{{{p}}}{v0} + \frac{{{r}}}{{{p}}} = 0'
distinct = [["v0", "p", "q", "r"]]

[template.slots.v0]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.p]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.q]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

[template.slots.r]
type = "S"
pool = "VARS_SCALARS_POOL"
idx  = 0.35

