[[template]]
name  = "rational_fraction"
latex = '\frac{{{num}}}{{{den}}}'

[template.slots.v]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.num]
type  = "P"
gen   = "_poly"
param = "v"
n     = 500

[template.slots.den]
type  = "P"
gen   = "_poly"
param = "v"
n     = 500

[[template]]
name  = "polynomial_nth_root"
latex = '\sqrt[{n}]{{{poly}}}'

[template.slots.v]
type = "S"
pool = "VARS_POOL"
idx  = 0.35

[template.slots.n]
type = "S"
pool = ["2", "3", "4", "5", "6", "n", "m", "k", "p"]

[template.slots.poly]
type  = "P"
gen   = "_poly"
param = "v"
n     = 5000

[[template]]
name  = "cubes_identity"
latex = ""

  [[template.variants]]
  name  = "sum_of_cubes"
  latex = '\left({u}\right)^3 + \left({w}\right)^3 = \left({u}+{w}\right)\left(\left({u}\right)^2 - {u} {w} + \left({w}\right)^2\right)'

  [template.variants.slots.u]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [template.variants.slots.w]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [[template.variants]]
  name  = "difference_of_cubes"
  latex = '\left({u}\right)^3 - \left({w}\right)^3 = \left({u}-{w}\right)\left(\left({u}\right)^2 + {u} {w} + \left({w}\right)^2\right)'

  [template.variants.slots.u]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [template.variants.slots.w]
  type = "E"
  gen  = "_expr"
  n    = 5000

[[template]]
name  = "perfect_square"
latex = ""

  [[template.variants]]
  name  = "perfect_square_plus"
  latex = '\left({u} + {w}\right)^2 = \left({u}\right)^2 + 2 {u} {w} + \left({w}\right)^2'

  [template.variants.slots.u]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [template.variants.slots.w]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [[template.variants]]
  name  = "perfect_square_minus"
  latex = '\left({u} - {w}\right)^2 = \left({u}\right)^2 - 2 {u} {w} + \left({w}\right)^2'

  [template.variants.slots.u]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [template.variants.slots.w]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [[template.variants]]
  name  = "difference_of_squares"
  latex = '\left({u} - {w}\right)\left({u} + {w}\right) = \left({u}\right)^2 - \left({w}\right)^2'

  [template.variants.slots.u]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [template.variants.slots.w]
  type = "E"
  gen  = "_expr"
  n    = 5000

