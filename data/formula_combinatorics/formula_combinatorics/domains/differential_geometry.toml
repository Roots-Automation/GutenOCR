[meta]
name        = "differential_geometry"
version     = "1.0.0"
author      = "GutenOCR"
license     = "MIT"
description = "Differential geometry — Riemannian metrics, curvature tensors, differential forms, Stokes theorem, geodesics, Lie theory, fiber bundles"

# ---------------------------------------------------------------------------
# Slot pools
# ---------------------------------------------------------------------------

[[pool]]
name   = "IDX_POOL"
values = ['i', 'j', 'k', 'l', 'm', 'n']

[[pool]]
name   = "VF_POOL"
values = ['X', 'Y', 'Z', 'V', 'W', 'U', 'T', 'S', '\xi', '\eta']

[[pool]]
name   = "FORM_POOL"
values = ['\omega', '\alpha', '\beta', '\eta', '\theta', '\phi', '\psi', '\chi', '\rho', '\sigma']

[[pool]]
name   = "MFLD_POOL"
values = ['M', 'N', '\Sigma', '\mathcal{M}', '\mathcal{N}', 'P', '\mathcal{P}', '\mathcal{S}', '\Gamma', '\Lambda']

[[pool]]
name   = "METRIC_POOL"
values = ['g', 'h', 'k', '\gamma', '\hat{g}', '\tilde{g}', '\bar{g}', '\mathring{g}']

[[pool]]
name   = "PARAM_POOL"
values = ['\tau', '\lambda', 's', 't', '\sigma', 'u', '\mu', '\rho']

[[pool]]
name   = "BUNDLE_POOL"
values = ['E', 'L', '\mathcal{E}', '\mathcal{L}', '\mathcal{F}', 'F', '\mathcal{G}', '\mathcal{H}', '\mathcal{V}', 'S']

[[pool]]
name   = "NVEC_POOL"
values = ['N', '\nu', '\mathbf{n}', '\hat{N}', '\hat{n}', '\mathbf{e}_n', 'n', '\bar{N}']

[[pool]]
name   = "KAPPA_POOL"
values = ['\kappa', '0', '1', '-1']

# ---------------------------------------------------------------------------
# A1: metric tensor
# ---------------------------------------------------------------------------

[[template]]
name  = "metric_einstein_sum"
latex = 'ds^2 = {met}_{{{ii}{jj}}} \, dx^{{{ii}}} dx^{{{jj}}}'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[[template]]
name  = "metric_inner_product"
latex = '\langle u, v \rangle_p = {met}_p(u, v)'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[[template]]
name  = "metric_positive_definite"
latex = '[{met}_{{{ii}{jj}}}] \text{{ is symmetric positive-definite}}'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

# ---------------------------------------------------------------------------
# A2: Christoffel symbols
# ---------------------------------------------------------------------------

[[template]]
name  = "christoffel_def"
latex = '\Gamma^{{{kk}}}_{{{ii}{jj}}} = \tfrac{{1}}{{2}} {met}^{{{kk}{ll}}} \!\left(\partial_{{{ii}}} {met}_{{{jj}{ll}}} + \partial_{{{jj}}} {met}_{{{ii}{ll}}} - \partial_{{{ll}}} {met}_{{{ii}{jj}}}\right)'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.ii]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk"]

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk", "ii"]

[template.slots.ll]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk", "ii", "jj"]

[[template]]
name  = "christoffel_symmetry"
latex = '\Gamma^{{{kk}}}_{{{ii}{jj}}} = \Gamma^{{{kk}}}_{{{jj}{ii}}}'

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.ii]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk"]

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk", "ii"]

# ---------------------------------------------------------------------------
# A3: geodesic equation
# ---------------------------------------------------------------------------

[[template]]
name  = "geodesic_affine"
latex = '\frac{{d^2 x^{{{kk}}}}}{{d{par}^2}} + \Gamma^{{{kk}}}_{{{ii}{jj}}} \frac{{dx^{{{ii}}}}}{{d{par}}} \frac{{dx^{{{jj}}}}}{{d{par}}} = 0'

[template.slots.par]
type = "S"
pool = "PARAM_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.ii]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk"]

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk", "ii"]

[[template]]
name  = "geodesic_abstract"
latex = '\nabla_{{\dot{{\gamma}}}} \dot{{\gamma}} = 0'

# ---------------------------------------------------------------------------
# A4: Riemann curvature
# ---------------------------------------------------------------------------

[[template]]
name  = "riemann_component"
latex = 'R^{{{ll}}}_{{{kk}{ii}{jj}}} = \partial_{{{ii}}} \Gamma^{{{ll}}}_{{{jj}{kk}}} - \partial_{{{jj}}} \Gamma^{{{ll}}}_{{{ii}{kk}}} + \Gamma^{{{ll}}}_{{{ii}{mm}}} \Gamma^{{{mm}}}_{{{jj}{kk}}} - \Gamma^{{{ll}}}_{{{jj}{mm}}} \Gamma^{{{mm}}}_{{{ii}{kk}}}'

[template.slots.ll]
type = "S"
pool = "IDX_POOL"

[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ll"]

[template.slots.ii]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ll", "kk"]

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ll", "kk", "ii"]

[template.slots.mm]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ll", "kk", "ii", "jj"]

[[template]]
name  = "riemann_operator"
latex = 'R({xx}, {yy}){zz} = \nabla_{{{xx}}} \nabla_{{{yy}}} {zz} - \nabla_{{{yy}}} \nabla_{{{xx}}} {zz} - \nabla_{{[{xx},{yy}]}} {zz}'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

[template.slots.zz]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx", "yy"]

[[template]]
name  = "riemann_antisymmetry"
latex = 'R_{{{ii}{jj}{kk}{ll}}} = -R_{{{jj}{ii}{kk}{ll}}} = -R_{{{ii}{jj}{ll}{kk}}}'

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj"]

[template.slots.ll]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj", "kk"]

# ---------------------------------------------------------------------------
# A5: torsion-free (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "torsion_free"
latex = ""

[[template.variants]]
name  = "torsion_zero"
latex = 'T({xx}, {yy}) = \nabla_{{{xx}}} {yy} - \nabla_{{{yy}}} {xx} - [{xx}, {yy}] = 0'

[template.variants.slots.xx]
type = "S"
pool = "VF_POOL"

[template.variants.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

[[template.variants]]
name  = "torsion_free_lc"
latex = '\nabla_{{{xx}}} {yy} - \nabla_{{{yy}}} {xx} = [{xx}, {yy}]'

[template.variants.slots.xx]
type = "S"
pool = "VF_POOL"

[template.variants.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

# ---------------------------------------------------------------------------
# A6: exterior derivative squared
# ---------------------------------------------------------------------------

[[template]]
name  = "d_squared_zero"
latex = 'd(d{om}) = 0'

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[[template]]
name  = "d_squared_operator"
latex = 'd^2 = 0'

# ---------------------------------------------------------------------------
# A7: Stokes theorem (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "stokes_theorem"
latex = ""

[[template.variants]]
name  = "stokes_general"
latex = '\int{lim_mod}_{{{mfld}}} d{om} = \int{lim_mod}_{{\partial {mfld}}} {om}'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.mfld]
type = "S"
pool = "MFLD_POOL"

[template.variants.slots.om]
type = "S"
pool = "FORM_POOL"

[[template.variants]]
name  = "stokes_oint"
latex = '\int{lim_mod}_{{{mfld}}} d{om} = \oint{lim_mod}_{{\partial {mfld}}} {om}'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.mfld]
type = "S"
pool = "MFLD_POOL"

[template.variants.slots.om]
type = "S"
pool = "FORM_POOL"

[[template.variants]]
name  = "stokes_no_boundary"
latex = '\partial {mfld} = \emptyset \implies \int{lim_mod}_{{{mfld}}} d{om} = 0'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.mfld]
type = "S"
pool = "MFLD_POOL"

[template.variants.slots.om]
type = "S"
pool = "FORM_POOL"

# ---------------------------------------------------------------------------
# A8: Cartan magic formula
# ---------------------------------------------------------------------------

[[template]]
name  = "cartan_lie_deriv"
latex = '\mathcal{{L}}_{{{xx}}} {om} = d(\iota_{{{xx}}} {om}) + \iota_{{{xx}}} d{om}'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[[template]]
name  = "cartan_commutator"
latex = '[\mathcal{{L}}_{{{xx}}}, d] = 0'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

# ---------------------------------------------------------------------------
# A9: Gaussian curvature
# ---------------------------------------------------------------------------

[[template]]
name  = "gaussian_component"
latex = 'K = \frac{{R_{{1212}}}}{{{{{met}}}_{{11}} {met}_{{22}} - {met}_{{12}}^2}}'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[[template]]
name  = "gaussian_principal"
latex = 'K = \kappa_1 \kappa_2'

[[template]]
name  = "gaussian_ricci_surface"
latex = 'K = \tfrac{{1}}{{2}} R'

# ---------------------------------------------------------------------------
# A10: Ricci tensor
# ---------------------------------------------------------------------------

[[template]]
name  = "ricci_contraction"
latex = 'R_{{{ii}{jj}}} = R^{{{kk}}}_{{{ii}{kk}{jj}}}'

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj"]

[[template]]
name  = "ricci_symmetric"
latex = 'R_{{{ii}{jj}}} = R_{{{jj}{ii}}}'

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[[template]]
name  = "ricci_abstract"
latex = '\operatorname{{Ric}}({xx}, {yy}) = \operatorname{{tr}}\!\bigl(Z \mapsto R(Z, {xx})\,{yy}\bigr)'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

# ---------------------------------------------------------------------------
# A11: Einstein field equations
# ---------------------------------------------------------------------------

[[template]]
name  = "einstein_index"
latex = 'G_{{{ii}{jj}}} = R_{{{ii}{jj}}} - \tfrac{{1}}{{2}} {met}_{{{ii}{jj}}} R = \frac{{8\pi G}}{{c^4}} T_{{{ii}{jj}}}'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[[template]]
name  = "einstein_tensor_form"
latex = '\mathbf{{G}} = \mathbf{{R}} - \tfrac{{1}}{{2}} R\,\mathbf{{g}} = \frac{{8\pi G}}{{c^4}} \mathbf{{T}}'

[[template]]
name  = "einstein_trace_reversed"
latex = 'R_{{{ii}{jj}}} = \frac{{8\pi G}}{{c^4}}\!\left(T_{{{ii}{jj}}} - \tfrac{{1}}{{2}} {met}_{{{ii}{jj}}} T\right)'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

# ---------------------------------------------------------------------------
# A12: covariant derivative of tensor
# ---------------------------------------------------------------------------

[[template]]
name  = "cov_deriv_contravariant"
latex = '\nabla_{{{kk}}} T^{{{ii}{jj}}} = \partial_{{{kk}}} T^{{{ii}{jj}}} + \Gamma^{{{ii}}}_{{{kk}{ll}}} T^{{{ll}{jj}}} + \Gamma^{{{jj}}}_{{{kk}{ll}}} T^{{{ii}{ll}}}'

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj"]

[template.slots.ll]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj", "kk"]

[[template]]
name  = "cov_deriv_covariant"
latex = '\nabla_{{{kk}}} T_{{{ii}{jj}}} = \partial_{{{kk}}} T_{{{ii}{jj}}} - \Gamma^{{{ll}}}_{{{kk}{ii}}} T_{{{ll}{jj}}} - \Gamma^{{{ll}}}_{{{kk}{jj}}} T_{{{ii}{ll}}}'

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj"]

[template.slots.ll]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj", "kk"]

[[template]]
name  = "cov_deriv_vector"
latex = '\nabla_{{{kk}}} V^{{{ii}}} = \partial_{{{kk}}} V^{{{ii}}} + \Gamma^{{{ii}}}_{{{kk}{jj}}} V^{{{jj}}}'

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii", "jj"]

# ---------------------------------------------------------------------------
# A13: Lie bracket
# ---------------------------------------------------------------------------

[[template]]
name  = "lie_bracket_component"
latex = '[{xx}, {yy}]^{{{ii}}} = {xx}^{{{jj}}} \partial_{{{jj}}} {yy}^{{{ii}}} - {yy}^{{{jj}}} \partial_{{{jj}}} {xx}^{{{ii}}}'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[[template]]
name  = "lie_bracket_functional"
latex = '[{xx}, {yy}] f = {xx}({yy} f) - {yy}({xx} f)'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

# ---------------------------------------------------------------------------
# A14: Gauss-Bonnet (variant group)
# ---------------------------------------------------------------------------

[[template]]
name  = "gauss_bonnet"
latex = ""

[[template.variants]]
name  = "gauss_bonnet_boundary"
latex = '\int{lim_mod}_{{{mfld}}} K \, dA + \int{lim_mod}_{{\partial {mfld}}} \kappa_g \, ds = 2\pi \chi({mfld})'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.mfld]
type = "S"
pool = "MFLD_POOL"

[[template.variants]]
name  = "gauss_bonnet_closed"
latex = '\int{lim_mod}_{{{mfld}}} K \, dA = 2\pi \chi({mfld})'

[template.variants.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.variants.slots.mfld]
type = "S"
pool = "MFLD_POOL"

# ---------------------------------------------------------------------------
# B1: differential forms algebra
# ---------------------------------------------------------------------------

[[template]]
name  = "wedge_anticommutativity"
latex = '{om} \wedge {al} = (-1)^{{pq}} {al} \wedge {om}'

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[template.slots.al]
type = "X"
pool = "FORM_POOL"
exclude_from = ["om"]

[[template]]
name  = "wedge_associativity"
latex = '({om} \wedge {al}) \wedge {bt} = {om} \wedge ({al} \wedge {bt})'

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[template.slots.al]
type = "X"
pool = "FORM_POOL"
exclude_from = ["om"]

[template.slots.bt]
type = "X"
pool = "FORM_POOL"
exclude_from = ["om", "al"]

[[template]]
name  = "wedge_distributivity"
latex = '({om} + {al}) \wedge {bt} = {om} \wedge {bt} + {al} \wedge {bt}'

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[template.slots.al]
type = "X"
pool = "FORM_POOL"
exclude_from = ["om"]

[template.slots.bt]
type = "X"
pool = "FORM_POOL"
exclude_from = ["om", "al"]

[[template]]
name  = "exterior_derivative_product"
latex = 'd({om} \wedge {al}) = d{om} \wedge {al} + (-1)^k {om} \wedge d{al}'

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[template.slots.al]
type = "X"
pool = "FORM_POOL"
exclude_from = ["om"]

# ---------------------------------------------------------------------------
# B2: pullback / pushforward
# ---------------------------------------------------------------------------

[[template]]
name  = "pullback_product"
latex = '{fn1}^*({om} \wedge {al}) = {fn1}^* {om} \wedge {fn1}^* {al}'

[template.slots.fn1]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[template.slots.al]
type = "X"
pool = "FORM_POOL"
exclude_from = ["om"]

[[template]]
name  = "pullback_form"
latex = '({fn1}^* {om})_p(v) = {om}_{{{fn1}(p)}}(d{fn1}_p \cdot v)'

[template.slots.fn1]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.om]
type = "S"
pool = "FORM_POOL"

[[template]]
name  = "pushforward_vector"
latex = '({fn1}_* {xx})_q = d{fn1}_p \cdot {xx}_p'

[template.slots.fn1]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[template.slots.xx]
type = "S"
pool = "VF_POOL"

# ---------------------------------------------------------------------------
# B3: covariant derivative identities
# ---------------------------------------------------------------------------

[[template]]
name  = "cov_deriv_product_rule"
latex = '\nabla_{{{xx}}} ({fn1} {yy}) = ({xx}\,{fn1})\,{yy} + {fn1}\,\nabla_{{{xx}}} {yy}'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

[template.slots.fn1]
type = "E"
gen  = "_fn_rich_nosub"
n    = 5

[[template]]
name  = "metric_compatibility"
latex = '\nabla_{{{zz}}} \langle {xx}, {yy} \rangle = \langle \nabla_{{{zz}}} {xx}, {yy} \rangle + \langle {xx}, \nabla_{{{zz}}} {yy} \rangle'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

[template.slots.zz]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx", "yy"]

[[template]]
name  = "curvature_operator_defn"
latex = 'R({xx}, {yy}){zz} = \nabla_{{{xx}}} \nabla_{{{yy}}} {zz} - \nabla_{{{yy}}} \nabla_{{{xx}}} {zz} - \nabla_{{[{xx},{yy}]}} {zz}'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

[template.slots.zz]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx", "yy"]

# ---------------------------------------------------------------------------
# B4: parallel transport
# ---------------------------------------------------------------------------

[[template]]
name  = "parallel_abstract"
latex = '\frac{{D{vv}}}{{d{par}}} = 0'

[template.slots.vv]
type = "S"
pool = "VF_POOL"

[template.slots.par]
type = "S"
pool = "PARAM_POOL"

[[template]]
name  = "parallel_component"
latex = '\frac{{dV^{{{kk}}}}}{{d{par}}} + \Gamma^{{{kk}}}_{{{ii}{jj}}} \frac{{dx^{{{ii}}}}}{{d{par}}} V^{{{jj}}} = 0'

[template.slots.par]
type = "S"
pool = "PARAM_POOL"

[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[template.slots.ii]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk"]

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["kk", "ii"]

# ---------------------------------------------------------------------------
# B5: sectional curvature
# ---------------------------------------------------------------------------

[[template]]
name  = "sectional_ratio"
latex = 'K(\sigma) = \frac{{R({xx}, {yy}, {yy}, {xx})}}{{|{xx}|^2 |{yy}|^2 - \langle {xx},{yy} \rangle^2}}'

[template.slots.xx]
type = "S"
pool = "VF_POOL"

[template.slots.yy]
type = "X"
pool = "VF_POOL"
exclude_from = ["xx"]

[[template]]
name  = "sectional_constant"
latex = 'K \equiv {kap}'

[template.slots.kap]
type = "S"
pool = "KAPPA_POOL"

[[template]]
name  = "sectional_model_spaces"
latex = 'K_{{S^n}} = +1, \quad K_{{\mathbb{{R}}^n}} = 0, \quad K_{{\mathbb{{H}}^n}} = -1'

# ---------------------------------------------------------------------------
# B6: Ricci scalar
# ---------------------------------------------------------------------------

[[template]]
name  = "ricci_scalar_trace"
latex = 'R = {met}^{{{ii}{jj}}} R_{{{ii}{jj}}}'

[template.slots.met]
type = "S"
pool = "METRIC_POOL"

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

[[template]]
name  = "ricci_scalar_sectional"
latex = 'R = \sum{lim_mod}_{{{ii} < {jj}}} 2\, K(e_{{{ii}}}, e_{{{jj}}})'

[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']

[template.slots.ii]
type = "S"
pool = "IDX_POOL"

[template.slots.jj]
type = "X"
pool = "IDX_POOL"
exclude_from = ["ii"]

# ---------------------------------------------------------------------------
# B7: Hodge star
# ---------------------------------------------------------------------------

[[template]]
name  = "hodge_pairing"
latex = '{om} \wedge \star {al} = \langle {om}, {al} \rangle \, \operatorname{{vol}}'

[template.slots.om]
