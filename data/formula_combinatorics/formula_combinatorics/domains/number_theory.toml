[[template]]
name  = "quadratic_residue_def"
latex = '{aa} \text{{ is a QR mod }} {pp} \iff \exists {xx} \in \mathbb{{Z}},\; {xx}^2 \equiv {aa} \pmod{{{pp}}}'
