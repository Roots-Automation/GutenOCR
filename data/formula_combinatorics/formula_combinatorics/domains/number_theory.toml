  [template.variants.slots.u]
  type = "E"
  gen  = "_expr"
  n    = 5000

  [template.variants.slots.w]
  type = "E"
  gen  = "_expr"
  n    = 5000

# ---------------------------------------------------------------------------
# Sophie Germain identity
# ---------------------------------------------------------------------------

[[template]]
name  = "sophie_germain"
latex = ""

  [[template.variants]]
  name     = "sophie_germain_standard"
  latex    = '{a}^4 + 4{b}^4 = \left({a}^2 + 2{b}^2 + 2{a} {b}\right)\left({a}^2 + 2{b}^2 - 2{a} {b}\right)'
  distinct = [["a", "b"]]

  [template.variants.slots.a]
  type = "S"
  pool = "INT_POOL"
  idx  = 0.35

  [template.variants.slots.b]
  type = "S"
  pool = "INT_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "sophie_germain_sum_of_squares"
  latex    = '{a}^4 + 4{b}^4 = \left(({a}+{b})^2 + {b}^2\right)\left(({a}-{b})^2 + {b}^2\right)'
  distinct = [["a", "b"]]

  [template.variants.slots.a]
  type = "S"
  pool = "INT_POOL"
  idx  = 0.35

  [template.variants.slots.b]
  type = "S"
  pool = "INT_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "sophie_germain_lhs_only"
  latex    = '{a}^4 + 4{b}^4'
  distinct = [["a", "b"]]

  [template.variants.slots.a]
  type = "S"
  pool = "INT_POOL"
  idx  = 0.35

  [template.variants.slots.b]
  type = "S"
  pool = "INT_POOL"
  idx  = 0.35

# ---------------------------------------------------------------------------
# Mean inequalities (power mean, harmonic mean)
# ---------------------------------------------------------------------------

[[template]]
name  = "mean_inequalities"
latex = ""

  [[template.variants]]
  name     = "am_gm_power_mean"
  latex    = '\frac{{{u}^{{1/{v}}} + {w}^{{1/{v}}}}}{{2}} \geq \left(\frac{{{u} + {w}}}{{2}}\right)^{{1/{v}}}'
  distinct = [["u", "w"]]

  [template.variants.slots.v]
  type = "S"
  pool = "VARS_POOL"
  idx  = 0.35

  [template.variants.slots.u]
  type = "S"
  pool = "COEFF_POOL"
  idx  = 0.35

  [template.variants.slots.w]
  type = "S"
  pool = "COEFF_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "hm_gm_two"
  latex    = '\frac{{2{u}\,{w}}}{{{u}+{w}}} \leq \sqrt{{{u}\,{w}}}'
  distinct = [["u", "w"]]

  [template.variants.slots.u]
  type = "S"
  pool = "COEFF_POOL"
  idx  = 0.35

  [template.variants.slots.w]
  type = "S"
  pool = "COEFF_POOL"
  idx  = 0.35

  [[template.variants]]
  name     = "hm_gm_am_chain"
  latex    = '\frac{{2{u}\,{w}}}{{{u}+{w}}} \leq \sqrt{{{u}\,{w}}} \leq \frac{{{u}+{w}}}{{2}}'
  distinct = [["u", "w"]]

  [template.variants.slots.u]
  type = "S"
  pool = "COEFF_POOL"
  idx  = 0.35

  [template.variants.slots.w]
  type = "S"
  pool = "COEFF_POOL"
  idx  = 0.35

  [[template.variants]]
  name  = "hm_def"
  latex = 'H_{{{n}}} = \frac{{{n}}}{{\frac{{1}}{{{a}_1}} + \frac{{1}}{{{a}_2}} + \cdots + \frac{{1}}{{{a}_{{{n}}}}}}}'

  [template.variants.slots.a]
  type = "S"
  pool = "COEFF_POOL"

  [template.variants.slots.n]
  type = "S"
  pool = "IDX_POOL"

  [[template.variants]]
  name  = "am_gm_hm_inequality"
  latex = '\frac{{{n}}}{{\sum{lim_mod}_{{k=1}}^{{{n}}} \frac{{1}}{{{a}_k}}}} \leq \left(\prod{lim_mod}_{{k=1}}^{{{n}}} {a}_k\right)^{{1/{n}}} \leq \frac{{1}}{{{n}}} \sum{lim_mod}_{{k=1}}^{{{n}}} {a}_k'

  [template.variants.slots.lim_mod]
  type = "S"
  pool = ["", '\limits']

  [template.variants.slots.a]
  type = "S"
  pool = "COEFF_POOL"

  [template.variants.slots.n]
  type = "S"
  pool = "IDX_POOL"

# ---------------------------------------------------------------------------
# Vieta's formulas — cubic (from algebra)
# ---------------------------------------------------------------------------

[[template]]
name  = "vieta_cubic"
latex = '{vv}_1 + {vv}_2 + {vv}_3 = -\frac{{{b}}}{{{a}}}, \quad {vv}_1 {vv}_2 + {vv}_1 {vv}_3 + {vv}_2 {vv}_3 = \frac{{{c_coef}}}{{{a}}}, \quad {vv}_1 {vv}_2 {vv}_3 = -\frac{{{d_coef}}}{{{a}}}'

[template.slots.vv]
type = "S"
pool = "VARS_POOL"

[template.slots.a]
type = "S"
pool = "COEFF_POOL"
idx  = 0.35

[template.slots.b]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["a"]

[template.slots.c_coef]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["a", "b"]

[template.slots.d_coef]
type = "X"
pool = "COEFF_POOL"
exclude_from = ["a", "b", "c_coef"]

# ---------------------------------------------------------------------------
# AM-GM inequality — general n-variable form (from algebra)
# ---------------------------------------------------------------------------

[[template]]
name  = "am_gm_nvar"
latex = '\frac{{{a}_1 + {a}_2 + \cdots + {a}_{{{n}}}}}{{{n}}} \geq \sqrt[{{{n}}}]{{{a}_1 \cdot {a}_2 \cdots {a}_{{{n}}}}}'

[template.slots.a]
type = "S"
pool = "COEFF_POOL"

[template.slots.n]
type = "S"
pool = "IDX_POOL"
