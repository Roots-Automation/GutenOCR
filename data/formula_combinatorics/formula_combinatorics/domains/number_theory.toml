# Number theory domain — TOML pack (WU7 migration)

[[pool]]
name   = "IDX_POOL"
values = ["n", "m", "k", "j", "r", "l", "s", "t", "i", "p", "N", "M"]

[[pool]]
name   = "INT_POOL"
values = ["a", "b", "c", "d", "u", "v", "x", "y"]

[[pool]]
name   = "PRIME_POOL"
values = ["p", "q", "r", "s", "l", "t", 'p_1', 'p_2', 'q_1', 'q_2', '\ell', "u"]

[[pool]]
name   = "PRIME_BASE_POOL"
values = ["p", "q", "r", "s", "l", "t", '\ell', "u"]

[[pool]]
name   = "MOD_POOL"
values = ["m", "n", "p", "q", "N", "M", "k", "r", "P", "Q"]

[[pool]]
name   = "FUNC_POOL"
values = ["f", "g", "h", '\phi', '\psi', '\chi', '\varphi', '\xi', '\eta', '\zeta']

[[pool]]
name   = "ALPHA_POOL"
values = ['\alpha', '\beta', '\gamma', '\delta', '\theta', '\lambda', '\mu', '\nu']

[[pool]]
name   = "RING_POOL"
values = ['\mathbb{Z}', '\mathbb{Z}[i]', '\mathbb{Z}[\omega]', '\mathcal{O}_K', '\mathcal{O}_F']

[[pool]]
name   = "FIELD_POOL"
values = ['\mathbb{Q}', '\mathbb{F}_p', '\mathbb{F}_q', '\mathbb{Q}(\sqrt{d})', '\mathbb{Q}(\zeta_n)']

[[pool]]
name   = "COEFF_POOL"
values = ['a', 'b', 'c', 'd', 'k', 'm', 'n', 'p', 'q', '\alpha', '\beta', '\gamma', '\lambda', '\mu']

[[pool]]
name   = "VARS_POOL"
values = ['x', 'y', 'z', 't', 'u', 'v', 'r', 's']

# ---------------------------------------------------------------------------
# Part A: 20 templates
# ---------------------------------------------------------------------------

[[template]]
name  = "binomial_coefficient"
latex = '\binom{{{nn}}}{{{kk}}}'
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

[[template]]
name  = "binomial_coefficient_def"
latex = '\binom{{{nn}}}{{{kk}}} = \frac{{{nn}!}}{{{kk}!\,({nn}-{kk})!}}'
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

[[template]]
name  = "modular_congruence"
latex = '{aa} \equiv {bb} \pmod{{{mm}}}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.bb]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa"]
[template.slots.mm]
type = "S"
pool = "MOD_POOL"

[[template]]
name  = "gcd_lcm_identity"
latex = '\gcd({aa}, {bb}) \cdot \operatorname{{lcm}}({aa}, {bb}) = {aa} \cdot {bb}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.bb]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa"]

[[template]]
name  = "sum_first_n"
latex = '\sum{lim_mod}_{{{kk}=1}}^{{{nn}}} {kk} = \frac{{{nn}({nn}+1)}}{{2}}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

[[template]]
name  = "sum_of_squares"
latex = '\sum{lim_mod}_{{{kk}=1}}^{{{nn}}} {kk}^2 = \frac{{{nn}({nn}+1)(2{nn}+1)}}{{6}}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

[[template]]
name  = "fibonacci_recurrence"
latex = 'F_{{{nn}+2}} = F_{{{nn}+1}} + F_{{{nn}}},\quad F_0 = 0,\; F_1 = 1'
[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name  = "euler_totient"
latex = '\phi({nn}) = {nn} \prod{lim_mod}_{{{pp} \mid {nn}}} \left(1 - \frac{{1}}{{{pp}}}\right)'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.pp]
type = "S"
pool = "PRIME_POOL"

[[template]]
name  = "fermat_little_theorem"
latex = '{aa}^{{{pp}-1}} \equiv 1 \pmod{{{pp}}}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.pp]
type = "S"
pool = "PRIME_POOL"

[[template]]
name  = "catalan_numbers"
latex = 'C_{{{nn}}} = \frac{{1}}{{{nn}+1}} \binom{{2{nn}}}{{{nn}}}'
[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name  = "geometric_series"
latex = '\sum{lim_mod}_{{{kk}=0}}^{{{nn}}} {aa}^{{{kk}}} = \frac{{1 - {aa}^{{{nn}+1}}}}{{1 - {aa}}}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]
[template.slots.aa]
type = "S"
pool = "INT_POOL"

[[template]]
name  = "factorial_product"
latex = '{nn}! = \prod{lim_mod}_{{{kk}=1}}^{{{nn}}} {kk}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

[[template]]
name  = "leibniz_pi"
latex = '\sum{lim_mod}_{{{kk}=0}}^{{\infty}} \frac{{(-1)^{{{kk}}}}}{{2{kk}+1}} = \frac{{\pi}}{{4}}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.kk]
type = "S"
pool = "IDX_POOL"

[[template]]
name  = "wilson_theorem"
latex = '({pp}-1)! \equiv -1 \pmod{{{pp}}}'
[template.slots.pp]
type = "S"
pool = "PRIME_POOL"

[[template]]
name  = "sum_of_divisors"
latex = '\sigma_{{{kk}}}({nn}) = \sum{lim_mod}_{{d \mid {nn}}} d^{{{kk}}}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

[[template]]
name  = "number_of_divisors"
latex = '\tau({nn}) = \sum{lim_mod}_{{d \mid {nn}}} 1 = \prod{lim_mod}_{{{pp}^k \| {nn}}} (k+1)'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.pp]
type = "S"
pool = "PRIME_POOL"

[[template]]
name  = "prime_number_theorem"
latex = '\pi({xx}) \sim \frac{{{xx}}}{{\ln {xx}}}'
[template.slots.xx]
type = "S"
pool = "INT_POOL"

[[template]]
name  = "mobius_inversion"
latex = '{ff}({nn}) = \sum{lim_mod}_{{d \mid {nn}}} {gg}(d) \implies {gg}({nn}) = \sum{lim_mod}_{{d \mid {nn}}} \mu(d)\,{ff}({nn}/d)'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.ff]
type = "S"
pool = "FUNC_POOL"
[template.slots.gg]
type = "X"
pool = "FUNC_POOL"
exclude_from = ["ff"]
[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name  = "riemann_zeta_euler_product"
latex = '\zeta({ss}) = \sum{lim_mod}_{{{nn}=1}}^{{\infty}} \frac{{1}}{{{nn}^{{{ss}}}}} = \prod{lim_mod}_{{{pp} \text{{ prime}}}} \frac{{1}}{{1-{pp}^{{-{ss}}}}}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.ss]
type = "S"
pool = "ALPHA_POOL"
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.pp]
type = "S"
pool = "PRIME_POOL"

[[template]]
name  = "sum_of_cubes"
latex = '\sum{lim_mod}_{{{kk}=1}}^{{{nn}}} {kk}^3 = \left(\frac{{{nn}({nn}+1)}}{{2}}\right)^2'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]

# ---------------------------------------------------------------------------
# Part B1: Divisibility and GCD (8 templates)
# ---------------------------------------------------------------------------

[[template]]
name  = "divisibility_def"
latex = '{aa} \mid {bb} \iff \exists {cc} \in \mathbb{{Z}},\; {bb} = {cc} \cdot {aa}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.bb]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa"]
[template.slots.cc]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa", "bb"]

[[template]]
name  = "bezout_identity"
latex = '\gcd({aa},{bb}) = {xx}\,{aa} + {yy}\,{bb}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.bb]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa"]
[template.slots.xx]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa", "bb"]
[template.slots.yy]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa", "bb", "xx"]

[[template]]
name  = "euclidean_step"
latex = '{aa} = {qq}\,{bb} + {rr},\quad 0 \leq {rr} < {bb}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.bb]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa"]
[template.slots.qq]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa", "bb"]
[template.slots.rr]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa", "bb", "qq"]

[[template]]
name  = "lcm_via_gcd"
latex = '\operatorname{{lcm}}({aa},{bb}) = \frac{{{aa} \cdot {bb}}}{{\gcd({aa},{bb})}}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.bb]
type = "X"
pool = "INT_POOL"
exclude_from = ["aa"]

[[template]]
name  = "divisor_sum_phi"
latex = '\sum{lim_mod}_{{d \mid {nn}}} \phi(d) = {nn}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name  = "prime_factorization"
latex = '{nn} = \prod{lim_mod}_{{i=1}}^{{{kk}}} {pp}_i^{{e_i}}'
[template.slots.lim_mod]
type = "S"
pool = ["", '\limits']
[template.slots.nn]
type = "S"
pool = "IDX_POOL"
[template.slots.kk]
type = "X"
pool = "IDX_POOL"
exclude_from = ["nn"]
[template.slots.pp]
type = "S"
pool = "PRIME_BASE_POOL"

[[template]]
name  = "coprime_reduction"
latex = '\gcd({aa},{mm}) = 1 \implies {aa}^{{{nn}}} \equiv {aa}^{{{nn} \bmod \phi({mm})}} \pmod{{{mm}}}'
[template.slots.aa]
type = "S"
pool = "INT_POOL"
[template.slots.mm]
type = "S"
pool = "MOD_POOL"
[template.slots.nn]
type = "S"
pool = "IDX_POOL"

[[template]]
name  = "unique_factorization"
latex = '{nn} = {pp}_1^{{a_1}} \cdots {pp}_{{{kk}}}^{{a_{{{kk}}}}}\quad (\text{{unique up to order}})'
[template.slots.nn]
