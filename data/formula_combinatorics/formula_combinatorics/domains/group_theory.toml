  latex = '{G} \times {H}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]

  [[template.variants]]
  name  = "direct_product_three"
  latex = '{G} \times {H} \times {N_sub}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]
  [template.variants.slots.N_sub]
  type = "X"
