# ---------------------------------------------------------------------------
# Part A — Lagrange's theorem (3 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "lagrange_theorem"
latex = ""

  [[template.variants]]
  name  = "lagrange_divisibility"
  latex = '|{H}| \mid |{G}|'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]

  [[template.variants]]
  name  = "lagrange_index_formula"
  latex = '[{G}:{H}] = \frac{{|{G}|}}{{|{H}|}}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]

  [[template.variants]]
  name  = "lagrange_order_product"
  latex = '|{G}| = [{G}:{H}] \cdot |{H}|'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]

# ---------------------------------------------------------------------------
# Part B — Core standalone templates
# ---------------------------------------------------------------------------

[[template]]
name  = "first_isomorphism_theorem"
latex = '{G}/\ker {phi} \cong \operatorname{{im}}\, {phi}'
[template.slots.G]
type = "S"
pool = "G_POOL"
[template.slots.phi]
type = "S"
pool = "HOMOS"

[[template]]
name  = "second_isomorphism_theorem"
latex = '{H}/({H} \cap {N_sub}) \cong {H}{N_sub}/{N_sub}'
[template.slots.H]
type = "S"
pool = "SIMPLE"
[template.slots.N_sub]
type = "X"
pool = "SIMPLE"
exclude_from = ["H"]

[[template]]
name  = "third_isomorphism_theorem"
latex = '({G}/{N_sub})/({H}/{N_sub}) \cong {G}/{H}'
[template.slots.G]
type = "S"
pool = "G_POOL"
[template.slots.H]
type = "X"
pool = "SIMPLE"
exclude_from = ["G"]
[template.slots.N_sub]
type = "X"
pool = "SIMPLE"
exclude_from = ["G", "H"]

# ---------------------------------------------------------------------------
# Element order (3 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "element_order"
latex = ""

  [[template.variants]]
  name  = "element_order_divides"
  latex = '\operatorname{{ord}}({g_el}) \mid |{G}|'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

  [[template.variants]]
  name  = "element_order_power"
  latex = '{g_el}^{{|{G}|}} = e'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

  [[template.variants]]
  name  = "element_order_lcm"
  latex = '\operatorname{{ord}}({g_el} {h_el}) \mid \operatorname{{lcm}}(\operatorname{{ord}}({g_el}), \operatorname{{ord}}({h_el}))'
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]

[[template]]
name  = "orbit_stabilizer"
latex = '|{G}| = |\operatorname{{Orb}}({g_el})| \cdot |\operatorname{{Stab}}_{{{G}}}({g_el})|'
[template.slots.G]
type = "S"
pool = "G_POOL"
[template.slots.g_el]
type = "S"
pool = "ELEMS"

# ---------------------------------------------------------------------------
# Class equation (2 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "class_equation"
latex = ""

  [[template.variants]]
  name  = "class_equation_center"
  latex = '|{G}| = |Z({G})| + \sum{lim_mod}_{{{g_el}}} [{G} : C_{{{G}}}({g_el})]'
  [template.variants.slots.lim_mod]
  type = "S"
  pool = ["", '\limits']
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

  [[template.variants]]
  name  = "class_equation_conjugacy"
  latex = '|{G}| = \sum{lim_mod}_{{[{g_el}]}} \frac{{|{G}|}}{{|C_{{{G}}}({g_el})|}}'
  [template.variants.slots.lim_mod]
  type = "S"
  pool = ["", '\limits']
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

# ---------------------------------------------------------------------------
# Sylow's theorem (3 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "sylow_theorem"
latex = ""

  [[template.variants]]
  name  = "sylow_order_decomposition"
  latex = '|{G}| = {p}^k m,\quad \gcd({p}, m) = 1'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.p]
  type = "S"
  pool = "P_POOL"

  [[template.variants]]
  name  = "sylow_p_power_divides"
  latex = '{p}^k \mid |{G}|,\quad {p}^{{k+1}} \nmid |{G}|'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.p]
  type = "S"
  pool = "P_POOL"

  [[template.variants]]
  name  = "sylow_count_congruence"
  latex = 'n_{{{p}}}({G}) \mid m,\quad n_{{{p}}}({G}) \equiv 1 \pmod{{{p}}}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.p]
  type = "S"
  pool = "P_POOL"

# ---------------------------------------------------------------------------
# Commutator (2 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "commutator"
latex = ""

  [[template.variants]]
  name  = "commutator_definition"
  latex = '[{g_el}, {h_el}] = {g_el}^{{-1}} {h_el}^{{-1}} {g_el} {h_el}'
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]

  [[template.variants]]
  name  = "commutator_product_rule"
  latex = '[{g_el}, {h_el} {N_sub}] = [{g_el},{h_el}] \cdot [{g_el},{N_sub}]^{{{h_el}}}'
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]
  [template.variants.slots.N_sub]
  type = "S"
  pool = "SIMPLE"

# ---------------------------------------------------------------------------
# Derived subgroup (2 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "derived_subgroup"
latex = ""

  [[template.variants]]
  name  = "derived_subgroup_definition"
  latex = '[{G}, {G}] = \langle [{g_el}, {h_el}] : {g_el}, {h_el} \in {G} \rangle'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]

  [[template.variants]]
  name  = "abelianization"
  latex = '{G}/[{G},{G}] \cong {G}^{{\mathrm{{ab}}}}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"

# ---------------------------------------------------------------------------
# Center of a group (3 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "center_of_group"
latex = ""

  [[template.variants]]
  name  = "center_definition"
  latex = 'Z({G}) = \left\{{{g_el} \in {G} \mid {g_el} {h_el} = {h_el} {g_el}\; \forall {h_el} \in {G}\right\}}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]

  [[template.variants]]
  name  = "center_abelian_iff"
  latex = '{G} \text{{ abelian}} \iff Z({G}) = {G}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"

  [[template.variants]]
  name  = "center_normal_inn"
  latex = 'Z({G}) \trianglelefteq {G},\quad {G}/Z({G}) \cong \operatorname{{Inn}}({G})'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"

# ---------------------------------------------------------------------------
# Conjugacy (2 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "conjugacy"
latex = ""

  [[template.variants]]
  name  = "conjugacy_relation"
  latex = '{g_el} \sim {h_el} \iff \exists\, {n} \in {G} : {n} {g_el} {n}^{{-1}} = {h_el}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]
  [template.variants.slots.n]
  type = "S"
  pool = "N_POOL"

  [[template.variants]]
  name  = "conjugacy_class_size"
  latex = '|[{g_el}]_{{{G}}}| = [{G} : C_{{{G}}}({g_el})]'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

# ---------------------------------------------------------------------------
# Normalizer (2 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "normalizer"
latex = ""

  [[template.variants]]
  name  = "normalizer_definition"
  latex = 'N_{{{G}}}({H}) = \left\{{{g_el} \in {G} : {g_el} {H} {g_el}^{{-1}} = {H}\right\}}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

  [[template.variants]]
  name  = "normal_iff_normalizer"
  latex = '{H} \trianglelefteq {G} \iff N_{{{G}}}({H}) = {G}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]

# ---------------------------------------------------------------------------
# Centralizer (2 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "centralizer"
latex = ""

  [[template.variants]]
  name  = "centralizer_definition"
  latex = 'C_{{{G}}}({g_el}) = \left\{{{h_el} \in {G} : {h_el} {g_el} = {g_el} {h_el}\right\}}'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]

  [[template.variants]]
  name  = "centralizer_class_size"
  latex = '|{G}| = |C_{{{G}}}({g_el})| \cdot |[{g_el}]|'
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

# ---------------------------------------------------------------------------
# Homomorphism properties (3 variants)
# ---------------------------------------------------------------------------

[[template]]
name  = "homomorphism_properties"
latex = ""

  [[template.variants]]
  name  = "homomorphism_multiplicativity"
  latex = '{phi}({g_el} {h_el}) = {phi}({g_el})\,{phi}({h_el})'
  [template.variants.slots.phi]
  type = "S"
  pool = "HOMOS"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"
  [template.variants.slots.h_el]
  type = "X"
  pool = "ELEMS"
  exclude_from = ["g_el"]

  [[template.variants]]
  name  = "homomorphism_identity_inverse"
  latex = '{phi}({g_el}^{{-1}}) = {phi}({g_el})^{{-1}},\quad {phi}(e) = e'
  [template.variants.slots.phi]
  type = "S"
  pool = "HOMOS"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

  [[template.variants]]
  name  = "isomorphism_bijective_homo"
  latex = '{phi} : {G} \to {H} \text{{ iso.}} \iff {phi} \text{{ bij. hom.}}'
  [template.variants.slots.phi]
  type = "S"
  pool = "HOMOS"
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]

