[[template]]
name  = "kernel"
latex = ""

  [[template.variants]]
  name  = "kernel_definition"
  latex = '\ker {phi} = \left\{{{g_el} \in {G} : {phi}({g_el}) = e\right\}}'
  [template.variants.slots.phi]
  type = "S"
  pool = "HOMOS"
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.g_el]
  type = "S"
  pool = "ELEMS"

  [[template.variants]]
  name  = "kernel_normal_embedding"
  latex = '\ker {phi} \trianglelefteq {G},\quad {G}/\ker {phi} \hookrightarrow {H}'
  [template.variants.slots.phi]
  type = "S"
  pool = "HOMOS"
  [template.variants.slots.G]
  type = "S"
  pool = "G_POOL"
  [template.variants.slots.H]
  type = "X"
  pool = "SIMPLE"
  exclude_from = ["G"]

