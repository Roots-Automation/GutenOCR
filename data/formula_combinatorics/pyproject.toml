[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formula-combinatorics"
version = "0.1.0"
description = "Synthetic LaTeX mathematical formula generator for OCR training"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Roots Automation"},
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
formula-generate = "formula_combinatorics.generate:main"

[project.urls]
"Homepage" = "https://github.com/Roots-Automation/GutenOCR"
"Bug Tracker" = "https://github.com/Roots-Automation/GutenOCR/issues"

[tool.setuptools.packages.find]
include = ["formula_combinatorics*"]
