[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "index-definition"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.2.0",
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "scipy",
    "nltk",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
index-generate = "generate:main"
index-package  = "package:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["slow: requires fonts and wordnet"]

[tool.setuptools]
py-modules = ["generate", "package", "serialization", "pillow_compat", "annotations"]

[tool.setuptools.packages.find]
where = ["."]
