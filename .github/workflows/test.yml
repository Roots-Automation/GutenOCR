name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: data/formula_combinatorics
      - name: Run fast tests
        run: uv run pytest tests/ -m 'not slow and not render' -q
        working-directory: data/formula_combinatorics

  render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: data/formula_combinatorics
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install katex
        run: npm install katex
        working-directory: data/formula_combinatorics
      - name: Run render tests
        run: uv run pytest tests/ -m render -q
        working-directory: data/formula_combinatorics

  calibration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --extra dev
        working-directory: data/formula_combinatorics
      - name: Run calibration tests
        run: uv run pytest tests/test_calibration.py -m slow -v
        working-directory: data/formula_combinatorics
